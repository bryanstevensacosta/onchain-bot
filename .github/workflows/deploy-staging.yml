name: Deploy to staging

# Automatically triggered on push to dev, waits for CI to pass before deploying
on:
  push:
    branches: [dev]
    # ANTI-DOUBLE-FIRE (item 9b): the staging push leg owns backend/frontend/
    # shared paths ONLY. Ingestion paths are owned by the twin chain
    # (workflow_run leg below): an ingestion-only dev push fires the twin lane
    # in Deploy Ingestion Service, whose completion redeploys staging via the
    # chain — building here too would deploy staging twice (deterministic
    # double-fire). Mixed pushes skip here via preflight (skip-when-chain-ran).
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'scripts/**'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-staging.yml'
      # NOT apps/ingestion-telegram/** nor deploy-ingestion.yml (chain-owned)
  workflow_dispatch:
    inputs:
      lane:
        description: 'Lane: full deploy (default) or dispatch-only rollback lane (never auto)'
        required: false
        default: 'full'
        type: choice
        # Rollback lanes (item 9c): re-raise the last GOOD namespaced pin.
        # Dispatch-only, never on push/chain.
        options: [full, rollback-backend-staging, rollback-frontend-staging]
  # CHAIN (item 9a): gemelo OK ⇒ backend staging ⇒ frontend staging (both in
  # the deploy-staging job, backend steps before frontend steps).
  # NOTE default-branch semantics: workflow_run ALWAYS evaluates THIS file's
  # definition from the DEFAULT branch (master) — the upstream SHA is pinned
  # explicitly via github.event.workflow_run.head_sha (preflight job), never
  # assumed from github.sha, or the chain drifts off the tested commit.
  workflow_run:
    workflows: ['Deploy Ingestion Service']
    types: [completed]
    branches: [dev]

permissions:
  contents: read
  packages: write

jobs:
  # PREFLIGHT (item 9a/9b/9f): resolves the effective SHA + whether this run
  # owns the deploy. Chain legs never re-trigger their upstream (no push, no
  # dispatch here — exit via outputs only), and bot-actor upstreams are
  # excluded (anti-loop). Contract literal: conclusion==success (bash
  # string-compare in Decide ownership below). Dispatch logs an explicit
  # bypass-with-reason when it skips a gate instead of staying silent.
  preflight:
    name: Preflight (chain guard + context)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deploy: ${{ steps.decide.outputs.run_deploy }}
      effective_sha: ${{ steps.decide.outputs.effective_sha }}
      trigger_note: ${{ steps.decide.outputs.trigger_note }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin the upstream SHA on chain runs (default-branch definition
          # would otherwise build github.sha = master HEAD, not the tested
          # twin commit).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Decide ownership
        id: decide
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          NOTE=""
          SHA="${{ github.sha }}"
          RUN="false"
          if [ "$EVENT" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            ACTOR="${{ github.event.workflow_run.actor.login }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
            if [ "$ACTOR" = "github-actions[bot]" ]; then
              NOTE="chain SKIP: upstream actor is github-actions[bot] (anti-loop)"
            elif [ "$CONCLUSION" != "success" ]; then
              NOTE="chain SKIP: upstream conclusion=$CONCLUSION (broken twin link does not propagate)"
            else
              RUN="true"
              NOTE="chain OWN: twin success @ $SHA (pinned ref; CI gate re-runs below, same as push)"
            fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "${{ inputs.lane }}" = "full" ]; then
              RUN="true"
              NOTE="dispatch OWN lane=full (explicit; CI gate bypass logged below with reason — never silent)"
            else
              NOTE="dispatch OWN lane=${{ inputs.lane }} (rollback job owns it, not the deploy legs)"
            fi
          else
            # push: skip-when-chain-ran — if this dev push touched ingestion
            # paths, the twin lane fired too and its chain leg redeploys
            # staging after the twin is green. Deploying on push as well =
            # the deterministic double-fire.
            # Range is event.before..HEAD (not HEAD~1: multi-commit pushes
            # would miss ingestion paths touched below the tip).
            BASE="${{ github.event.before }}"
            if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
              git fetch origin "$BASE" --depth=1 2>/dev/null || true
              CHANGED="$(git diff --name-only "$BASE" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
            else
              CHANGED="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
            fi
            if printf '%s' "$CHANGED" | grep -qE '^(apps/ingestion-telegram/|\.github/workflows/deploy-ingestion\.yml$)'; then
              NOTE="push SKIP: ingestion paths touched — twin chain owns this deploy (skip-when-chain-ran)"
            else
              RUN="true"
              NOTE="push OWN: no ingestion paths touched"
            fi
          fi
          echo "run_deploy=$RUN" >> "$GITHUB_OUTPUT"
          echo "effective_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "trigger_note=$NOTE" >> "$GITHUB_OUTPUT"
          echo "$NOTE"

      - name: Context summary
        run: |
          {
            echo "### Preflight (staging chain guard)"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| event | ${{ github.event_name }} |"
            echo "| decision | ${{ steps.decide.outputs.trigger_note }} |"
            echo "| effective_sha | ${{ steps.decide.outputs.effective_sha }} |"
            echo "| run_deploy | ${{ steps.decide.outputs.run_deploy }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Gate: Wait for CI to complete successfully before proceeding
  wait-for-ci:
    name: Wait for CI to pass
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (for gh CLI context)
        uses: actions/checkout@v4
        if: github.event_name == 'push' || github.event_name == 'workflow_run'

      - name: Wait for CI workflow to complete
        # Chain runs execute the SAME gate as push (item 9f: dispatch is the
        # only leg that bypasses, and it logs the reason). The polled commit
        # is the effective SHA (upstream head on chain runs), not master HEAD.
        if: github.event_name == 'push' || github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "⏳ Waiting for CI workflow to complete on commit ${{ github.event.workflow_run.head_sha || github.sha }}..."

          # Wait up to 10 minutes (600 seconds)
          MAX_WAIT=600
          ELAPSED=0
          INTERVAL=10

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            # Get the status of the CI workflow for this commit
            STATUS=$(gh run list \
              --commit ${{ github.event.workflow_run.head_sha || github.sha }} \
              --workflow ci.yml \
              --json conclusion,status \
              --jq '.[0] | {status: .status, conclusion: .conclusion}')
            
            echo "Current CI status: $STATUS"
            
            # Extract status and conclusion
            RUN_STATUS=$(echo "$STATUS" | jq -r '.status')
            RUN_CONCLUSION=$(echo "$STATUS" | jq -r '.conclusion')
            
            # Check if completed
            if [ "$RUN_STATUS" = "completed" ]; then
              if [ "$RUN_CONCLUSION" = "success" ]; then
                echo "✅ CI workflow passed!"
                exit 0
              else
                echo "❌ CI workflow failed with conclusion: $RUN_CONCLUSION"
                exit 1
              fi
            fi
            
            echo "CI still running... waiting ${INTERVAL}s (${ELAPSED}s/${MAX_WAIT}s elapsed)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "❌ Timeout waiting for CI workflow to complete after ${MAX_WAIT}s"
          exit 1

      - name: CI check bypassed (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "✅ Manual deploy - CI check skipped"
          # EXPLICIT BYPASS (item 9f): dispatch skips the CI gate — logged
          # with reason in the summary, never silent.
          {
            echo "### CI gate bypass (dispatch)"
            echo ""
            echo "lane=${{ inputs.lane }} — operator-triggered, CI gate skipped explicitly."
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push-staging:
    needs: [wait-for-ci, preflight]
    if: needs.preflight.outputs.run_deploy == 'true'
    timeout-minutes: 30
    name: Build and push staging to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the effective SHA (pinned twin commit on chain runs),
          # not default-branch HEAD — the image tag carries effective_sha,
          # so the source must match the tag.
          ref: ${{ needs.preflight.outputs.effective_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend (staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:staging-${{ needs.preflight.outputs.effective_sha }},ghcr.io/${{ github.repository }}-backend:staging-latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-backend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-backend:cache,mode=max
          platforms: linux/amd64,linux/arm64
          # T2 version-match: bake run SHA (backend Dockerfile declares no such
          # ARG, so consumed-ignored — harmless). SHA var: effective_sha (push:
          # github.sha; chain: pinned twin head_sha), matching tags on all legs.
          build-args: |
            IMAGE_REVISION=${{ needs.preflight.outputs.effective_sha }}
            NODE_ENV=staging

      - name: Build and push frontend (staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:staging-${{ needs.preflight.outputs.effective_sha }},ghcr.io/${{ github.repository }}-frontend:staging-latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-frontend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-frontend:cache,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            IMAGE_REVISION=${{ needs.preflight.outputs.effective_sha }}
            VITE_APP_ENV=staging

  deploy-staging:
    name: Deploy to staging
    runs-on: [self-hosted, oracle]
    # CONCURRENCY (item 9d): job-level single-flight on ONE shared group per
    # physical target across all 3 deploy workflows. Staging target =
    # /opt/onchain-bot-staging (this job + the twin lane + staging rollback
    # of deploy-ingestion.yml share it — this closes the
    # twin-vs-deploy-staging race). Job-level (not top-level) so
    # preflight/build jobs stay unguarded.
    # cancel-in-progress:false — lanes run migrations; killing one
    # mid-migration corrupts schema state. Tradeoff accepted and documented:
    # a broken commit blocks the queue behind it (operator cancels
    # queued-not-running runs by hand). Policy: supersede-queued-not-running
    # ONLY, never kill a running lane.
    concurrency:
      group: ingestion-staging-target
      cancel-in-progress: false
    needs: [preflight, build-and-push-staging]
    if: needs.preflight.outputs.run_deploy == 'true'
    timeout-minutes: 40
    environment: staging
    # T4 auto-rollback contract (mirror of deploy.yml prod): smoke_entered is
    # true once the post-deploy smoke phase starts — only post-smoke-rojo
    # triggers auto-rollback, never a red deploy before smoke.
    outputs:
      smoke_entered: ${{ steps.smoke-marker.outputs.smoke_entered }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Same pin as the build job: the rsynced tree below must come from
          # the deployed commit, not default-branch HEAD.
          ref: ${{ needs.preflight.outputs.effective_sha }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix ownership before sync (chown -R runner:runner)
        run: |
          echo "=== chown -R runner:runner /opt/onchain-bot-staging ==="
          sudo chown -R runner:runner /opt/onchain-bot-staging || chown -R runner:runner /opt/onchain-bot-staging || echo 'chown warning (non-fatal)'
          echo "=== ownership fixed ==="

      - name: Sync live source tree with dev
        run: |
          set -euo pipefail
          mkdir -p /opt/onchain-bot-staging
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.git/**' \
            --exclude='node_modules' \
            --exclude='node_modules/**' \
            --exclude='dist' \
            --exclude='dist/**' \
            --exclude='backups' \
            --exclude='backups/**' \
            --exclude='logs' \
            --exclude='logs/**' \
            --exclude='.env*' \
            /opt/actions-runner/_work/onchain-bot/onchain-bot/ \
            /opt/onchain-bot-staging/
          echo "=== Sync complete ==="

      - name: Clean stale node_modules (rsync --exclude prevents deletion)
        run: |
          echo "=== Removing stale node_modules that rsync --exclude preserves ==="
          find /opt/onchain-bot-staging -name node_modules -type d -prune -exec rm -rf {} + 2>/dev/null || true
          echo "=== Done ==="

      - name: Ensure .env.staging exists
        run: |
          mkdir -p /opt/onchain-bot-staging/apps/backend

          # Backend .env.staging
          if [ ! -f /opt/onchain-bot-staging/apps/backend/.env.staging ]; then
            echo "=== First deploy: creating backend .env.staging ==="
            touch /opt/onchain-bot-staging/apps/backend/.env.staging
            echo "⚠️  WARNING: backend .env.staging created empty — update manually"
          fi

          echo "✅ Backend .env.staging ensured"

      - name: Inject staging env vars from GitHub
        run: |
          if ! grep -q "USE_MOCK_AI" /opt/onchain-bot-staging/apps/backend/.env.staging 2>/dev/null; then
            echo "USE_MOCK_AI=true" >> /opt/onchain-bot-staging/apps/backend/.env.staging
            echo "=== Added USE_MOCK_AI=true to .env.staging ==="
          else
            echo "=== USE_MOCK_AI already present in .env.staging ==="
          fi

      - name: Backup staging DB (if exists)
        run: |
          STAGING_PG="$(docker ps --format '{{.Names}}' | grep -E '^(onchain-bot-postgres-staging|onchain-bot-staging-postgres)$' | head -n 1 || true)"
          if [ -n "$STAGING_PG" ]; then
            mkdir -p /data/backups/staging
            docker exec "$STAGING_PG" pg_dump -U alpha_meta_token_scanner \
              alpha_meta_token_scanner_staging > /data/backups/staging/staging-backup-$(date +%Y%m%d-%H%M%S).sql || true
            # Cleanup backups older than 7 days
            find /data/backups/staging -maxdepth 1 -name 'staging-backup-*.sql' -mtime +7 -delete 2>/dev/null || true
          fi

      - name: Disk cleanup (pre-pull, filtered)
        run: |
          echo "=== Disk before ==="
          df -h | head -20
          docker system df 2>&1 | head -20
          echo "=== Pruning (filtered, no volumes) ==="
          docker system prune -af --filter "until=24h" 2>&1 | tail -20 || true
          docker builder prune -af --filter "until=24h" 2>&1 | tail -10 || true
          sudo journalctl --vacuum-time=3d 2>&1 | tail -5 || true
          sudo journalctl --vacuum-size=100M 2>&1 | tail -5 || true
          sudo rm -f /opt/actions-runner/_diag/Worker_*.log 2>&1 | tail -5 || true
          echo "=== Disk after ==="
          df -h | head -20
          PCT=$(df / | tail -1 | awk '{print $5}' | tr -d '%'); if [ "$PCT" -gt 80 ]; then echo "::warning::disk ${PCT}% full"; fi

      - name: Pull images from GHCR (staging)
        run: |
          echo "=== Pulling backend staging ${{ needs.preflight.outputs.effective_sha }} (try sha, fallback latest) ==="
          docker pull ghcr.io/${{ github.repository }}-backend:staging-${{ needs.preflight.outputs.effective_sha }} || docker pull ghcr.io/${{ github.repository }}-backend:staging-latest
          docker tag ghcr.io/${{ github.repository }}-backend:staging-${{ needs.preflight.outputs.effective_sha }} ghcr.io/${{ github.repository }}-backend:staging-latest 2>/dev/null || true
          echo "=== Pulling frontend staging ${{ needs.preflight.outputs.effective_sha }} (try sha, fallback latest) ==="
          docker pull ghcr.io/${{ github.repository }}-frontend:staging-${{ needs.preflight.outputs.effective_sha }} || docker pull ghcr.io/${{ github.repository }}-frontend:staging-latest
          docker tag ghcr.io/${{ github.repository }}-frontend:staging-${{ needs.preflight.outputs.effective_sha }} ghcr.io/${{ github.repository }}-frontend:staging-latest 2>/dev/null || true
          docker images | head -20

      - name: Configure deploy environment
        run: |
          if [ -n "${{ secrets.REDIS_PASSWORD }}" ]; then
            echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" > /opt/onchain-bot-staging/apps/backend/.env
          else
            rm -f /opt/onchain-bot-staging/apps/backend/.env
          fi

      - name: Stop old containers (if hung)
        run: |
          echo "=== Forcefully stopping old containers ==="
          docker compose -f /opt/onchain-bot-staging/apps/backend/docker-compose.staging.yml stop backend --time 5 || true
          docker compose -f /opt/onchain-bot-staging/apps/backend/docker-compose.staging.yml rm -f backend || true
          echo "=== Old containers removed ==="
          docker ps -a | grep -i "backend\|ingestion" || true
          sleep 2

      - name: Ensure staging databases running
        run: |
          set -euo pipefail
          echo "=== Ensuring staging postgres+redis running ==="
          docker compose -f /opt/onchain-bot-staging/apps/backend/docker-compose.staging.yml up -d postgres redis
          echo "=== Waiting for postgres+redis healthy (max 60s) ==="
          for i in $(seq 1 12); do
            PG=$(docker inspect --format '{{.State.Health.Status}}' onchain-bot-postgres-staging 2>/dev/null || echo "missing")
            RD=$(docker inspect --format '{{.State.Health.Status}}' onchain-bot-redis-staging 2>/dev/null || echo "missing")
            echo "  attempt $i/12: postgres=$PG redis=$RD"
            if [ "$PG" = "healthy" ] && [ "$RD" = "healthy" ]; then
              echo "✓ Staging databases healthy"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "❌ Staging databases not healthy after 60s (postgres=$PG redis=$RD)"
              echo "=== postgres logs (last 30) ==="
              docker logs --tail 30 onchain-bot-postgres-staging 2>&1 || true
              echo "=== redis logs (last 30) ==="
              docker logs --tail 30 onchain-bot-redis-staging 2>&1 || true
              exit 1
            fi
            sleep 5
          done

      - name: Verify twin healthy before backend migrations (ordering gate)
        run: |
          # Staging mirror of the prod ordering gate (deploy.yml): the twin
          # (:3033) must serve feed sources before staging backend migrations
          # run. Liveness backstop — the T2 version-match gate below adds the
          # SHA comparison on chain legs without replacing this.
          echo "=== Ordering gate: staging twin must serve feed sources ==="
          for i in $(seq 1 12); do
            if curl -sf http://localhost:3033/api/feed/sources > /tmp/twin-gate.json 2>&1; then
              echo "✅ Twin healthy on attempt $i (sources endpoint 200)"
              head -c 300 /tmp/twin-gate.json; echo
              break
            fi
            echo "⏳ Twin not serving (attempt $i/12), retrying in 10s..."
            sleep 10
            if [ "$i" -eq 12 ]; then
              echo "::error::Staging twin is NOT serving :3033/api/feed/sources after 120s. Aborting staging backend deploy: deploy the twin FIRST (dispatch deploy-ingestion target=staging), then re-run this workflow."
              exit 1
            fi
          done

      - name: Version-match gate (served revision vs run SHA, chain legs only)
        run: |
          # T2 version-match (prod-safety-gates item 2): the serving twin must
          # expose THIS run's SHA via /api/health.imageRevision. Runs BEFORE
          # staging backend migrations (mismatch aborts here). CHAIN-ONLY by
          # design (same deadlock analysis as prod deploy.yml: push/dispatch
          # legs legitimately serve a different twin SHA) — explicit SKIP on
          # those legs, liveness gate above stays as backstop (item 9f).
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "version-match SKIP (${{ github.event_name }} leg): served revision only comparable on chain legs — liveness gate above is the backstop"
            exit 0
          fi
          EXPECTED="${{ needs.preflight.outputs.effective_sha }}"
          SERVED="$(curl -sf --max-time 10 http://localhost:3033/api/health | jq -r '.imageRevision // "unknown"')"
          echo "version-match: run SHA=$EXPECTED served imageRevision=$SERVED"
          if [ "$SERVED" != "$EXPECTED" ]; then
            echo "::error::esperaba $EXPECTED, sirve $SERVED — reintentar tras ingestion"
            exit 1
          fi
          echo "✅ version-match: staging twin :3033 serves $EXPECTED"

      - name: Dry-run migrations (read-only, fail loudly)
        run: |
          set -euo pipefail
          echo "=== Dry-run: pending migrations in staging (migration:show, read-only, no writes) ==="
          cd /opt/onchain-bot-staging/apps/backend

          if docker compose -f docker-compose.staging.yml run --rm --no-deps \
            -e NODE_ENV=staging \
            -e POSTGRES_HOST=postgres \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=alpha_meta_token_scanner \
            -e POSTGRES_PASSWORD=alpha_meta_token_scanner \
            -e POSTGRES_DB=alpha_meta_token_scanner_staging \
            backend npm run migration:show; then
            echo "✅ migration:show OK"
          else
            echo "::error::Staging migration dry-run FAILED (migration:show). Aborting deploy before any write."
            exit 1
          fi

          echo "=== Dry-run: precondition probe (read-only SELECT, no writes) ==="
          if docker compose -f docker-compose.staging.yml run --rm --no-deps \
            -e NODE_ENV=staging \
            -e POSTGRES_HOST=postgres \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=alpha_meta_token_scanner \
            -e POSTGRES_PASSWORD=alpha_meta_token_scanner \
            -e POSTGRES_DB=alpha_meta_token_scanner_staging \
            backend npm run typeorm -- query "SELECT 1 AS dry_run_ok"; then
            echo "✅ precondition probe OK"
          else
            echo "::error::Staging migration precondition probe FAILED (read-only SELECT). Aborting deploy before any write."
            exit 1
          fi

          echo "=== Staging dry-run OK: zero writes performed ==="

      - name: Run migrations (staging environment)
        run: |
          set -euo pipefail
          echo "=== Running TypeORM migrations in staging ==="
          cd /opt/onchain-bot-staging/apps/backend

          # Run migrations inside a temporary Docker container
          # Use --no-deps to avoid starting ingestion-telegram during migrations
          # (ingestion-telegram port 3032 is still occupied from previous deploy)
          docker compose -f docker-compose.staging.yml run --rm --no-deps \
            -e NODE_ENV=staging \
            -e POSTGRES_HOST=postgres \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=alpha_meta_token_scanner \
            -e POSTGRES_PASSWORD=alpha_meta_token_scanner \
            -e POSTGRES_DB=alpha_meta_token_scanner_staging \
            backend npm run migration:run

          echo "=== Migrations applied successfully ==="

      - name: Deploy backend (GHCR, no build)
        run: |
          docker compose -f /opt/onchain-bot-staging/apps/backend/docker-compose.staging.yml up -d backend

      - name: Wait for backend healthcheck
        run: |
          echo "=== Waiting for backend to become healthy (max 5 min) ==="
          for i in $(seq 1 30); do
            if curl -v -sf http://localhost:3031/api/health > /tmp/health-backend.log 2>&1; then
              echo "✓ Backend is healthy (attempt $i)"
              cat /tmp/health-backend.log
              break
            fi
            echo "  Waiting... attempt $i/30"
            if [ "$i" -eq 10 ] || [ "$i" -eq 20 ] || [ "$i" -eq 30 ]; then
              echo "  --- curl -v output (attempt $i) ---"
              curl -v http://localhost:3031/api/health 2>&1 | head -30 || true
              echo "  --- end curl output ---"
            fi
            sleep 10
            if [ "$i" -eq 30 ]; then
              echo "❌ Backend healthcheck failed after 30 attempts (5 minutes total)"
              echo "=== Final curl -v output ==="
              curl -v http://localhost:3031/api/health 2>&1 || true
              echo "=== Backend container logs (last 50 lines) ==="
              docker logs --tail 50 onchain-bot-backend-staging 2>&1 || true
              echo "=== Backend container status ==="
              docker ps -a -f name=onchain-bot-backend-staging || true
              exit 1
            fi
          done

      - name: Deploy frontend (GHCR, no build)
        run: |
          docker compose -f /opt/onchain-bot-staging/apps/backend/docker-compose.staging.yml up -d frontend

      - name: Wait for frontend healthcheck
        run: |
          echo "=== Waiting for frontend to become healthy ==="
          for i in $(seq 1 60); do
            if curl -v -sf -o /dev/null http://localhost:4173/ > /tmp/health-frontend.log 2>&1; then
              echo "✓ Frontend is healthy (attempt $i)"
              cat /tmp/health-frontend.log
              break
            fi
            echo "  Waiting... attempt $i/60"
            if [ "$i" -eq 5 ] || [ "$i" -eq 15 ] || [ "$i" -eq 30 ] || [ "$i" -eq 45 ]; then
              echo "  --- curl -v output (attempt $i) ---"
              curl -v http://localhost:4173/ 2>&1 | head -30 || true
              echo "  --- end curl output ---"
            fi
            sleep 2
            if [ "$i" -eq 60 ]; then
              echo "❌ Frontend healthcheck failed after 60 attempts"
              echo "=== Final curl -v output ==="
              curl -v http://localhost:4173/ 2>&1 || true
              exit 1
            fi
          done

      - name: Install socat services for staging
        run: |
          bash /opt/onchain-bot-staging/scripts/install-socat-services.sh staging || true

      - name: Healthcheck backend (Tailscale)
        run: |
          echo "=== Tailscale backend healthcheck (curl -v) ==="
          curl -v -sf http://100.110.169.120:3031/api/health || { echo "BACKEND HEALTHCHECK FAILED"; exit 1; }

      - name: Healthcheck frontend (Tailscale)
        run: |
          echo "=== Tailscale frontend healthcheck (curl -v) ==="
          curl -v -sf -o /dev/null http://100.110.169.120:4173/ || { echo "FRONTEND HEALTHCHECK FAILED"; exit 1; }

      - name: Mark smoke entered (T4 auto-rollback gate signal)
        id: smoke-marker
        run: echo "smoke_entered=true" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke checks (read-only)
        env:
          SMOKE_BACKEND_URL: http://localhost:3031
          SMOKE_FRONTEND_URL: http://localhost:4173
          # STAGING TWIN (per-env-ingestion T3): smoke probes the twin on :3033,
          # NOT the singleton on :3032. Twin serves 200 with [] when empty
          # (explicit-empty-OK); 0 messages after seeding + one poll window = FAIL.
          SMOKE_INGESTION_URL: http://localhost:3033
          SMOKE_TIMEOUT: 10
          SMOKE_SSE_TIMEOUT: 8
        run: |
          set -euo pipefail
          echo "=== Post-deploy smoke (staging ports, read-only probes) ==="
          bash scripts/smoke-prod.sh
          echo "=== Smoke complete ==="

      - name: Pin :staging-prev-backend / :staging-prev-frontend on GOOD deploy (rollback contract)
        # Contract (item 9c consumes it): namespaced pins, NEVER bare
        # :staging-prev (one tag per lane — the twin's :staging-prev pins the
        # INGESTION image in the same repo and must never collide). Runs only
        # after smoke passed = GOOD deploy by def.
        run: |
          set -euo pipefail
          SHA="${{ needs.preflight.outputs.effective_sha || github.sha }}"
          docker tag ghcr.io/${{ github.repository }}-backend:staging-"$SHA" ghcr.io/${{ github.repository }}-backend:staging-prev-backend \
            || docker tag ghcr.io/${{ github.repository }}-backend:staging-latest ghcr.io/${{ github.repository }}-backend:staging-prev-backend
          docker push ghcr.io/${{ github.repository }}-backend:staging-prev-backend
          echo "pinned backend:staging-prev-backend @ $SHA"
          docker tag ghcr.io/${{ github.repository }}-frontend:staging-"$SHA" ghcr.io/${{ github.repository }}-frontend:staging-prev-frontend \
            || docker tag ghcr.io/${{ github.repository }}-frontend:staging-latest ghcr.io/${{ github.repository }}-frontend:staging-prev-frontend
          docker push ghcr.io/${{ github.repository }}-frontend:staging-prev-frontend
          echo "pinned frontend:staging-prev-frontend @ $SHA"

      - name: Smoke summary (versions + health links per link)
        # SMOKE FORMAT (item 9e): one row per link — version deployed, health
        # URL, probe result. Mirrors scripts/smoke-prod.sh probe order.
        run: |
          SHA="${{ needs.preflight.outputs.effective_sha || github.sha }}"
          {
            echo "### Smoke staging (deploy ${SHA})"
            echo ""
            echo "| eslabón | versión | health | resultado |"
            echo "|---|---|---|---|"
            echo "| backend | backend:staging-${SHA} | http://localhost:3031/api/health | smoke-prod.sh §1,4,6,7 |"
            echo "| frontend | frontend:staging-${SHA} | http://localhost:4173/ | smoke-prod.sh §2 |"
            echo "| twin | ingestion @ twin lane | http://localhost:3033/api/feed/sources | smoke-prod.sh §3,5 |"
            echo "| trigger | ${{ needs.preflight.outputs.trigger_note }} | | |"
          } >> "$GITHUB_STEP_SUMMARY"

  restart-services:
    name: Restart services
    # Single-flight on the shared staging target (item 9d; cancel-in-progress:false — never kill a running lane).
    concurrency:
      group: ingestion-staging-target
      cancel-in-progress: false
    # result=='success' (not success()): with skip-when-chain-ran the deploy
    # job can SKIP, and success() is true on skipped upstreams — restarting on
    # a skip would recreate services for no reason.
    if: needs.deploy-staging.result == 'success'
    timeout-minutes: 10
    runs-on: [self-hosted, oracle]
    needs: [deploy-staging]
    steps:
      - name: Restart staging backend + frontend
        run: |
          echo "=== Restarting staging ==="
          cd /opt/onchain-bot-staging/apps/backend && docker compose -f docker-compose.staging.yml up -d --force-recreate backend frontend

  # AUTO-ROLLBACK (prod-safety-gates item 4, staging mirror) — fires ONLY on
  # post-smoke-rojo (deploy-staging FAILED + smoke entered). Same doctrine as
  # prod: inline reuse of lane mechanics (pins/tags/compose/health gates), no
  # new-run dispatch (deadlock on ingestion-staging-target), lanes serialized,
  # budget <60s per lane, dispatch lanes stay manual-only.
  auto-rollback-backend-staging:
    name: Auto-rollback backend staging on smoke failure (:staging-prev-backend)
    runs-on: [self-hosted, oracle]
    # Single-flight on the shared staging target (item 9d; cancel-in-progress:false — never kill a running lane).
    concurrency:
      group: ingestion-staging-target
      cancel-in-progress: false
    needs: [deploy-staging]
    if: failure() && needs.deploy-staging.outputs.smoke_entered == 'true'
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record auto-rollback decision
        run: |
          {
            echo "### Auto-rollback backend staging (smoke rojo → :staging-prev-backend → :3031)"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| trigger | post-deploy smoke FAILED (deploy-staging red, smoke entered) |"
            echo "| target | backend:staging-prev-backend → :3031 |"
            echo "| manual escape | dispatch lane=rollback-backend-staging intacto |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pull rollback target :staging-prev-backend (read-only, no retag yet)
        run: |
          set -euo pipefail
          echo "ROLLBACK_T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/auto-backend-staging-rollback-t0
          docker pull ghcr.io/${{ github.repository }}-backend:staging-prev-backend || { echo "::error::no backend:staging-prev-backend pinned (pins on GOOD deploys only) — auto-rollback inexecutable → ESCALATE (second level, see failure step)"; exit 1; }

      - name: Stop backend staging (bounded grace, --timeout 30)
        run: |
          set -euo pipefail
          cd /opt/onchain-bot-staging/apps/backend
          docker compose -f docker-compose.staging.yml stop --timeout 30 backend
          if docker ps --format '{{.Names}}' | grep -qx 'onchain-bot-backend-staging'; then
            echo "::error::REFUSE: backend container still running — investigate instead of starting a second one"
            exit 1
          fi
          echo "OK: backend stopped — safe to start exactly one"

      - name: Recreate backend from :staging-prev-backend (no pull — local retag wins)
        run: |
          set -euo pipefail
          docker tag ghcr.io/${{ github.repository }}-backend:staging-prev-backend ghcr.io/${{ github.repository }}-backend:staging-latest
          cd /opt/onchain-bot-staging/apps/backend
          docker compose -f docker-compose.staging.yml up -d --force-recreate backend

      - name: Healthcheck gate (:3031) + post-rollback asserts + downtime measured
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf --max-time 8 http://localhost:3031/api/health >/dev/null 2>&1; then
              echo "backend healthy after ~$((i * 10))s"
              break
            fi
            [ "$i" -eq 30 ] && { echo "::error::staging backend healthcheck failed after auto-rollback — ESCALATE (second level, see failure step)"; exit 1; }
            sleep 10
          done
          curl -s http://localhost:3031/api/health | jq '.'
          echo "ROLLBACK_T1=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/auto-backend-staging-rollback-t1
          echo "downtime window: $(cat /tmp/auto-backend-staging-rollback-t0) → $(cat /tmp/auto-backend-staging-rollback-t1)"
          {
            echo "### Auto-rollback backend staging OK"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| target | backend:staging-prev-backend → :3031 |"
            echo "| ventana | $(cat /tmp/auto-backend-staging-rollback-t0) → $(cat /tmp/auto-backend-staging-rollback-t1) |"
            echo "| asserts | health 200 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Second-level escalation (auto-rollback FAILED)
        if: failure()
        run: |
          {
            echo "### ESCALATION segundo nivel — auto-rollback backend staging FALLIDO"
            echo ""
            echo "1. CONGELAR lanes: no re-disparar rollback (sin re-loops). Lock manual: avisar al operador ANTES de cualquier dispatch/retry."
            echo "2. AVISAR operador con ventana de downtime: $(cat /tmp/auto-backend-staging-rollback-t0 2>/dev/null || echo T0-desconocido) → $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo "3. DUMP pre-deploy: artifact /data/backups/staging/staging-backup-*.sql citado en los logs del job deploy-staging — adjuntar filename al incident record."
            echo "4. INVALIDAR pin envenenado: si :staging-prev-backend también está rojo, no reintentarlo — forward-fix (nuevo sha) o restore."
            echo "5. DB restore = decisión HUMANA explícita (jamás automática, jamás segundo rollback en loop): stop → psql del artifact → start → migration:show + counts asserts (runbook docs/deployment/backend-frontend-rollback.md §5)."
            echo "6. Presupuesto: rollback <60s por lane; sin verde en 2 ventanas de healthcheck → forward-fix-or-restore."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::ESCALATION segundo nivel: auto-rollback backend staging fallido — lanes congelados, operador requerido (ver summary)"

  auto-rollback-frontend-staging:
    name: Auto-rollback frontend staging on smoke failure (:staging-prev-frontend)
    runs-on: [self-hosted, oracle]
    # Single-flight on the shared staging target (item 9d; cancel-in-progress:false — never kill a running lane).
    concurrency:
      group: ingestion-staging-target
      cancel-in-progress: false
    needs: [deploy-staging, auto-rollback-backend-staging]
    if: always() && needs.deploy-staging.result == 'failure' && needs.deploy-staging.outputs.smoke_entered == 'true'
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record auto-rollback decision
        run: |
          {
            echo "### Auto-rollback frontend staging (smoke rojo → :staging-prev-frontend → :4173)"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| trigger | post-deploy smoke FAILED (deploy-staging red, smoke entered) |"
            echo "| target | frontend:staging-prev-frontend → :4173 |"
            echo "| orden | tras auto-rollback-backend-staging (serializado, un writer docker) |"
            echo "| manual escape | dispatch lane=rollback-frontend-staging intacto |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pull rollback target :staging-prev-frontend (read-only, no retag yet)
        run: |
          set -euo pipefail
          echo "ROLLBACK_T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/auto-frontend-staging-rollback-t0
          docker pull ghcr.io/${{ github.repository }}-frontend:staging-prev-frontend || { echo "::error::no frontend:staging-prev-frontend pinned (pins on GOOD deploys only) — auto-rollback inexecutable → ESCALATE (second level, see failure step)"; exit 1; }

      - name: Stop frontend staging (bounded grace, --timeout 30)
        run: |
          set -euo pipefail
          cd /opt/onchain-bot-staging/apps/backend
          docker compose -f docker-compose.staging.yml stop --timeout 30 frontend
          if docker ps --format '{{.Names}}' | grep -qx 'onchain-bot-frontend-staging'; then
            echo "::error::REFUSE: frontend container still running — investigate instead of starting a second one"
            exit 1
          fi
          echo "OK: frontend stopped — safe to start exactly one"

      - name: Recreate frontend from :staging-prev-frontend (no pull — local retag wins)
        run: |
          set -euo pipefail
          docker tag ghcr.io/${{ github.repository }}-frontend:staging-prev-frontend ghcr.io/${{ github.repository }}-frontend:staging-latest
          cd /opt/onchain-bot-staging/apps/backend
          docker compose -f docker-compose.staging.yml up -d --force-recreate frontend

      - name: Healthcheck gate (:4173) + downtime measured
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf --max-time 8 http://localhost:4173/ >/dev/null 2>&1; then
              echo "frontend healthy after ~$((i * 2))s"
              break
            fi
            [ "$i" -eq 60 ] && { echo "::error::staging frontend healthcheck failed after auto-rollback — ESCALATE (second level, see failure step)"; exit 1; }
            sleep 2
          done
          echo "ROLLBACK_T1=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/auto-frontend-staging-rollback-t1
          echo "downtime window: $(cat /tmp/auto-frontend-staging-rollback-t0) → $(cat /tmp/auto-frontend-staging-rollback-t1)"
          {
            echo "### Auto-rollback frontend staging OK"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| target | frontend:staging-prev-frontend → :4173 |"
            echo "| ventana | $(cat /tmp/auto-frontend-staging-rollback-t0) → $(cat /tmp/auto-frontend-staging-rollback-t1) |"
            echo "| asserts | http 200 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Second-level escalation (auto-rollback FAILED)
        if: failure()
        run: |
          {
            echo "### ESCALATION segundo nivel — auto-rollback frontend staging FALLIDO"
            echo ""
            echo "1. CONGELAR lanes: no re-disparar rollback (sin re-loops). Lock manual: avisar al operador ANTES de cualquier dispatch/retry."
            echo "2. AVISAR operador con ventana de downtime: $(cat /tmp/auto-frontend-staging-rollback-t0 2>/dev/null || echo T0-desconocido) → $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo "3. DUMP pre-deploy: artifact /data/backups/staging/staging-backup-*.sql — adjuntar filename al incident record."
            echo "4. INVALIDAR pin envenenado: si :staging-prev-frontend también está rojo, no reintentarlo — forward-fix (nuevo sha)."
            echo "5. DB restore = decisión HUMANA explícita (jamás automática, jamás segundo rollback en loop; frontend stateless — restore solo si el backend también cayó: ver runbook §5)."
            echo "6. Presupuesto: rollback <60s por lane; sin verde en 2 ventanas de healthcheck → forward-fix-or-restore."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::ESCALATION segundo nivel: auto-rollback frontend staging fallido — lanes congelados, operador requerido (ver summary)"

  # ROLLBACK LANES (item 9c) — dispatch-only, never auto. Discipline mirrors
  # docs/deployment/ingestion-rollback.md §§2-5: stop → verify-stopped (gate)
  # → start exactly one service from the pinned tag; `docker compose pull` is
  # FORBIDDEN inside rollback (it would re-fetch the broken :staging-latest).
  # Single-flight via the shared ingestion-staging-target group (serializes
  # against staging deploys and the twin lane; a second dispatch queues).
  # DATA DOCTRINE (closed): rollback = code-only; migrations NEVER revert
  # (roll-forward); data = restore from the pg_dump pre-deploy artifact
  # (see runbook docs/deployment/backend-frontend-rollback.md for paths).
  rollback-backend-staging:
    name: Rollback backend staging to :staging-prev-backend (:3031)
    runs-on: [self-hosted, oracle]
    # Single-flight on the shared staging target (item 9d; cancel-in-progress:false — never kill a running lane).
    concurrency:
      group: ingestion-staging-target
      cancel-in-progress: false
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'rollback-backend-staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull rollback target :staging-prev-backend (read-only, no retag yet)
        run: |
          set -euo pipefail
          echo "ROLLBACK_T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/backend-staging-rollback-t0
          docker pull ghcr.io/${{ github.repository }}-backend:staging-prev-backend || { echo "::error::no backend:staging-prev-backend pinned (pins on GOOD deploys only) — rollback inexecutable, deploy instead"; exit 1; }

      - name: Stop backend staging (bounded grace, --timeout 30)
        run: |
          set -euo pipefail
          cd /opt/onchain-bot-staging/apps/backend
          docker compose -f docker-compose.staging.yml stop --timeout 30 backend
          if docker ps --format '{{.Names}}' | grep -qx 'onchain-bot-backend-staging'; then
            echo "::error::REFUSE: backend container still running — investigate instead of starting a second one"
            exit 1
          fi
          echo "OK: backend stopped — safe to start exactly one"

      - name: Recreate backend from :staging-prev-backend (no pull — local retag wins)
        run: |
          set -euo pipefail
          docker tag ghcr.io/${{ github.repository }}-backend:staging-prev-backend ghcr.io/${{ github.repository }}-backend:staging-latest
          cd /opt/onchain-bot-staging/apps/backend
          docker compose -f docker-compose.staging.yml up -d --force-recreate backend

      - name: Healthcheck gate (:3031) + post-rollback asserts + downtime measured
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf --max-time 8 http://localhost:3031/api/health >/dev/null 2>&1; then
              echo "backend healthy after ~$((i * 10))s"
              break
            fi
            [ "$i" -eq 30 ] && { echo "::error::staging backend healthcheck failed after rollback — see runbook docs/deployment/backend-frontend-rollback.md (retry + escalate, never blind re-run)"; exit 1; }
            sleep 10
          done
          curl -s http://localhost:3031/api/health | jq '.'
          echo "=== migration:show (schema state assert, read-only) ==="
          cd /opt/onchain-bot-staging/apps/backend
          docker compose -f docker-compose.staging.yml run --rm --no-deps \
            -e NODE_ENV=staging \
            -e POSTGRES_HOST=postgres \
            -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=alpha_meta_token_scanner \
            -e POSTGRES_PASSWORD=alpha_meta_token_scanner \
            -e POSTGRES_DB=alpha_meta_token_scanner_staging \
            backend npm run migration:show
          echo "=== rollback pins present ==="
          docker images | grep -E 'staging-prev-backend' || echo "::warning::staging-prev-backend not local (restored from GHCR on next prune cycle)"
          echo "ROLLBACK_T1=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/backend-staging-rollback-t1
          echo "downtime window: $(cat /tmp/backend-staging-rollback-t0) → $(cat /tmp/backend-staging-rollback-t1)"
          {
            echo "### Rollback backend staging (:staging-prev-backend)"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| target | backend:staging-prev-backend → :3031 |"
            echo "| ventana | $(cat /tmp/backend-staging-rollback-t0) → $(cat /tmp/backend-staging-rollback-t1) |"
            echo "| asserts | health + migration:show + pins |"
          } >> "$GITHUB_STEP_SUMMARY"

  rollback-frontend-staging:
    name: Rollback frontend staging to :staging-prev-frontend (:4173)
    runs-on: [self-hosted, oracle]
    # Single-flight on the shared staging target (item 9d; cancel-in-progress:false — never kill a running lane).
    concurrency:
      group: ingestion-staging-target
      cancel-in-progress: false
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'rollback-frontend-staging'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull rollback target :staging-prev-frontend (read-only, no retag yet)
        run: |
          set -euo pipefail
          echo "ROLLBACK_T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/frontend-staging-rollback-t0
          docker pull ghcr.io/${{ github.repository }}-frontend:staging-prev-frontend || { echo "::error::no frontend:staging-prev-frontend pinned (pins on GOOD deploys only) — rollback inexecutable, deploy instead"; exit 1; }

      - name: Stop frontend staging (bounded grace, --timeout 30)
        run: |
          set -euo pipefail
          cd /opt/onchain-bot-staging/apps/backend
          docker compose -f docker-compose.staging.yml stop --timeout 30 frontend
          if docker ps --format '{{.Names}}' | grep -qx 'onchain-bot-frontend-staging'; then
            echo "::error::REFUSE: frontend container still running — investigate instead of starting a second one"
            exit 1
          fi
          echo "OK: frontend stopped — safe to start exactly one"

      - name: Recreate frontend from :staging-prev-frontend (no pull — local retag wins)
        run: |
          set -euo pipefail
          docker tag ghcr.io/${{ github.repository }}-frontend:staging-prev-frontend ghcr.io/${{ github.repository }}-frontend:staging-latest
          cd /opt/onchain-bot-staging/apps/backend
          docker compose -f docker-compose.staging.yml up -d --force-recreate frontend

      - name: Healthcheck gate (:4173) + downtime measured
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf --max-time 8 http://localhost:4173/ >/dev/null 2>&1; then
              echo "frontend healthy after ~$((i * 2))s"
              break
            fi
            [ "$i" -eq 60 ] && { echo "::error::staging frontend healthcheck failed after rollback — see runbook docs/deployment/backend-frontend-rollback.md"; exit 1; }
            sleep 2
          done
          echo "=== rollback pins present ==="
          docker images | grep -E 'staging-prev-frontend' || echo "::warning::staging-prev-frontend not local (restored from GHCR on next prune cycle)"
          echo "ROLLBACK_T1=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/frontend-staging-rollback-t1
          echo "downtime window: $(cat /tmp/frontend-staging-rollback-t0) → $(cat /tmp/frontend-staging-rollback-t1)"
          {
            echo "### Rollback frontend staging (:staging-prev-frontend)"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| target | frontend:staging-prev-frontend → :4173 |"
            echo "| ventana | $(cat /tmp/frontend-staging-rollback-t0) → $(cat /tmp/frontend-staging-rollback-t1) |"
            echo "| asserts | http 200 + pins |"
          } >> "$GITHUB_STEP_SUMMARY"
