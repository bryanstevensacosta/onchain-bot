name: Deploy to staging

# Automatically triggered on push to dev, waits for CI to pass before deploying
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Gate: Wait for CI to complete successfully before proceeding
  wait-for-ci:
    name: Wait for CI to pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for gh CLI context)
        uses: actions/checkout@v4
        if: github.event_name == 'push'

      - name: Wait for CI workflow to complete
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "⏳ Waiting for CI workflow to complete on commit ${{ github.sha }}..."

          # Wait up to 10 minutes (600 seconds)
          MAX_WAIT=600
          ELAPSED=0
          INTERVAL=10

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            # Get the status of the CI workflow for this commit
            STATUS=$(gh run list \
              --commit ${{ github.sha }} \
              --workflow ci.yml \
              --json conclusion,status \
              --jq '.[0] | {status: .status, conclusion: .conclusion}')
            
            echo "Current CI status: $STATUS"
            
            # Extract status and conclusion
            RUN_STATUS=$(echo "$STATUS" | jq -r '.status')
            RUN_CONCLUSION=$(echo "$STATUS" | jq -r '.conclusion')
            
            # Check if completed
            if [ "$RUN_STATUS" = "completed" ]; then
              if [ "$RUN_CONCLUSION" = "success" ]; then
                echo "✅ CI workflow passed!"
                exit 0
              else
                echo "❌ CI workflow failed with conclusion: $RUN_CONCLUSION"
                exit 1
              fi
            fi
            
            echo "CI still running... waiting ${INTERVAL}s (${ELAPSED}s/${MAX_WAIT}s elapsed)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "❌ Timeout waiting for CI workflow to complete after ${MAX_WAIT}s"
          exit 1

      - name: CI check bypassed (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: echo "✅ Manual deploy - CI check skipped"

  build-and-push-staging:
    needs: [wait-for-ci]
    name: Build and push staging to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend (staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:staging-${{ github.sha }},ghcr.io/${{ github.repository }}-backend:staging-latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-backend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-backend:cache,mode=max
          platforms: linux/amd64
          build-args: |
            NODE_ENV=staging

      - name: Build and push frontend (staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:staging-${{ github.sha }},ghcr.io/${{ github.repository }}-frontend:staging-latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-frontend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-frontend:cache,mode=max
          platforms: linux/amd64

      - name: Build and push ingestion-service (staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ingestion-service/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-ingestion:staging-${{ github.sha }},ghcr.io/${{ github.repository }}-ingestion:staging-latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-ingestion:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-ingestion:cache,mode=max
          platforms: linux/amd64

  deploy-staging:
    name: Deploy to staging
    runs-on: self-hosted
    needs: [build-and-push-staging]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix ownership before sync (chown -R runner:runner)
        run: |
          echo "=== chown -R runner:runner /opt/onchain-bot-staging ==="
          sudo chown -R runner:runner /opt/onchain-bot-staging || chown -R runner:runner /opt/onchain-bot-staging || echo 'chown warning (non-fatal)'
          echo "=== ownership fixed ==="

      - name: Sync live source tree with dev
        run: |
          set -euo pipefail
          mkdir -p /opt/onchain-bot-staging
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.git/**' \
            --exclude='node_modules' \
            --exclude='node_modules/**' \
            --exclude='dist' \
            --exclude='dist/**' \
            --exclude='backups' \
            --exclude='backups/**' \
            --exclude='logs' \
            --exclude='logs/**' \
            --exclude='.env*' \
            /opt/actions-runner/_work/onchain-bot/onchain-bot/ \
            /opt/onchain-bot-staging/
          echo "=== Sync complete ==="

      - name: Clean stale node_modules (rsync --exclude prevents deletion)
        run: |
          echo "=== Removing stale node_modules that rsync --exclude preserves ==="
          find /opt/onchain-bot-staging -name node_modules -type d -prune -exec rm -rf {} + 2>/dev/null || true
          echo "=== Done ==="

      - name: Ensure .env.staging exists
        run: |
          mkdir -p /opt/onchain-bot-staging/apps/backend
          mkdir -p /opt/onchain-bot-staging/apps/ingestion-service

          # Backend .env.staging
          if [ ! -f /opt/onchain-bot-staging/apps/backend/.env.staging ]; then
            echo "=== First deploy: creating backend .env.staging from repo ==="
            if [ -f /opt/actions-runner/_work/onchain-bot/onchain-bot/apps/backend/.env.staging ]; then
              cp /opt/actions-runner/_work/onchain-bot/onchain-bot/apps/backend/.env.staging \
                 /opt/onchain-bot-staging/apps/backend/.env.staging
              echo "✅ Backend .env.staging copied from repo"
            else
              touch /opt/onchain-bot-staging/apps/backend/.env.staging
              echo "⚠️  WARNING: backend .env.staging created empty — update manually"
            fi
          fi

          # Ingestion-service .env.staging - always update from template + secrets
          echo "=== Creating/updating ingestion-service .env.staging from template ==="
          cp /opt/actions-runner/_work/onchain-bot/onchain-bot/apps/ingestion-service/.env.staging.template \
             /opt/onchain-bot-staging/apps/ingestion-service/.env.staging

          # Replace placeholder values with actual secrets
          sed -i 's/YOUR_API_ID_HERE/${{ secrets.INGESTION_TELEGRAM_MTPROTO_API_ID }}/g' \
            /opt/onchain-bot-staging/apps/ingestion-service/.env.staging
          sed -i 's/YOUR_API_HASH_HERE/${{ secrets.INGESTION_TELEGRAM_MTPROTO_API_HASH }}/g' \
            /opt/onchain-bot-staging/apps/ingestion-service/.env.staging
          sed -i 's|YOUR_SESSION_STRING_HERE|${{ secrets.INGESTION_TELEGRAM_MTPROTO_SESSION }}|g' \
            /opt/onchain-bot-staging/apps/ingestion-service/.env.staging

          echo "✅ Ingestion-service .env.staging created/updated"

      - name: Inject staging env vars from GitHub
        run: |
          if ! grep -q "USE_MOCK_AI" /opt/onchain-bot-staging/apps/backend/.env.staging 2>/dev/null; then
            echo "USE_MOCK_AI=true" >> /opt/onchain-bot-staging/apps/backend/.env.staging
            echo "=== Added USE_MOCK_AI=true to .env.staging ==="
          else
            echo "=== USE_MOCK_AI already present in .env.staging ==="
          fi

      - name: Backup staging DB (if exists)
        run: |
          if docker ps --format '{{.Names}}' | grep -q onchain-bot-staging-postgres; then
            docker exec onchain-bot-staging-postgres pg_dump -U alpha_meta_token_scanner \
              alpha_meta_token_scanner_staging > /tmp/staging-backup-$(date +%Y%m%d-%H%M%S).sql || true
          fi

      - name: Disk cleanup (pre-pull, filtered)
        run: |
          echo "=== Disk before ==="
          df -h | head -20
          docker system df 2>&1 | head -20
          echo "=== Pruning (filtered, no volumes) ==="
          docker system prune -af --filter "until=24h" 2>&1 | tail -20 || true
          docker builder prune -af --filter "until=24h" 2>&1 | tail -10 || true
          sudo journalctl --vacuum-time=3d 2>&1 | tail -5 || true
          sudo journalctl --vacuum-size=100M 2>&1 | tail -5 || true
          sudo rm -f /opt/actions-runner/_diag/Worker_*.log 2>&1 | tail -5 || true
          echo "=== Disk after ==="
          df -h | head -20
          PCT=$(df / | tail -1 | awk '{print $5}' | tr -d '%'); if [ "$PCT" -gt 80 ]; then echo "::warning::disk ${PCT}% full"; fi

      - name: Pull images from GHCR (staging)
        run: |
          echo "=== Pulling backend staging ${{ github.sha }} (try sha, fallback latest) ==="
          docker pull ghcr.io/${{ github.repository }}-backend:staging-${{ github.sha }} || docker pull ghcr.io/${{ github.repository }}-backend:staging-latest
          docker tag ghcr.io/${{ github.repository }}-backend:staging-${{ github.sha }} ghcr.io/${{ github.repository }}-backend:staging-latest 2>/dev/null || true
          echo "=== Pulling frontend staging ${{ github.sha }} (try sha, fallback latest) ==="
          docker pull ghcr.io/${{ github.repository }}-frontend:staging-${{ github.sha }} || docker pull ghcr.io/${{ github.repository }}-frontend:staging-latest
          docker tag ghcr.io/${{ github.repository }}-frontend:staging-${{ github.sha }} ghcr.io/${{ github.repository }}-frontend:staging-latest 2>/dev/null || true
          echo "=== Pulling ingestion-service staging ${{ github.sha }} (try sha, fallback latest) ==="
          docker pull ghcr.io/${{ github.repository }}-ingestion:staging-${{ github.sha }} || docker pull ghcr.io/${{ github.repository }}-ingestion:staging-latest
          docker tag ghcr.io/${{ github.repository }}-ingestion:staging-${{ github.sha }} ghcr.io/${{ github.repository }}-ingestion:staging-latest 2>/dev/null || true
          docker images | head -20

      - name: Post-pull cleanup (aggressive, keep only current)
        run: |
          echo "=== Post-pull prune (remove old SHA tags, keep latest) ==="
          docker image prune -af 2>&1 | tail -20 || true
          docker builder prune -af 2>&1 | tail -10 || true
          echo "=== Disk after pull + prune ==="
          df -h | head -20
          docker system df 2>&1 | head -20
          PCT=$(df / | tail -1 | awk '{print $5}' | tr -d '%'); if [ "$PCT" -gt 80 ]; then echo "::warning::disk ${PCT}% full after pull+prune"; fi

      - name: Configure deploy environment
        run: |
          if [ -n "${{ secrets.REDIS_PASSWORD }}" ]; then
            echo "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" > /opt/onchain-bot-staging/apps/backend/.env
          else
            rm -f /opt/onchain-bot-staging/apps/backend/.env
          fi

      - name: Run migrations (staging environment)
        run: |
          set -euo pipefail
          echo "=== Running TypeORM migrations in staging ==="
          cd /opt/onchain-bot-staging/apps/backend

          # Run migrations inside a temporary Docker container
          # This ensures migrations run BEFORE the backend container starts
          docker compose -f docker-compose.staging.yml run --rm \
            -e NODE_ENV=staging \
            backend npm run migration:run

          echo "=== Migrations applied successfully ==="

      - name: Stop old backend container (if hung)
        run: |
          echo "=== Forcefully stopping old backend container ==="
          docker compose -f /opt/onchain-bot-staging/apps/backend/docker-compose.staging.yml stop backend --time 5 || true
          docker compose -f /opt/onchain-bot-staging/apps/backend/docker-compose.staging.yml rm -f backend || true
          echo "=== Old container removed ==="
          docker ps -a | grep -i backend || true
          sleep 2

      - name: Deploy backend (GHCR, no build)
        run: |
          docker compose -f /opt/onchain-bot-staging/apps/backend/docker-compose.staging.yml up -d --no-deps ingestion-service backend

      - name: Wait for backend healthcheck
        run: |
          echo "=== Waiting for backend to become healthy ==="
          for i in $(seq 1 5); do
            if curl -v -sf http://localhost:3031/api/health > /tmp/health-backend.log 2>&1; then
              echo "✓ Backend is healthy (attempt $i)"
              cat /tmp/health-backend.log
              break
            fi
            echo "  Waiting... attempt $i/5"
            if [ "$i" -eq 3 ] || [ "$i" -eq 5 ]; then
              echo "  --- curl -v output (attempt $i) ---"
              curl -v http://localhost:3031/api/health 2>&1 | head -30 || true
              echo "  --- end curl output ---"
            fi
            sleep 2
            if [ "$i" -eq 5 ]; then
              echo "❌ Backend healthcheck failed after 5 attempts (10 seconds total)"
              echo "=== Final curl -v output ==="
              curl -v http://localhost:3031/api/health 2>&1 || true
              echo "=== Backend container logs (last 50 lines) ==="
              docker logs --tail 50 $(docker ps -q -f name=backend) 2>&1 || true
              exit 1
            fi
          done

      - name: Deploy frontend (GHCR, no build)
        run: |
          docker compose -f /opt/onchain-bot-staging/apps/backend/docker-compose.staging.yml up -d frontend

      - name: Wait for frontend healthcheck
        run: |
          echo "=== Waiting for frontend to become healthy ==="
          for i in $(seq 1 60); do
            if curl -v -sf -o /dev/null http://localhost:4173/ > /tmp/health-frontend.log 2>&1; then
              echo "✓ Frontend is healthy (attempt $i)"
              cat /tmp/health-frontend.log
              break
            fi
            echo "  Waiting... attempt $i/60"
            if [ "$i" -eq 5 ] || [ "$i" -eq 15 ] || [ "$i" -eq 30 ] || [ "$i" -eq 45 ]; then
              echo "  --- curl -v output (attempt $i) ---"
              curl -v http://localhost:4173/ 2>&1 | head -30 || true
              echo "  --- end curl output ---"
            fi
            sleep 2
            if [ "$i" -eq 60 ]; then
              echo "❌ Frontend healthcheck failed after 60 attempts"
              echo "=== Final curl -v output ==="
              curl -v http://localhost:4173/ 2>&1 || true
              exit 1
            fi
          done

      - name: Install socat services for staging
        run: |
          bash /opt/onchain-bot-staging/scripts/install-socat-services.sh staging || true

      - name: Healthcheck backend (Tailscale)
        run: |
          echo "=== Tailscale backend healthcheck (curl -v) ==="
          curl -v -sf http://100.84.4.28:3031/api/health || { echo "BACKEND HEALTHCHECK FAILED"; exit 1; }

      - name: Healthcheck frontend (Tailscale)
        run: |
          echo "=== Tailscale frontend healthcheck (curl -v) ==="
          curl -v -sf -o /dev/null http://100.84.4.28:4173/ || { echo "FRONTEND HEALTHCHECK FAILED"; exit 1; }

  restart-services:
    name: Restart services
    if: ${{ success() }}
    runs-on: self-hosted
    needs: [deploy-staging]
    steps:
      - name: Restart litellm-gateway
        run: |
          echo "=== Restarting litellm-gateway ==="
          docker start litellm-gateway || true
      - name: Restart staging backend + frontend
        run: |
          echo "=== Restarting staging ==="
          onchainbot staging start
