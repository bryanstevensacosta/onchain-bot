name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:${{ github.sha }},ghcr.io/${{ github.repository }}-backend:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-backend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-backend:cache,mode=max
          platforms: linux/amd64

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:${{ github.sha }},ghcr.io/${{ github.repository }}-frontend:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-frontend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-frontend:cache,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to droplet
    runs-on: self-hosted
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix ownership before sync (chown -R runner:runner)
        run: |
          echo "=== Fixing ownership: /opt/onchain-bot → runner:runner ==="
          sudo chown -R runner:runner /opt/onchain-bot 2>&1 || echo "chown warning (non-fatal)"
          echo "=== Ownership fixed ==="

      - name: Sync live source tree with master
        run: |
          set -euo pipefail
          echo "=== Starting rsync with sudo ==="
          sudo rsync -a --delete \
            --exclude='.git' \
            --exclude='uploads' \
            --exclude='.git/**' \
            --exclude='node_modules' \
            --exclude='node_modules/**' \
            --exclude='dist' \
            --exclude='dist/**' \
            --exclude='backups' \
            --exclude='backups/**' \
            --exclude='logs' \
            --exclude='logs/**' \
            --exclude='.env*' \
            /opt/actions-runner/_work/onchain-bot/onchain-bot/ \
            /opt/onchain-bot/
          echo "=== Fixing ownership after rsync ==="
          sudo chown -R runner:runner /opt/onchain-bot 2>&1 || echo "post-sync chown warning (non-fatal)"
          echo "=== Post-sync HEAD ==="
          git -C /opt/onchain-bot rev-parse HEAD

      - name: Backup database
        run: |
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a
          POSTGRES_CONTAINER=onchain-bot-postgres \
          POSTGRES_USER=alpha_meta_token_scanner \
          POSTGRES_DB=alpha_meta_token_scanner \
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
          bash /opt/onchain-bot/scripts/backup-db.sh

      - name: Disk cleanup (pre-pull, filtered)
        run: |
          echo "=== Disk before ==="
          df -h | head -20
          docker system df 2>&1 | head -20
          echo "=== Pruning (filtered, no volumes) ==="
          docker system prune -af --filter "until=24h" 2>&1 | tail -20 || true
          docker builder prune -af --filter "until=24h" 2>&1 | tail -10 || true
          sudo journalctl --vacuum-time=3d 2>&1 | tail -5 || true
          sudo journalctl --vacuum-size=100M 2>&1 | tail -5 || true
          sudo rm -f /opt/actions-runner/_diag/Worker_*.log 2>&1 | tail -5 || true
          echo "=== Disk after ==="
          df -h | head -20
          PCT=$(df / | tail -1 | awk '{print $5}' | tr -d '%'); if [ "$PCT" -gt 80 ]; then echo "::warning::disk ${PCT}% full"; fi

      - name: Pull images from GHCR
        run: |
          echo "=== Pulling backend ${{ github.sha }} (try sha, fallback latest) ==="
          docker pull ghcr.io/${{ github.repository }}-backend:${{ github.sha }} || docker pull ghcr.io/${{ github.repository }}-backend:latest
          docker tag ghcr.io/${{ github.repository }}-backend:${{ github.sha }} ghcr.io/${{ github.repository }}-backend:latest 2>/dev/null || true
          docker tag ghcr.io/${{ github.repository }}-backend:latest ghcr.io/${{ github.repository }}-backend:latest 2>/dev/null || true
          echo "=== Pulling frontend ${{ github.sha }} (try sha, fallback latest) ==="
          docker pull ghcr.io/${{ github.repository }}-frontend:${{ github.sha }} || docker pull ghcr.io/${{ github.repository }}-frontend:latest
          docker tag ghcr.io/${{ github.repository }}-frontend:${{ github.sha }} ghcr.io/${{ github.repository }}-frontend:latest 2>/dev/null || true
          docker tag ghcr.io/${{ github.repository }}-frontend:latest ghcr.io/${{ github.repository }}-frontend:latest 2>/dev/null || true
          docker images | head -20

      - name: Post-pull cleanup (aggressive, keep only current)
        run: |
          echo "=== Post-pull prune (remove old SHA tags, keep latest) ==="
          docker image prune -af 2>&1 | tail -20 || true
          docker builder prune -af 2>&1 | tail -10 || true
          echo "=== Disk after pull + prune ==="
          df -h | head -20
          docker system df 2>&1 | head -20
          PCT=$(df / | tail -1 | awk '{print $5}' | tr -d '%'); if [ "$PCT" -gt 80 ]; then echo "::warning::disk ${PCT}% full after pull+prune"; fi

      - name: Deploy via compose (no build)
        run: |
          set -euo pipefail
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a

          echo "=== Running migrations ==="
          docker run --rm --network onchain-bot-net \
            --env-file /opt/onchain-bot/apps/backend/.env.production \
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }} \
            npx typeorm --dataSource dist/src/shared/common/persistence/data-source.js migration:run \
            || docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml run --rm backend \
               npx typeorm --dataSource dist/src/shared/common/persistence/data-source.js migration:run

          echo "=== Starting services with --wait (timeout 3min) ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml up -d --force-recreate --wait --wait-timeout 180 backend frontend \
            || docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml up -d --force-recreate

          echo "=== Verifying health ==="
          for i in {1..10}; do
            if curl -sf http://localhost:3030/api/health > /dev/null 2>&1; then
              echo "✅ Backend healthy on attempt $i"
              break
            fi
            echo "⏳ Health check $i/10 failed, retrying in 10s..."
            sleep 10
            if [ "$i" -eq 10 ]; then
              echo "❌ Backend never became healthy after 100s"
              docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml logs backend --tail 100
              exit 1
            fi
          done

          echo "=== Deploy complete ==="
