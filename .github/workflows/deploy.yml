name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to droplet
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            ~/.npm
          key: ${{ runner.os }}-npm-prod-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-prod-
            ${{ runner.os }}-npm-

      - name: Sync live source tree with master
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git' \
            --exclude='uploads' \
            --exclude='.git/**' \
            --exclude='node_modules' \
            --exclude='node_modules/**' \
            --exclude='dist' \
            --exclude='dist/**' \
            --exclude='backups' \
            --exclude='backups/**' \
            --exclude='logs' \
            --exclude='logs/**' \
            --exclude='.env*' \
            /opt/actions-runner/_work/onchain-bot/onchain-bot/ \
            /opt/onchain-bot/
          echo "=== Post-sync HEAD ==="
          git -C /opt/onchain-bot rev-parse HEAD

      - name: Backup database
        run: |
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a
          POSTGRES_CONTAINER=onchain-bot-postgres \
          POSTGRES_USER=alpha_meta_token_scanner \
          POSTGRES_DB=alpha_meta_token_scanner \
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
          bash /opt/onchain-bot/scripts/backup-db.sh

      - name: Fix ownership before npm ci (chown -R runner:runner)
        run: |
          echo "=== chown -R runner:runner /opt/onchain-bot ==="
          sudo chown -R runner:runner /opt/onchain-bot || chown -R runner:runner /opt/onchain-bot || echo 'chown warning (non-fatal)'
          echo "=== ownership fixed ==="

      - name: Build and deploy
        run: |
          set -euo pipefail
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a
          echo "=== Building images ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml build backend
          echo "=== Running migrations inside Docker ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml run --rm backend npx typeorm --dataSource dist/src/shared/common/persistence/data-source.js migration:run
          echo "=== Restarting services ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml up -d --force-recreate backend
          echo "=== Waiting for healthcheck ==="
          sleep 180
          echo "=== Healthcheck attempt (curl -v) ==="
          curl -v http://localhost:3030/api/health && echo "HEALTHCHECK OK" || (
            echo "HEALTHCHECK FAILED — rolling back"
            docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml up -d --force-recreate backend
            sleep 180
            echo "=== Rollback healthcheck attempt (curl -v) ==="
            curl -v http://localhost:3030/api/health && echo "Rollback successful" || {
              echo "ROLLBACK ALSO FAILED — manual intervention required"
              docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml logs backend --tail 50
              exit 1
            }
          )
          echo "=== Deploy complete ==="

      - name: Build + recreate frontend (non-blocking)
        run: |
          echo "=== Building frontend ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml build frontend || echo 'WARNING: frontend build failed (non-blocking)'
          echo "=== Recreating frontend ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml up -d --force-recreate frontend || echo 'WARNING: frontend recreate failed (non-blocking)'
          echo "=== Waiting for frontend health ==="
          for i in $(seq 1 30); do
            if curl -v -sf http://localhost:5173/ >/tmp/health-frontend-prod.log 2>&1; then
              echo "Frontend healthy after ${i} attempts"
              cat /tmp/health-frontend-prod.log
              break
            fi
            echo "  Waiting... attempt $i/30"
            sleep 2
            if [ "$i" -eq 30 ]; then
              echo "=== Final curl -v output (frontend) ==="
              curl -v http://localhost:5173/ 2>&1 || true
            fi
          done
