name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  stop-services:
    name: Stop non-essential services
    runs-on: self-hosted
    steps:
      - name: Stop staging backend + frontend
        run: |
          echo "=== Stopping staging backend + frontend ==="
          onchainbot staging stop || true
      - name: Stop litellm stack
        run: |
          echo "=== Stopping litellm stack ==="
          docker stop litellm-gateway || true
          docker stop litellm-db || true
          docker stop litellm-prometheus || true

  test:
    name: Tests
    runs-on: self-hosted
    needs: [stop-services]
    env:
      NODE_ENV: test
      DATABASE_ENABLED: true
      DATABASE_SYNCHRONIZE: true
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: alpha_meta_token_scanner
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: alpha_meta_token_scanner
      REDIS_ENABLED: true
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fix PATH for self-hosted runner
        run: |
          export PATH="/opt/actions-runner/_work/_tool/node/24.18.0/x64/bin:$PATH"
          echo "/opt/actions-runner/_work/_tool/node/24.18.0/x64/bin" >> $GITHUB_PATH
          node --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run backend tests
        run: npm run test:backend

      - name: Run frontend tests
        run: npm run test:frontend

  lint:
    name: Lint
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint
        continue-on-error: true

  tsc:
    name: TypeScript Check
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: |
          npm run build
          # Just check if tsc passes - the build is needed for the actual deploy anyway

  deploy:
    name: Deploy to droplet
    runs-on: self-hosted
    needs: [test, lint, tsc]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync live source tree with master
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.git/**' \
            --exclude='node_modules' \
            --exclude='node_modules/**' \
            --exclude='dist' \
            --exclude='dist/**' \
            --exclude='backups' \
            --exclude='backups/**' \
            --exclude='logs' \
            --exclude='logs/**' \
            --exclude='.env*' \
            /opt/actions-runner/_work/onchain-bot/onchain-bot/ \
            /opt/onchain-bot/
          echo "=== Post-sync HEAD ==="
          git -C /opt/onchain-bot rev-parse HEAD

      - name: Backup database
        run: |
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a
          POSTGRES_CONTAINER=onchain-bot-postgres \
          POSTGRES_USER=alpha_meta_token_scanner \
          POSTGRES_DB=alpha_meta_token_scanner \
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
          bash /opt/onchain-bot/scripts/backup-db.sh

      - name: Build and deploy
        run: |
          set -euo pipefail
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a
          echo "=== Building images ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml build backend
          echo "=== Running migrations ==="
          POSTGRES_HOST=localhost \
          POSTGRES_USER=alpha_meta_token_scanner \
          POSTGRES_DB=alpha_meta_token_scanner \
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
          cd /opt/onchain-bot/apps/backend && \
          POSTGRES_HOST=localhost \
          POSTGRES_USER=alpha_meta_token_scanner \
          POSTGRES_DB=alpha_meta_token_scanner \
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
          npm run migration:run
          echo "=== Restarting services ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml up -d --force-recreate backend
          echo "=== Waiting for healthcheck ==="
          sleep 15
          curl -sf http://localhost:3030/api/health && echo "" || (
            echo "HEALTHCHECK FAILED — rolling back"
            docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml up -d --force-recreate backend
            sleep 15
            curl -sf http://localhost:3030/api/health && echo "Rollback successful" || {
              echo "ROLLBACK ALSO FAILED — manual intervention required"
              docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml logs backend --tail 50
              exit 1
            }
          )
          echo "=== Deploy complete ==="

      - name: Build + recreate frontend (non-blocking)
        run: |
          echo "=== Building frontend ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml build frontend || echo 'WARNING: frontend build failed (non-blocking)'
          echo "=== Recreating frontend ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml up -d --force-recreate frontend || echo 'WARNING: frontend recreate failed (non-blocking)'
          echo "=== Waiting for frontend health ==="
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173/ >/dev/null; then
              echo "Frontend healthy after ${i} attempts"
              break
            fi
            sleep 2
          done

  restart-services:
    name: Restart services
    if: ${{ always() }}
    runs-on: self-hosted
    needs: [deploy]
    steps:
      - name: Restart litellm stack
        run: |
          echo "=== Restarting litellm stack ==="
          docker start litellm-gateway || true
          docker start litellm-db || true
          docker start litellm-prometheus || true
      - name: Restart staging backend + frontend
        run: |
          echo "=== Restarting staging ==="
          onchainbot staging start || true
