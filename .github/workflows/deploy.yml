name: Deploy to production

on:
  push:
    branches: [master]
    # ANTI-DOUBLE-FIRE (item 9b): the prod push leg owns backend/frontend/
    # shared paths ONLY. Ingestion paths are owned by the Deploy Ingestion
    # Service chain (workflow_run leg below): an ingestion-only push must NOT
    # build backend here — it would deploy twice (once on push, once on chain).
    # Mixed pushes (backend+ingestion) still match here AND there; the
    # preflight job skips the push leg then (skip-when-chain-ran: the chain
    # redeploys backend+frontend after ingestion is green).
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'scripts/**'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
      # NOT apps/ingestion-telegram/** nor deploy-ingestion.yml (chain-owned)
  workflow_dispatch:
    inputs:
      lane:
        description: 'Lane: full deploy (default) or dispatch-only rollback lane (never auto)'
        required: false
        default: 'full'
        type: choice
        # Rollback lanes (item 9c): re-raise the last GOOD namespaced pin
        # (:prev-backend / :prev-frontend). Dispatch-only, never on push/chain.
        options: [full, rollback-backend-prod, rollback-frontend-prod]
  # CHAIN (item 9a): ingestion(master→prod OK) ⇒ backend prod ⇒ frontend prod
  # (both in the deploy job, backend steps before frontend steps).
  # NOTE default-branch semantics: workflow_run ALWAYS evaluates THIS file's
  # definition from the DEFAULT branch (master) — the upstream SHA is pinned
  # explicitly via github.event.workflow_run.head_sha (preflight job), never
  # assumed from github.sha, or the chain drifts off the tested commit.
  workflow_run:
    workflows: ['Deploy Ingestion Service']
    types: [completed]
    branches: [master]

# CONCURRENCY (item 9d): ONE shared group per physical target across all 3
# deploy workflows. Prod target = /opt/onchain-bot (this workflow + the prod
# lane + prod rollback of deploy-ingestion.yml share it).
# cancel-in-progress:false — lanes run migrations; killing one mid-migration
# corrupts schema state. Tradeoff accepted and documented: a broken commit
# blocks the queue behind it (operator cancels queued-not-running runs by
# hand). Policy: supersede-queued-not-running ONLY, never kill a running lane.
concurrency:
  group: ingestion-production-target
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # PREFLIGHT (item 9a/9b/9f): resolves the effective SHA + whether this run
  # owns the deploy. Chain legs never re-trigger their upstream (no push, no
  # dispatch here — exit via outputs only), and bot-actor upstreams are
  # excluded (anti-loop). Contract literal: conclusion==success (bash
  # string-compare in Decide ownership below). Dispatch logs an explicit
  # bypass-with-reason when it skips a gate instead of staying silent.
  preflight:
    name: Preflight (chain guard + context)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_deploy: ${{ steps.decide.outputs.run_deploy }}
      effective_sha: ${{ steps.decide.outputs.effective_sha }}
      trigger_note: ${{ steps.decide.outputs.trigger_note }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Pin the upstream SHA on chain runs (default-branch definition
          # would otherwise build github.sha = master HEAD, not the tested
          # ingestion commit).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Decide ownership
        id: decide
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"
          NOTE=""
          SHA="${{ github.sha }}"
          RUN="false"
          if [ "$EVENT" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            ACTOR="${{ github.event.workflow_run.actor.login }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
            if [ "$ACTOR" = "github-actions[bot]" ]; then
              NOTE="chain SKIP: upstream actor is github-actions[bot] (anti-loop)"
            elif [ "$CONCLUSION" != "success" ]; then
              NOTE="chain SKIP: upstream conclusion=$CONCLUSION (broken link does not propagate)"
            else
              RUN="true"
              NOTE="chain OWN: upstream success @ $SHA (pinned ref, not default-branch HEAD)"
            fi
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "${{ inputs.lane }}" = "full" ]; then
              RUN="true"
              NOTE="dispatch OWN lane=full (explicit; ordering gate below still runs — no silent bypass)"
            else
              NOTE="dispatch OWN lane=${{ inputs.lane }} (rollback job owns it, not the deploy legs)"
            fi
          else
            # push: skip-when-chain-ran — if this push touched ingestion paths,
            # the ingestion workflow fired too and its chain leg redeploys us
            # after ingestion is green. Deploying on push as well = double.
            # Range is event.before..HEAD (not HEAD~1: multi-commit pushes
            # would miss ingestion paths touched below the tip).
            BASE="${{ github.event.before }}"
            if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
              git fetch origin "$BASE" --depth=1 2>/dev/null || true
              CHANGED="$(git diff --name-only "$BASE" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
            else
              CHANGED="$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)"
            fi
            if printf '%s' "$CHANGED" | grep -qE '^(apps/ingestion-telegram/|\.github/workflows/deploy-ingestion\.yml$)'; then
              NOTE="push SKIP: ingestion paths touched — chain owns this deploy (skip-when-chain-ran)"
            else
              RUN="true"
              NOTE="push OWN: no ingestion paths touched"
            fi
          fi
          echo "run_deploy=$RUN" >> "$GITHUB_OUTPUT"
          echo "effective_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "trigger_note=$NOTE" >> "$GITHUB_OUTPUT"
          echo "$NOTE"

      - name: Context summary
        run: |
          {
            echo "### Preflight (prod chain guard)"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| event | ${{ github.event_name }} |"
            echo "| decision | ${{ steps.decide.outputs.trigger_note }} |"
            echo "| effective_sha | ${{ steps.decide.outputs.effective_sha }} |"
            echo "| run_deploy | ${{ steps.decide.outputs.run_deploy }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preflight]
    if: needs.preflight.outputs.run_deploy == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the effective SHA (pinned upstream commit on chain runs),
          # not default-branch HEAD — the image tag carries effective_sha,
          # so the source must match the tag.
          ref: ${{ needs.preflight.outputs.effective_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:${{ needs.preflight.outputs.effective_sha }},ghcr.io/${{ github.repository }}-backend:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-backend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-backend:cache,mode=max
          platforms: linux/amd64,linux/arm64
          # T2 version-match: bake run SHA (backend/frontend Dockerfiles declare
          # no such ARG, so this is consumed-ignored there — harmless). SHA var:
          # effective_sha (push legs: github.sha; chain legs: pinned upstream
          # head_sha), matching the tags above on every leg.
          build-args: |
            IMAGE_REVISION=${{ needs.preflight.outputs.effective_sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:${{ needs.preflight.outputs.effective_sha }},ghcr.io/${{ github.repository }}-frontend:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-frontend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-frontend:cache,mode=max
          platforms: linux/amd64,linux/arm64
          # T2 version-match: same SHA contract as the backend image above
          # (effective_sha on all legs; ignored without a matching ARG).
          build-args: |
            IMAGE_REVISION=${{ needs.preflight.outputs.effective_sha }}

  deploy:
    name: Deploy to Oracle
    runs-on: [self-hosted, oracle]
    needs: [preflight, build-and-push]
    if: needs.preflight.outputs.run_deploy == 'true'
    timeout-minutes: 40
    environment: production
    # T4 auto-rollback contract: smoke_entered is true once the post-deploy
    # smoke phase starts. Auto-rollback jobs gate on this output so a red
    # deploy BEFORE smoke (migrations, health, pin) never triggers a rollback
    # — only post-smoke-rojo does (item 4 Must NOT do).
    outputs:
      smoke_entered: ${{ steps.smoke-marker.outputs.smoke_entered }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Same pin as the build job: compose files + scripts rsynced below
          # must come from the deployed commit, not default-branch HEAD.
          ref: ${{ needs.preflight.outputs.effective_sha }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix ownership before sync (chown -R runner:runner)
        run: |
          echo "=== Fixing ownership: /opt/onchain-bot → runner:runner ==="
          sudo chown -R runner:runner /opt/onchain-bot 2>&1 || echo "chown warning (non-fatal)"
          echo "=== Ownership fixed ==="

      - name: Sync live source tree with master
        run: |
          set -euo pipefail
          echo "=== Starting rsync with sudo ==="
          sudo rsync -a --delete \
            --exclude='.git' \
            --exclude='uploads' \
            --exclude='.git/**' \
            --exclude='node_modules' \
            --exclude='node_modules/**' \
            --exclude='dist' \
            --exclude='dist/**' \
            --exclude='backups' \
            --exclude='backups/**' \
            --exclude='logs' \
            --exclude='logs/**' \
            --exclude='.env*' \
            /opt/actions-runner/_work/onchain-bot/onchain-bot/ \
            /opt/onchain-bot/
          echo "=== Fixing ownership after rsync ==="
          sudo chown -R runner:runner /opt/onchain-bot 2>&1 || echo "post-sync chown warning (non-fatal)"
          echo "=== Post-sync HEAD ==="
          git -C /opt/onchain-bot rev-parse HEAD 2>/dev/null || echo "no git repo (rsync-synced tree, expected on fresh hosts)"

      - name: Backup database
        run: |
          set -euo pipefail
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a
          echo "::add-mask::$POSTGRES_PASSWORD"
          BACKUP_DIR="${BACKUP_DIR:-/opt/onchain-bot/backups}"
          echo "=== Pre-deploy daily backup (rolling prod-backend, 7-day) ==="
          set +e
          BACKUP_MODE=daily BACKUP_BASENAME=prod-backend BACKUP_ORIGIN=pre-deploy \
          POSTGRES_CONTAINER=onchain-bot-postgres-production \
          POSTGRES_USER=alpha_meta_token_scanner \
          POSTGRES_DB=alpha_meta_token_scanner \
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
          bash /opt/onchain-bot/scripts/backup-db.sh
          BACKUP_RC=$?
          set -e
          echo "backup exit code: $BACKUP_RC"
          # --- Unified disk scale (ESCALA UNICA): warn >=80% / fail >=90% o <2GB libres ---
          DF_LINE="$(df -P "$BACKUP_DIR" 2>/dev/null | awk 'NR==2 {print $5, $4}')"
          if [ -z "$DF_LINE" ]; then
            DF_LINE="$(df -P / 2>/dev/null | awk 'NR==2 {print $5, $4}')"
          fi
          DISK_PCT="$(printf '%s' "$DF_LINE" | awk '{print $1}' | tr -d '%')"
          DISK_AVAIL_KB="$(printf '%s' "$DF_LINE" | awk '{print $2}')"
          case "$DISK_PCT" in ''|*[!0-9]*) DISK_PCT=0 ;; esac
          case "$DISK_AVAIL_KB" in ''|*[!0-9]*) DISK_AVAIL_KB=0 ;; esac
          DISK_H="$(df -h "$BACKUP_DIR" 2>/dev/null | awk 'NR==2 {print $5 " used, " $4 " avail"}')"
          [ -z "$DISK_H" ] && DISK_H="${DISK_PCT}% used"
          # --- Resolve latest daily artifact (never secrets) ---
          LATEST="$(ls -t "$BACKUP_DIR"/prod-backend-*.dump.gz 2>/dev/null | head -1 || true)"
          if [ -n "$LATEST" ]; then
            FNAME="$(basename "$LATEST")"
            SIZE_H="$(du -h "$LATEST" 2>/dev/null | cut -f1)"
            META_FILE="${LATEST%.dump.gz}.meta.txt"
            if [ -f "$META_FILE" ]; then
              SHA_VAL="$(grep -E '^sha256=' "$META_FILE" 2>/dev/null | cut -d= -f2 || true)"
            else
              SHA_VAL=""
            fi
            if [ -z "${SHA_VAL:-}" ]; then
              SHA_VAL="$(sha256sum "$LATEST" 2>/dev/null | awk '{print $1}')"
            fi
            MTIME="$(stat -c %Y "$LATEST" 2>/dev/null || stat -f %m "$LATEST" 2>/dev/null || echo 0)"
            NOW="$(date +%s)"
            AGE_S=$((NOW - MTIME)); [ "$AGE_S" -lt 0 ] && AGE_S=0
            if [ "$AGE_S" -lt 3600 ]; then AGE_H="$((AGE_S / 60))min";
            elif [ "$AGE_S" -lt 86400 ]; then AGE_H="$((AGE_S / 3600))h $(((AGE_S % 3600) / 60))min";
            else AGE_H="$((AGE_S / 86400))d $(((AGE_S % 86400) / 3600))h"; fi
          else
            FNAME="(missing)"; SIZE_H="(missing)"; SHA_VAL="(missing)"; AGE_H="(missing)"
          fi
          # --- Step summary table (no secrets: only file/size/sha/age/disk/offsite) ---
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Backup database (daily prod-backend, pre-deploy)"
              echo ""
              echo "| campo | valor |"
              echo "|---|---|"
              echo "| archivo | $FNAME |"
              echo "| tamaño | $SIZE_H |"
              echo "| sha | $SHA_VAL |"
              echo "| edad | $AGE_H |"
              echo "| uso disco | $DISK_H (${DISK_PCT}% / ${DISK_AVAIL_KB}KB libres) |"
              echo "| offsite pendiente | pendiente (sync T4 rclone aun no programado) |"
              echo "| exit code | $BACKUP_RC |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # --- Failure / disk signaling (ESCALA UNICA) + abort before migrations ---
          if [ "$BACKUP_RC" -ne 0 ]; then
            echo "::error::[ESCALA UNICA] backup diario prod-backend fallo (exit $BACKUP_RC). Aborto deploy antes de migraciones."
            exit "$BACKUP_RC"
          fi
          if [ "$DISK_PCT" -ge 90 ] || [ "$DISK_AVAIL_KB" -lt 2097152 ]; then
            echo "::error::[ESCALA UNICA] disco al ${DISK_PCT}% (${DISK_AVAIL_KB}KB libres): fail >=90% o <2GB libres. Aborto deploy antes de migraciones."
            exit 1
          fi
          if [ "$DISK_PCT" -ge 80 ]; then
            echo "::warning::[ESCALA UNICA] disco al ${DISK_PCT}% >= 80% (libres ${DISK_AVAIL_KB}KB)."
          fi
          echo "=== Backup step OK ==="

      - name: Disk cleanup (pre-pull, filtered)
        run: |
          echo "=== Disk before ==="
          df -h | head -20
          docker system df 2>&1 | head -20
          echo "=== Pruning (filtered, no volumes) ==="
          docker system prune -af --filter "until=24h" 2>&1 | tail -20 || true
          docker builder prune -af --filter "until=24h" 2>&1 | tail -10 || true
          sudo journalctl --vacuum-time=3d 2>&1 | tail -5 || true
          sudo journalctl --vacuum-size=100M 2>&1 | tail -5 || true
          sudo rm -f /opt/actions-runner/_diag/Worker_*.log 2>&1 | tail -5 || true
          echo "=== Disk after ==="
          df -h | head -20
          PCT=$(df / | tail -1 | awk '{print $5}' | tr -d '%'); if [ "$PCT" -gt 80 ]; then echo "::warning::disk ${PCT}% full"; fi

      - name: Pull images from GHCR
        run: |
          echo "=== Pulling backend ${{ needs.preflight.outputs.effective_sha }} (try sha, fallback latest) ==="
          docker pull ghcr.io/${{ github.repository }}-backend:${{ needs.preflight.outputs.effective_sha }} || docker pull ghcr.io/${{ github.repository }}-backend:latest
          docker tag ghcr.io/${{ github.repository }}-backend:${{ needs.preflight.outputs.effective_sha }} ghcr.io/${{ github.repository }}-backend:latest 2>/dev/null || true
          docker tag ghcr.io/${{ github.repository }}-backend:latest ghcr.io/${{ github.repository }}-backend:latest 2>/dev/null || true
          echo "=== Pulling frontend ${{ needs.preflight.outputs.effective_sha }} (try sha, fallback latest) ==="
          docker pull ghcr.io/${{ github.repository }}-frontend:${{ needs.preflight.outputs.effective_sha }} || docker pull ghcr.io/${{ github.repository }}-frontend:latest
          docker tag ghcr.io/${{ github.repository }}-frontend:${{ needs.preflight.outputs.effective_sha }} ghcr.io/${{ github.repository }}-frontend:latest 2>/dev/null || true
          docker tag ghcr.io/${{ github.repository }}-frontend:latest ghcr.io/${{ github.repository }}-frontend:latest 2>/dev/null || true
          docker images | head -20

      - name: Post-pull cleanup (aggressive, keep only current)
        run: |
          echo "=== Post-pull prune (remove old SHA tags, keep latest) ==="
          # ROLLBACK-PIN EXEMPTION (item 9c): docker image prune -af would GC
          # the rollback targets. Snapshot namespaced pins first, prune, then
          # re-pull them from GHCR (source of truth — pins are pushed there on
          # every good deploy). Covers backend/frontend pins of BOTH envs plus
          # the ingestion pins (same host, sibling workflow).
          KEEP_PINS="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E ':(prev-backend|prev-frontend|staging-prev-backend|staging-prev-frontend|prev|staging-prev|prev-1|staging-prev-1)$' || true)"
          docker image prune -af 2>&1 | tail -20 || true
          if [ -n "$KEEP_PINS" ]; then
            echo "=== Restoring rollback pins from GHCR ==="
            echo "$KEEP_PINS" | while read -r PIN; do
              docker pull "$PIN" 2>&1 | tail -1 || echo "::warning::could not restore $PIN"
            done
            echo "=== Pins present locally ==="
            docker images | grep -E 'prev' || echo "::warning::no prev tags local after restore"
          else
            echo "(no rollback pins local — first run, nothing to exempt)"
          fi
          docker builder prune -af 2>&1 | tail -10 || true
          echo "=== Disk after pull + prune ==="
          df -h | head -20
          docker system df 2>&1 | head -20
          PCT=$(df / | tail -1 | awk '{print $5}' | tr -d '%'); if [ "$PCT" -gt 80 ]; then echo "::warning::disk ${PCT}% full after pull+prune"; fi

      - name: Verify ingestion healthy before backend migrations (ordering gate)
        run: |
          # Code-before-schema law (db-separation todo 10): the backend drop
          # migration (1860000000001) deletes the legacy crypto-news tables, so
          # the ingestion-telegram MUST already serve them. The cutover order is
          # enforced by SEQUENTIAL PRs (ingestion first, backend second), and
          # this gate aborts the backend deploy if ingestion is not serving —
          # even if the two workflows ever race on the same push to master.
          # INTERPLAY with the item-9 chain (preflight above): chain ownership
          # is the proof of order; this gate stays as a BACKSTOP (liveness,
          # not version-match — it cannot tell WHICH ingestion sha serves).
          echo "=== Ordering gate: ingestion must serve feed sources ==="
          for i in $(seq 1 12); do
            if curl -sf http://localhost:3032/api/feed/sources > /tmp/ingestion-gate.json 2>&1; then
              echo "✅ Ingestion healthy on attempt $i (sources endpoint 200)"
              head -c 300 /tmp/ingestion-gate.json; echo
              break
            fi
            echo "⏳ Ingestion not serving (attempt $i/12), retrying in 10s..."
            sleep 10
            if [ "$i" -eq 12 ]; then
              echo "::error::Ingestion-service is NOT serving :3032/api/feed/sources after 120s. Aborting backend deploy: the drop migration must NOT run before the ingestion cutover (merge + deploy ingestion FIRST, then re-run this workflow)."
              exit 1
            fi
          done

      - name: Version-match gate (served revision vs run SHA, chain legs only)
        run: |
          # T2 version-match (prod-safety-gates item 2): the serving ingestion
          # must expose THIS run's SHA via /api/health.imageRevision. Runs BEFORE
          # backend migrations (mismatch aborts here, never past this point).
          # CHAIN-ONLY by design: on push/dispatch legs the backend SHA and the
          # serving ingestion SHA are legitimately different commits (backend-only
          # push = ingestion untouched) — enforcing there would deadlock every
          # backend-only deploy. The liveness gate above stays as the backstop
          # on those legs (explicit SKIP below, never silent — item 9f).
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "version-match SKIP (${{ github.event_name }} leg): served revision only comparable on chain legs — liveness gate above is the backstop"
            exit 0
          fi
          EXPECTED="${{ needs.preflight.outputs.effective_sha }}"
          SERVED="$(curl -sf --max-time 10 http://localhost:3032/api/health | jq -r '.imageRevision // "unknown"')"
          echo "version-match: run SHA=$EXPECTED served imageRevision=$SERVED"
          if [ "$SERVED" != "$EXPECTED" ]; then
            echo "::error::esperaba $EXPECTED, sirve $SERVED — reintentar tras ingestion"
            exit 1
          fi
          echo "✅ version-match: ingestion :3032 serves $EXPECTED"

      - name: Dry-run migrations (read-only, fail loudly)
        run: |
          set -euo pipefail
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a

          echo "=== Dry-run: pending migrations (migration:show, read-only, no writes) ==="
          if docker run --rm --network onchain-bot-net \
            --env-file /opt/onchain-bot/apps/backend/.env.production \
            ghcr.io/${{ github.repository }}-backend:${{ needs.preflight.outputs.effective_sha }} \
            npx typeorm --dataSource dist/backend/src/shared/common/persistence/data-source.js migration:show \
            || docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml run --rm backend \
               npx typeorm --dataSource dist/backend/src/shared/common/persistence/data-source.js migration:show; then
            echo "✅ migration:show OK"
          else
            echo "::error::Migration dry-run FAILED (migration:show). Aborting deploy before any write."
            exit 1
          fi

          echo "=== Dry-run: precondition probe (read-only SELECT, no writes) ==="
          if docker run --rm --network onchain-bot-net \
            --env-file /opt/onchain-bot/apps/backend/.env.production \
            ghcr.io/${{ github.repository }}-backend:${{ needs.preflight.outputs.effective_sha }} \
            npx typeorm --dataSource dist/backend/src/shared/common/persistence/data-source.js query "SELECT 1 AS dry_run_ok" \
            || docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml run --rm backend \
               npx typeorm --dataSource dist/backend/src/shared/common/persistence/data-source.js query "SELECT 1 AS dry_run_ok"; then
            echo "✅ precondition probe OK"
          else
            echo "::error::Migration precondition probe FAILED (read-only SELECT). Aborting deploy before any write."
            exit 1
          fi

          echo "=== Dry-run OK: zero writes performed ==="

      - name: Deploy via compose (no build)
        run: |
          set -euo pipefail
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a

          echo "=== Running migrations ==="
          docker run --rm --network onchain-bot-net \
            --env-file /opt/onchain-bot/apps/backend/.env.production \
            ghcr.io/${{ github.repository }}-backend:${{ needs.preflight.outputs.effective_sha }} \
            npx typeorm --dataSource dist/backend/src/shared/common/persistence/data-source.js migration:run \
            || docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml run --rm backend \
               npx typeorm --dataSource dist/backend/src/shared/common/persistence/data-source.js migration:run

          echo "=== Starting services with --wait (timeout 3min) ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml up -d --force-recreate --wait --wait-timeout 180 backend frontend \
            || docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml up -d --force-recreate

          echo "=== Verifying health ==="
          for i in {1..10}; do
            if curl -sf http://localhost:3030/api/health > /dev/null 2>&1; then
              echo "✅ Backend healthy on attempt $i"
              break
            fi
            echo "⏳ Health check $i/10 failed, retrying in 10s..."
            sleep 10
            if [ "$i" -eq 10 ]; then
              echo "❌ Backend never became healthy after 100s"
              docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml logs backend --tail 100
              exit 1
            fi
          done

          echo "=== Deploy complete ==="

      - name: Pin :prev-backend / :prev-frontend on GOOD deploy (rollback contract)
        # Contract (item 9c consumes it): namespaced pins, NEVER bare :prev
        # (one tag per lane — a shared :prev would let a frontend-tested sha
        # become the backend rollback target and vice versa). Retention = the
        # pin itself (previous pin is overwritten; older shas stay addressable
        # by sha tag). Runs only after health passed = GOOD deploy by def.
        run: |
          set -euo pipefail
          SHA="${{ needs.preflight.outputs.effective_sha || github.sha }}"
          docker tag ghcr.io/${{ github.repository }}-backend:"$SHA" ghcr.io/${{ github.repository }}-backend:prev-backend \
            || docker tag ghcr.io/${{ github.repository }}-backend:latest ghcr.io/${{ github.repository }}-backend:prev-backend
          docker push ghcr.io/${{ github.repository }}-backend:prev-backend
          echo "pinned backend:prev-backend @ $SHA"
          docker tag ghcr.io/${{ github.repository }}-frontend:"$SHA" ghcr.io/${{ github.repository }}-frontend:prev-frontend \
            || docker tag ghcr.io/${{ github.repository }}-frontend:latest ghcr.io/${{ github.repository }}-frontend:prev-frontend
          docker push ghcr.io/${{ github.repository }}-frontend:prev-frontend
          echo "pinned frontend:prev-frontend @ $SHA"

      - name: Mark smoke entered (T4 auto-rollback gate signal)
        id: smoke-marker
        run: echo "smoke_entered=true" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke checks (read-only)
        env:
          SMOKE_BACKEND_URL: http://localhost:3030
          SMOKE_FRONTEND_URL: http://localhost:5173
          SMOKE_INGESTION_URL: http://localhost:3032
          SMOKE_TIMEOUT: 10
          SMOKE_SSE_TIMEOUT: 8
        run: |
          set -euo pipefail
          echo "=== Post-deploy smoke (prod ports, read-only probes) ==="
          bash scripts/smoke-prod.sh
          echo "=== Smoke complete ==="

      - name: Smoke summary (versions + health links per link)
        # SMOKE FORMAT (item 9e): one row per link — version deployed, health
        # URL, probe result. Mirrors scripts/smoke-prod.sh probe order.
        run: |
          SHA="${{ needs.preflight.outputs.effective_sha || github.sha }}"
          {
            echo "### Smoke prod (deploy ${SHA})"
            echo ""
            echo "| eslabón | versión | health | resultado |"
            echo "|---|---|---|---|"
            echo "| backend | backend:${SHA} | http://localhost:3030/api/health | smoke-prod.sh §1,4,6,7 |"
            echo "| frontend | frontend:${SHA} | http://localhost:5173/ | smoke-prod.sh §2 |"
            echo "| ingestion (backstop) | twin-externo | http://localhost:3032/api/feed/sources | smoke-prod.sh §3,5 |"
            echo "| trigger | ${{ needs.preflight.outputs.trigger_note }} | | |"
          } >> "$GITHUB_STEP_SUMMARY"

  # AUTO-ROLLBACK (prod-safety-gates item 4) — fires ONLY on post-smoke-rojo:
  # deploy FAILED + smoke phase was entered (smoke_entered output). Reuses the
  # rollback-lane mechanics inline (same pins/tags/compose/health gates — no
  # new mechanics): dispatching a NEW run would deadlock on the shared
  # ingestion-production-target concurrency group (new run queues behind this
  # one, which waits for it). Dispatch lanes below stay manual-only (escape).
  # Lanes serialized (frontend needs backend-auto) — never two docker writers
  # at once. Budget: <60s per lane. Timeout caps each job, never holds runner.
  auto-rollback-backend-prod:
    name: Auto-rollback backend prod on smoke failure (:prev-backend)
    runs-on: [self-hosted, oracle]
    needs: [deploy]
    if: failure() && needs.deploy.outputs.smoke_entered == 'true'
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record auto-rollback decision
        run: |
          {
            echo "### Auto-rollback backend prod (smoke rojo → :prev-backend → :3030)"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| trigger | post-deploy smoke FAILED (deploy job red, smoke entered) |"
            echo "| target | backend:prev-backend → :3030 |"
            echo "| manual escape | dispatch lane=rollback-backend-prod intacto |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pull rollback target :prev-backend (read-only, no retag yet)
        run: |
          set -euo pipefail
          echo "ROLLBACK_T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/auto-backend-prod-rollback-t0
          docker pull ghcr.io/${{ github.repository }}-backend:prev-backend || { echo "::error::no backend:prev-backend pinned (pins on GOOD deploys only) — auto-rollback inexecutable → ESCALATE (second level, see failure step)"; exit 1; }

      - name: Stop backend prod (bounded grace, --timeout 30)
        run: |
          set -euo pipefail
          cd /opt/onchain-bot/apps/backend
          docker compose -f docker-compose.prod.yml stop --timeout 30 backend
          if docker ps --format '{{.Names}}' | grep -qx 'onchain-bot-backend-production'; then
            echo "::error::REFUSE: backend container still running — investigate instead of starting a second one"
            exit 1
          fi
          echo "OK: backend stopped — safe to start exactly one"

      - name: Recreate backend from :prev-backend (no pull — local retag wins)
        run: |
          set -euo pipefail
          docker tag ghcr.io/${{ github.repository }}-backend:prev-backend ghcr.io/${{ github.repository }}-backend:latest
          cd /opt/onchain-bot/apps/backend
          docker compose -f docker-compose.prod.yml up -d --force-recreate backend

      - name: Healthcheck gate (:3030) + post-rollback asserts + downtime measured
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -sf --max-time 8 http://localhost:3030/api/health >/dev/null 2>&1; then
              echo "backend healthy after ~$((i * 5))s"
              break
            fi
            [ "$i" -eq 12 ] && { echo "::error::backend healthcheck failed after auto-rollback — ESCALATE (second level, see failure step)"; exit 1; }
            sleep 5
          done
          curl -s http://localhost:3030/api/health | jq '.'
          echo "ROLLBACK_T1=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/auto-backend-prod-rollback-t1
          echo "downtime window: $(cat /tmp/auto-backend-prod-rollback-t0) → $(cat /tmp/auto-backend-prod-rollback-t1)"
          {
            echo "### Auto-rollback backend prod OK"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| target | backend:prev-backend → :3030 |"
            echo "| ventana | $(cat /tmp/auto-backend-prod-rollback-t0) → $(cat /tmp/auto-backend-prod-rollback-t1) |"
            echo "| asserts | health 200 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Second-level escalation (auto-rollback FAILED)
        if: failure()
        run: |
          {
            echo "### ESCALATION segundo nivel — auto-rollback backend prod FALLIDO"
            echo ""
            echo "1. CONGELAR lanes: no re-disparar rollback (sin re-loops — el pin :prev-backend ya está vivo o ausente; un segundo ciclo solo suma downtime). Lock manual: avisar al operador ANTES de cualquier dispatch/retry."
            echo "2. AVISAR operador con ventana de downtime: $(cat /tmp/auto-backend-prod-rollback-t0 2>/dev/null || echo T0-desconocido) → $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo "3. DUMP pre-deploy: artifact pg_dump citado en el summary del job deploy (backups/prod-backend-*.dump.gz + .meta.txt con sha) — adjuntar filename/sha al incident record."
            echo "4. INVALIDAR pin envenenado: si :prev-backend también está rojo, no reintentarlo — forward-fix (nuevo sha) o restore."
            echo "5. DB restore = decisión HUMANA explícita (jamás automática, jamás segundo rollback en loop): stop → pg_restore/psql del artifact → start → migration:show + counts asserts (runbook docs/deployment/backend-frontend-rollback.md §5)."
            echo "6. Presupuesto: rollback <60s por lane; sin verde en 2 ventanas de healthcheck → forward-fix-or-restore."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::ESCALATION segundo nivel: auto-rollback backend prod fallido — lanes congelados, operador requerido (ver summary)"

  auto-rollback-frontend-prod:
    name: Auto-rollback frontend prod on smoke failure (:prev-frontend)
    runs-on: [self-hosted, oracle]
    needs: [deploy, auto-rollback-backend-prod]
    if: always() && needs.deploy.result == 'failure' && needs.deploy.outputs.smoke_entered == 'true'
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record auto-rollback decision
        run: |
          {
            echo "### Auto-rollback frontend prod (smoke rojo → :prev-frontend → :5173)"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| trigger | post-deploy smoke FAILED (deploy job red, smoke entered) |"
            echo "| target | frontend:prev-frontend → :5173 |"
            echo "| orden | tras auto-rollback-backend-prod (serializado, un writer docker) |"
            echo "| manual escape | dispatch lane=rollback-frontend-prod intacto |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pull rollback target :prev-frontend (read-only, no retag yet)
        run: |
          set -euo pipefail
          echo "ROLLBACK_T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/auto-frontend-prod-rollback-t0
          docker pull ghcr.io/${{ github.repository }}-frontend:prev-frontend || { echo "::error::no frontend:prev-frontend pinned (pins on GOOD deploys only) — auto-rollback inexecutable → ESCALATE (second level, see failure step)"; exit 1; }

      - name: Stop frontend prod (bounded grace, --timeout 30)
        run: |
          set -euo pipefail
          cd /opt/onchain-bot/apps/backend
          docker compose -f docker-compose.prod.yml stop --timeout 30 frontend
          if docker ps --format '{{.Names}}' | grep -qx 'onchain-bot-frontend-production'; then
            echo "::error::REFUSE: frontend container still running — investigate instead of starting a second one"
            exit 1
          fi
          echo "OK: frontend stopped — safe to start exactly one"

      - name: Recreate frontend from :prev-frontend (no pull — local retag wins)
        run: |
          set -euo pipefail
          docker tag ghcr.io/${{ github.repository }}-frontend:prev-frontend ghcr.io/${{ github.repository }}-frontend:latest
          cd /opt/onchain-bot/apps/backend
          docker compose -f docker-compose.prod.yml up -d --force-recreate frontend

      - name: Healthcheck gate (:5173) + downtime measured
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf --max-time 8 http://localhost:5173/ >/dev/null 2>&1; then
              echo "frontend healthy after ~$((i * 5))s"
              break
            fi
            [ "$i" -eq 30 ] && { echo "::error::frontend healthcheck failed after auto-rollback — ESCALATE (second level, see failure step)"; exit 1; }
            sleep 5
          done
          echo "ROLLBACK_T1=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/auto-frontend-prod-rollback-t1
          echo "downtime window: $(cat /tmp/auto-frontend-prod-rollback-t0) → $(cat /tmp/auto-frontend-prod-rollback-t1)"
          {
            echo "### Auto-rollback frontend prod OK"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| target | frontend:prev-frontend → :5173 |"
            echo "| ventana | $(cat /tmp/auto-frontend-prod-rollback-t0) → $(cat /tmp/auto-frontend-prod-rollback-t1) |"
            echo "| asserts | http 200 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Second-level escalation (auto-rollback FAILED)
        if: failure()
        run: |
          {
            echo "### ESCALATION segundo nivel — auto-rollback frontend prod FALLIDO"
            echo ""
            echo "1. CONGELAR lanes: no re-disparar rollback (sin re-loops). Lock manual: avisar al operador ANTES de cualquier dispatch/retry."
            echo "2. AVISAR operador con ventana de downtime: $(cat /tmp/auto-frontend-prod-rollback-t0 2>/dev/null || echo T0-desconocido) → $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo "3. DUMP pre-deploy: artifact pg_dump citado en el summary del job deploy — adjuntar filename/sha al incident record."
            echo "4. INVALIDAR pin envenenado: si :prev-frontend también está rojo, no reintentarlo — forward-fix (nuevo sha)."
            echo "5. DB restore = decisión HUMANA explícita (jamás automática, jamás segundo rollback en loop; frontend es stateless — restore solo si el backend también cayó: ver runbook §5)."
            echo "6. Presupuesto: rollback <60s por lane; sin verde en 2 ventanas de healthcheck → forward-fix-or-restore."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::ESCALATION segundo nivel: auto-rollback frontend prod fallido — lanes congelados, operador requerido (ver summary)"

  # ROLLBACK LANES (item 9c) — dispatch-only, never auto. Discipline mirrors
  # docs/deployment/ingestion-rollback.md §§2-5: stop → verify-stopped (gate)
  # → start exactly one service from the pinned tag; `docker compose pull` is
  # FORBIDDEN inside rollback (it would re-fetch the broken :latest).
  # Single-flight via the shared ingestion-production-target group (serializes
  # against prod deploys; a second dispatch queues, never overlaps).
  # DATA DOCTRINE (closed): rollback = code-only; migrations NEVER revert
  # (roll-forward); data = restore from the pg_dump pre-deploy artifact
  # (see runbook docs/deployment/backend-frontend-rollback.md for paths).
  rollback-backend-prod:
    name: Rollback backend prod to :prev-backend (:3030)
    runs-on: [self-hosted, oracle]
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'rollback-backend-prod'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull rollback target :prev-backend (read-only, no retag yet)
        run: |
          set -euo pipefail
          echo "ROLLBACK_T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/backend-prod-rollback-t0
          docker pull ghcr.io/${{ github.repository }}-backend:prev-backend || { echo "::error::no backend:prev-backend pinned (pins on GOOD deploys only) — rollback inexecutable, deploy instead"; exit 1; }

      - name: Stop backend prod (bounded grace, --timeout 30)
        run: |
          set -euo pipefail
          cd /opt/onchain-bot/apps/backend
          docker compose -f docker-compose.prod.yml stop --timeout 30 backend
          if docker ps --format '{{.Names}}' | grep -qx 'onchain-bot-backend-production'; then
            echo "::error::REFUSE: backend container still running — investigate instead of starting a second one"
            exit 1
          fi
          echo "OK: backend stopped — safe to start exactly one"

      - name: Recreate backend from :prev-backend (no pull — local retag wins)
        run: |
          set -euo pipefail
          docker tag ghcr.io/${{ github.repository }}-backend:prev-backend ghcr.io/${{ github.repository }}-backend:latest
          cd /opt/onchain-bot/apps/backend
          docker compose -f docker-compose.prod.yml up -d --force-recreate backend

      - name: Healthcheck gate (:3030) + post-rollback asserts + downtime measured
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -sf --max-time 8 http://localhost:3030/api/health >/dev/null 2>&1; then
              echo "backend healthy after ~$((i * 5))s"
              break
            fi
            [ "$i" -eq 12 ] && { echo "::error::backend healthcheck failed after rollback — see runbook docs/deployment/backend-frontend-rollback.md (retry + escalate, never blind re-run)"; exit 1; }
            sleep 5
          done
          curl -s http://localhost:3030/api/health | jq '.'
          echo "=== migration:show (schema state assert, read-only) ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml run --rm backend \
            npx typeorm --dataSource dist/backend/src/shared/common/persistence/data-source.js migration:show
          echo "=== rollback pins present ==="
          docker images | grep -E 'prev-backend' || echo "::warning::prev-backend not local (restored from GHCR on next prune cycle)"
          echo "ROLLBACK_T1=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/backend-prod-rollback-t1
          echo "downtime window: $(cat /tmp/backend-prod-rollback-t0) → $(cat /tmp/backend-prod-rollback-t1)"
          {
            echo "### Rollback backend prod (:prev-backend)"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| target | backend:prev-backend → :3030 |"
            echo "| ventana | $(cat /tmp/backend-prod-rollback-t0) → $(cat /tmp/backend-prod-rollback-t1) |"
            echo "| asserts | health + migration:show + pins |"
          } >> "$GITHUB_STEP_SUMMARY"

  rollback-frontend-prod:
    name: Rollback frontend prod to :prev-frontend (:5173)
    runs-on: [self-hosted, oracle]
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'rollback-frontend-prod'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull rollback target :prev-frontend (read-only, no retag yet)
        run: |
          set -euo pipefail
          echo "ROLLBACK_T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/frontend-prod-rollback-t0
          docker pull ghcr.io/${{ github.repository }}-frontend:prev-frontend || { echo "::error::no frontend:prev-frontend pinned (pins on GOOD deploys only) — rollback inexecutable, deploy instead"; exit 1; }

      - name: Stop frontend prod (bounded grace, --timeout 30)
        run: |
          set -euo pipefail
          cd /opt/onchain-bot/apps/backend
          docker compose -f docker-compose.prod.yml stop --timeout 30 frontend
          if docker ps --format '{{.Names}}' | grep -qx 'onchain-bot-frontend-production'; then
            echo "::error::REFUSE: frontend container still running — investigate instead of starting a second one"
            exit 1
          fi
          echo "OK: frontend stopped — safe to start exactly one"

      - name: Recreate frontend from :prev-frontend (no pull — local retag wins)
        run: |
          set -euo pipefail
          docker tag ghcr.io/${{ github.repository }}-frontend:prev-frontend ghcr.io/${{ github.repository }}-frontend:latest
          cd /opt/onchain-bot/apps/backend
          docker compose -f docker-compose.prod.yml up -d --force-recreate frontend

      - name: Healthcheck gate (:5173) + downtime measured
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf --max-time 8 http://localhost:5173/ >/dev/null 2>&1; then
              echo "frontend healthy after ~$((i * 5))s"
              break
            fi
            [ "$i" -eq 30 ] && { echo "::error::frontend healthcheck failed after rollback — see runbook docs/deployment/backend-frontend-rollback.md"; exit 1; }
            sleep 5
          done
          echo "=== rollback pins present ==="
          docker images | grep -E 'prev-frontend' || echo "::warning::prev-frontend not local (restored from GHCR on next prune cycle)"
          echo "ROLLBACK_T1=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/frontend-prod-rollback-t1
          echo "downtime window: $(cat /tmp/frontend-prod-rollback-t0) → $(cat /tmp/frontend-prod-rollback-t1)"
          {
            echo "### Rollback frontend prod (:prev-frontend)"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| target | frontend:prev-frontend → :5173 |"
            echo "| ventana | $(cat /tmp/frontend-prod-rollback-t0) → $(cat /tmp/frontend-prod-rollback-t1) |"
            echo "| asserts | http 200 + pins |"
          } >> "$GITHUB_STEP_SUMMARY"
