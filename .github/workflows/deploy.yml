name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    # Self-hosted runner lives on the production droplet, so it can
    # talk directly to the droplet's local postgres + redis (no service
    # containers needed). This also makes the workflow ~10x faster
    # (no fresh 500MB node_modules download on every run).
    runs-on: self-hosted
    env:
      NODE_ENV: test
      DATABASE_ENABLED: true
      DATABASE_SYNCHRONIZE: true
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: alpha_meta_token_scanner
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: alpha_meta_token_scanner
      REDIS_ENABLED: true
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run backend tests
        run: npm run test:backend

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Lint
        run: npm run lint

  deploy:
    name: Deploy to droplet
    # Runner is on the droplet itself, so no SSH is needed — it just
    # runs docker compose directly. Also drops the separate /tmp/deploy.sh
    # indirection (script_path was a workaround for the SSH-based model).
    runs-on: self-hosted
    needs: test
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Backup database
        run: |
          POSTGRES_CONTAINER=onchain-bot-postgres \
          POSTGRES_USER=alpha_meta_token_scanner \
          POSTGRES_DB=alpha_meta_token_scanner \
          POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
          bash scripts/backup-db.sh

      - name: Build and deploy
        run: |
          set -euo pipefail
          echo "=== Building images ==="
          docker compose -f apps/backend/docker-compose.prod.yml build --no-cache backend
          echo "=== Running migrations ==="
          POSTGRES_HOST=postgres \
          POSTGRES_USER=alpha_meta_token_scanner \
          POSTGRES_DB=alpha_meta_token_scanner \
          POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
          docker compose -f apps/backend/docker-compose.prod.yml run --rm -T backend npm run migration:run
          echo "=== Restarting services ==="
          docker compose -f apps/backend/docker-compose.prod.yml up -d --force-recreate backend
          echo "=== Waiting for healthcheck ==="
          sleep 15
          curl -sf http://localhost:3030/api/health && echo "" || (
            echo "HEALTHCHECK FAILED"
            docker compose -f apps/backend/docker-compose.prod.yml logs backend --tail 50
            exit 1
          )
          echo "=== Deploy complete ==="
