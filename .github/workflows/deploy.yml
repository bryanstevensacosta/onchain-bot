name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:${{ github.sha }},ghcr.io/${{ github.repository }}-backend:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-backend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-backend:cache,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:${{ github.sha }},ghcr.io/${{ github.repository }}-frontend:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-frontend:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-frontend:cache,mode=max
          platforms: linux/amd64,linux/arm64

  deploy:
    name: Deploy to droplet
    runs-on: [self-hosted, oracle]
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix ownership before sync (chown -R runner:runner)
        run: |
          echo "=== Fixing ownership: /opt/onchain-bot → runner:runner ==="
          sudo chown -R runner:runner /opt/onchain-bot 2>&1 || echo "chown warning (non-fatal)"
          echo "=== Ownership fixed ==="

      - name: Sync live source tree with master
        run: |
          set -euo pipefail
          echo "=== Starting rsync with sudo ==="
          sudo rsync -a --delete \
            --exclude='.git' \
            --exclude='uploads' \
            --exclude='.git/**' \
            --exclude='node_modules' \
            --exclude='node_modules/**' \
            --exclude='dist' \
            --exclude='dist/**' \
            --exclude='backups' \
            --exclude='backups/**' \
            --exclude='logs' \
            --exclude='logs/**' \
            --exclude='.env*' \
            /opt/actions-runner/_work/onchain-bot/onchain-bot/ \
            /opt/onchain-bot/
          echo "=== Fixing ownership after rsync ==="
          sudo chown -R runner:runner /opt/onchain-bot 2>&1 || echo "post-sync chown warning (non-fatal)"
          echo "=== Post-sync HEAD ==="
          git -C /opt/onchain-bot rev-parse HEAD 2>/dev/null || echo "no git repo (rsync-synced tree, expected on fresh hosts)"

      - name: Backup database
        run: |
          set -euo pipefail
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a
          echo "::add-mask::$POSTGRES_PASSWORD"
          BACKUP_DIR="${BACKUP_DIR:-/opt/onchain-bot/backups}"
          echo "=== Pre-deploy daily backup (rolling prod-backend, 7-day) ==="
          set +e
          BACKUP_MODE=daily BACKUP_BASENAME=prod-backend BACKUP_ORIGIN=pre-deploy \
          POSTGRES_CONTAINER=onchain-bot-postgres-production \
          POSTGRES_USER=alpha_meta_token_scanner \
          POSTGRES_DB=alpha_meta_token_scanner \
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
          bash /opt/onchain-bot/scripts/backup-db.sh
          BACKUP_RC=$?
          set -e
          echo "backup exit code: $BACKUP_RC"
          # --- Unified disk scale (ESCALA UNICA): warn >=80% / fail >=90% o <2GB libres ---
          DF_LINE="$(df -P "$BACKUP_DIR" 2>/dev/null | awk 'NR==2 {print $5, $4}')"
          if [ -z "$DF_LINE" ]; then
            DF_LINE="$(df -P / 2>/dev/null | awk 'NR==2 {print $5, $4}')"
          fi
          DISK_PCT="$(printf '%s' "$DF_LINE" | awk '{print $1}' | tr -d '%')"
          DISK_AVAIL_KB="$(printf '%s' "$DF_LINE" | awk '{print $2}')"
          case "$DISK_PCT" in ''|*[!0-9]*) DISK_PCT=0 ;; esac
          case "$DISK_AVAIL_KB" in ''|*[!0-9]*) DISK_AVAIL_KB=0 ;; esac
          DISK_H="$(df -h "$BACKUP_DIR" 2>/dev/null | awk 'NR==2 {print $5 " used, " $4 " avail"}')"
          [ -z "$DISK_H" ] && DISK_H="${DISK_PCT}% used"
          # --- Resolve latest daily artifact (never secrets) ---
          LATEST="$(ls -t "$BACKUP_DIR"/prod-backend-*.dump.gz 2>/dev/null | head -1 || true)"
          if [ -n "$LATEST" ]; then
            FNAME="$(basename "$LATEST")"
            SIZE_H="$(du -h "$LATEST" 2>/dev/null | cut -f1)"
            META_FILE="${LATEST%.dump.gz}.meta.txt"
            if [ -f "$META_FILE" ]; then
              SHA_VAL="$(grep -E '^sha256=' "$META_FILE" 2>/dev/null | cut -d= -f2 || true)"
            else
              SHA_VAL=""
            fi
            if [ -z "${SHA_VAL:-}" ]; then
              SHA_VAL="$(sha256sum "$LATEST" 2>/dev/null | awk '{print $1}')"
            fi
            MTIME="$(stat -c %Y "$LATEST" 2>/dev/null || stat -f %m "$LATEST" 2>/dev/null || echo 0)"
            NOW="$(date +%s)"
            AGE_S=$((NOW - MTIME)); [ "$AGE_S" -lt 0 ] && AGE_S=0
            if [ "$AGE_S" -lt 3600 ]; then AGE_H="$((AGE_S / 60))min";
            elif [ "$AGE_S" -lt 86400 ]; then AGE_H="$((AGE_S / 3600))h $(((AGE_S % 3600) / 60))min";
            else AGE_H="$((AGE_S / 86400))d $(((AGE_S % 86400) / 3600))h"; fi
          else
            FNAME="(missing)"; SIZE_H="(missing)"; SHA_VAL="(missing)"; AGE_H="(missing)"
          fi
          # --- Step summary table (no secrets: only file/size/sha/age/disk/offsite) ---
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "### Backup database (daily prod-backend, pre-deploy)"
              echo ""
              echo "| campo | valor |"
              echo "|---|---|"
              echo "| archivo | $FNAME |"
              echo "| tamaño | $SIZE_H |"
              echo "| sha | $SHA_VAL |"
              echo "| edad | $AGE_H |"
              echo "| uso disco | $DISK_H (${DISK_PCT}% / ${DISK_AVAIL_KB}KB libres) |"
              echo "| offsite pendiente | pendiente (sync T4 rclone aun no programado) |"
              echo "| exit code | $BACKUP_RC |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # --- Failure / disk signaling (ESCALA UNICA) + abort before migrations ---
          if [ "$BACKUP_RC" -ne 0 ]; then
            echo "::error::[ESCALA UNICA] backup diario prod-backend fallo (exit $BACKUP_RC). Aborto deploy antes de migraciones."
            exit "$BACKUP_RC"
          fi
          if [ "$DISK_PCT" -ge 90 ] || [ "$DISK_AVAIL_KB" -lt 2097152 ]; then
            echo "::error::[ESCALA UNICA] disco al ${DISK_PCT}% (${DISK_AVAIL_KB}KB libres): fail >=90% o <2GB libres. Aborto deploy antes de migraciones."
            exit 1
          fi
          if [ "$DISK_PCT" -ge 80 ]; then
            echo "::warning::[ESCALA UNICA] disco al ${DISK_PCT}% >= 80% (libres ${DISK_AVAIL_KB}KB)."
          fi
          echo "=== Backup step OK ==="

      - name: Disk cleanup (pre-pull, filtered)
        run: |
          echo "=== Disk before ==="
          df -h | head -20
          docker system df 2>&1 | head -20
          echo "=== Pruning (filtered, no volumes) ==="
          docker system prune -af --filter "until=24h" 2>&1 | tail -20 || true
          docker builder prune -af --filter "until=24h" 2>&1 | tail -10 || true
          sudo journalctl --vacuum-time=3d 2>&1 | tail -5 || true
          sudo journalctl --vacuum-size=100M 2>&1 | tail -5 || true
          sudo rm -f /opt/actions-runner/_diag/Worker_*.log 2>&1 | tail -5 || true
          echo "=== Disk after ==="
          df -h | head -20
          PCT=$(df / | tail -1 | awk '{print $5}' | tr -d '%'); if [ "$PCT" -gt 80 ]; then echo "::warning::disk ${PCT}% full"; fi

      - name: Pull images from GHCR
        run: |
          echo "=== Pulling backend ${{ github.sha }} (try sha, fallback latest) ==="
          docker pull ghcr.io/${{ github.repository }}-backend:${{ github.sha }} || docker pull ghcr.io/${{ github.repository }}-backend:latest
          docker tag ghcr.io/${{ github.repository }}-backend:${{ github.sha }} ghcr.io/${{ github.repository }}-backend:latest 2>/dev/null || true
          docker tag ghcr.io/${{ github.repository }}-backend:latest ghcr.io/${{ github.repository }}-backend:latest 2>/dev/null || true
          echo "=== Pulling frontend ${{ github.sha }} (try sha, fallback latest) ==="
          docker pull ghcr.io/${{ github.repository }}-frontend:${{ github.sha }} || docker pull ghcr.io/${{ github.repository }}-frontend:latest
          docker tag ghcr.io/${{ github.repository }}-frontend:${{ github.sha }} ghcr.io/${{ github.repository }}-frontend:latest 2>/dev/null || true
          docker tag ghcr.io/${{ github.repository }}-frontend:latest ghcr.io/${{ github.repository }}-frontend:latest 2>/dev/null || true
          docker images | head -20

      - name: Post-pull cleanup (aggressive, keep only current)
        run: |
          echo "=== Post-pull prune (remove old SHA tags, keep latest) ==="
          docker image prune -af 2>&1 | tail -20 || true
          docker builder prune -af 2>&1 | tail -10 || true
          echo "=== Disk after pull + prune ==="
          df -h | head -20
          docker system df 2>&1 | head -20
          PCT=$(df / | tail -1 | awk '{print $5}' | tr -d '%'); if [ "$PCT" -gt 80 ]; then echo "::warning::disk ${PCT}% full after pull+prune"; fi

      - name: Verify ingestion healthy before backend migrations (ordering gate)
        run: |
          # Code-before-schema law (db-separation todo 10): the backend drop
          # migration (1860000000001) deletes the legacy crypto-news tables, so
          # the ingestion-telegram MUST already serve them. The cutover order is
          # enforced by SEQUENTIAL PRs (ingestion first, backend second), and
          # this gate aborts the backend deploy if ingestion is not serving —
          # even if the two workflows ever race on the same push to master.
          echo "=== Ordering gate: ingestion must serve crypto-news sources ==="
          for i in $(seq 1 12); do
            if curl -sf http://localhost:3032/api/crypto-news/sources > /tmp/ingestion-gate.json 2>&1; then
              echo "✅ Ingestion healthy on attempt $i (sources endpoint 200)"
              head -c 300 /tmp/ingestion-gate.json; echo
              break
            fi
            echo "⏳ Ingestion not serving (attempt $i/12), retrying in 10s..."
            sleep 10
            if [ "$i" -eq 12 ]; then
              echo "::error::Ingestion-service is NOT serving :3032/api/crypto-news/sources after 120s. Aborting backend deploy: the drop migration must NOT run before the ingestion cutover (merge + deploy ingestion FIRST, then re-run this workflow)."
              exit 1
            fi
          done

      - name: Dry-run migrations (read-only, fail loudly)
        run: |
          set -euo pipefail
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a

          echo "=== Dry-run: pending migrations (migration:show, read-only, no writes) ==="
          if docker run --rm --network onchain-bot-net \
            --env-file /opt/onchain-bot/apps/backend/.env.production \
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }} \
            npx typeorm --dataSource dist/backend/src/shared/common/persistence/data-source.js migration:show \
            || docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml run --rm backend \
               npx typeorm --dataSource dist/backend/src/shared/common/persistence/data-source.js migration:show; then
            echo "✅ migration:show OK"
          else
            echo "::error::Migration dry-run FAILED (migration:show). Aborting deploy before any write."
            exit 1
          fi

          echo "=== Dry-run: precondition probe (read-only SELECT, no writes) ==="
          if docker run --rm --network onchain-bot-net \
            --env-file /opt/onchain-bot/apps/backend/.env.production \
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }} \
            npx typeorm --dataSource dist/backend/src/shared/common/persistence/data-source.js query "SELECT 1 AS dry_run_ok" \
            || docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml run --rm backend \
               npx typeorm --dataSource dist/backend/src/shared/common/persistence/data-source.js query "SELECT 1 AS dry_run_ok"; then
            echo "✅ precondition probe OK"
          else
            echo "::error::Migration precondition probe FAILED (read-only SELECT). Aborting deploy before any write."
            exit 1
          fi

          echo "=== Dry-run OK: zero writes performed ==="

      - name: Deploy via compose (no build)
        run: |
          set -euo pipefail
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a

          echo "=== Running migrations ==="
          docker run --rm --network onchain-bot-net \
            --env-file /opt/onchain-bot/apps/backend/.env.production \
            ghcr.io/${{ github.repository }}-backend:${{ github.sha }} \
            npx typeorm --dataSource dist/backend/src/shared/common/persistence/data-source.js migration:run \
            || docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml run --rm backend \
               npx typeorm --dataSource dist/backend/src/shared/common/persistence/data-source.js migration:run

          echo "=== Starting services with --wait (timeout 3min) ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml up -d --force-recreate --wait --wait-timeout 180 backend frontend \
            || docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml up -d --force-recreate

          echo "=== Verifying health ==="
          for i in {1..10}; do
            if curl -sf http://localhost:3030/api/health > /dev/null 2>&1; then
              echo "✅ Backend healthy on attempt $i"
              break
            fi
            echo "⏳ Health check $i/10 failed, retrying in 10s..."
            sleep 10
            if [ "$i" -eq 10 ]; then
              echo "❌ Backend never became healthy after 100s"
              docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml logs backend --tail 100
              exit 1
            fi
          done

          echo "=== Deploy complete ==="

      - name: Post-deploy smoke checks (read-only)
        env:
          SMOKE_BACKEND_URL: http://localhost:3030
          SMOKE_FRONTEND_URL: http://localhost:5173
          SMOKE_INGESTION_URL: http://localhost:3032
        run: |
          set -euo pipefail
          echo "=== Post-deploy smoke (prod ports, read-only probes) ==="
          bash scripts/smoke-prod.sh
          echo "=== Smoke complete ==="
