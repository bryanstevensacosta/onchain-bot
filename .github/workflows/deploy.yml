name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to droplet
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Sync live source tree with master
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git'
            --exclude='uploads' \
            --exclude='.git/**' \
            --exclude='node_modules' \
            --exclude='node_modules/**' \
            --exclude='dist' \
            --exclude='dist/**' \
            --exclude='backups' \
            --exclude='backups/**' \
            --exclude='logs' \
            --exclude='logs/**' \
            --exclude='.env*' \
            /opt/actions-runner/_work/onchain-bot/onchain-bot/ \
            /opt/onchain-bot/
          echo "=== Post-sync HEAD ==="
          git -C /opt/onchain-bot rev-parse HEAD

      - name: Backup database
        run: |
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a
          POSTGRES_CONTAINER=onchain-bot-postgres \
          POSTGRES_USER=alpha_meta_token_scanner \
          POSTGRES_DB=alpha_meta_token_scanner \
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
          bash /opt/onchain-bot/scripts/backup-db.sh

      - name: Build and deploy
        run: |
          set -euo pipefail
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a
          echo "=== Building images ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml build backend
          echo "=== Running migrations ==="
          POSTGRES_HOST=localhost \
          POSTGRES_USER=alpha_meta_token_scanner \
          POSTGRES_DB=alpha_meta_token_scanner \
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
          cd /opt/onchain-bot/apps/backend && \
          POSTGRES_HOST=localhost \
          POSTGRES_USER=alpha_meta_token_scanner \
          POSTGRES_DB=alpha_meta_token_scanner \
          POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
          npm run migration:run
          echo "=== Restarting services ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml up -d --force-recreate backend
          echo "=== Waiting for healthcheck ==="
          sleep 180
          curl -sf http://localhost:3030/api/health && echo "" || (
            echo "HEALTHCHECK FAILED — rolling back"
            docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml up -d --force-recreate backend
            sleep 180
            curl -sf http://localhost:3030/api/health && echo "Rollback successful" || {
              echo "ROLLBACK ALSO FAILED — manual intervention required"
              docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml logs backend --tail 50
              exit 1
            }
          )
          echo "=== Deploy complete ==="

      - name: Build + recreate frontend (non-blocking)
        run: |
          echo "=== Building frontend ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml build frontend || echo 'WARNING: frontend build failed (non-blocking)'
          echo "=== Recreating frontend ==="
          docker compose -f /opt/onchain-bot/apps/backend/docker-compose.prod.yml up -d --force-recreate frontend || echo 'WARNING: frontend recreate failed (non-blocking)'
          echo "=== Waiting for frontend health ==="
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173/ >/dev/null; then
              echo "Frontend healthy after ${i} attempts"
              break
            fi
            sleep 2
          done
