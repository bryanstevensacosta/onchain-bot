name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_ENABLED: true
      DATABASE_SYNCHRONIZE: true
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      REDIS_ENABLED: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run backend tests
        run: npm run test:backend

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Lint
        run: npm run lint

  deploy:
    name: Deploy to droplet
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_path: /tmp/deploy.sh
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/onchain-bot
            echo "=== Pulling latest code ==="
            git pull origin master
            echo "=== Backing up database ==="
            POSTGRES_CONTAINER=onchain-bot-postgres \
            POSTGRES_USER=alpha_meta_token_scanner \
            POSTGRES_DB=alpha_meta_token_scanner \
            POSTGRES_PASSWORD=$(grep '^POSTGRES_PASSWORD=' .env.production | cut -d= -f2-) \
            bash scripts/backup-db.sh
            echo "=== Building images ==="
            docker compose -f apps/backend/docker-compose.prod.yml build --no-cache
            echo "=== Running migrations ==="
            cd apps/backend
            POSTGRES_HOST=postgres \
            POSTGRES_USER=alpha_meta_token_scanner \
            POSTGRES_DB=alpha_meta_token_scanner \
            POSTGRES_PASSWORD=$(grep '^POSTGRES_PASSWORD=' .env.production | cut -d= -f2-) \
            docker compose -f docker-compose.prod.yml run --rm -T backend npm run migration:run
            cd /opt/onchain-bot
            echo "=== Restarting services ==="
            cd apps/backend && docker compose -f docker-compose.prod.yml up -d --force-recreate
            echo "=== Waiting for healthcheck ==="
            sleep 15
            curl -sf http://localhost:3030/api/health && echo "" || (echo "HEALTHCHECK FAILED" && docker compose -f docker-compose.prod.yml logs backend --tail 50 && exit 1)
            echo "=== Deploy complete ==="