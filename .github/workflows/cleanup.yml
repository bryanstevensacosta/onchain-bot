name: Disk Cleanup
on: workflow_dispatch
jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - name: Disk before
        run: df -h; echo "---"; du -sh /opt/actions-runner/_diag/* 2>&1 | head -20; echo "---"; docker system df 2>&1 | head -20
      - name: Aggressive cleanup
        run: |
          set +e
          echo "=== Docker prune ==="
          docker system prune -af --volumes 2>&1 | tail -10
          docker builder prune -af 2>&1 | tail -10
          docker image prune -af 2>&1 | tail -10
          echo "=== Journal ==="
          sudo journalctl --vacuum-size=100M 2>&1 | tail -5
          sudo journalctl --vacuum-time=2d 2>&1 | tail -5
          echo "=== Runner logs ==="
          sudo rm -f /opt/actions-runner/_diag/*.log 2>&1; echo "diag cleaned"
          sudo truncate -s 0 /opt/actions-runner/_diag/*.log 2>&1 | tail -5; echo "truncated"
          echo "=== NPM / tmp ==="
          npm cache clean --force 2>&1 | tail -3
          sudo rm -rf /tmp/* 2>&1 | tail -5
          sudo apt clean 2>&1 | tail -3
          echo "=== Old node_modules ==="
          du -sh /opt/onchain-bot/node_modules 2>&1 | head -5
          du -sh /opt/actions-runner/_work/onchain-bot 2>&1 | head -5
          echo "=== Disk after ==="
          df -h | head -10
