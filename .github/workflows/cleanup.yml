name: Disk Cleanup
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
jobs:
  cleanup:
    runs-on: self-hosted
    steps:
      - name: Disk before
        run: df -h; echo "---"; du -sh /opt/actions-runner/_diag/* 2>&1 | head -20; echo "---"; docker system df 2>&1 | head -20
      - name: Aggressive cleanup
        run: |
          set +e
          echo "=== Docker prune (filtered) ==="
          docker system prune -af --filter "until=24h" 2>&1 | tail -10
          docker builder prune -af --filter "until=24h" 2>&1 | tail -10
          docker image prune -af --filter "until=24h" 2>&1 | tail -10
          echo "=== Journal ==="
          sudo journalctl --vacuum-size=100M 2>&1 | tail -5
          sudo journalctl --vacuum-time=3d 2>&1 | tail -5
          echo "=== Runner logs ==="
          sudo rm -f /opt/actions-runner/_diag/*.log 2>&1; echo "diag cleaned"
          sudo truncate -s 0 /opt/actions-runner/_diag/*.log 2>&1 | tail -5; echo "truncated"
          echo "=== NPM / tmp ==="
          npm cache clean --force 2>&1 | tail -3
          sudo rm -rf /tmp/* 2>&1 | tail -5
          sudo apt clean 2>&1 | tail -3
          echo "=== Old node_modules ==="
          du -sh /opt/onchain-bot/node_modules 2>&1 | head -5
          du -sh /opt/actions-runner/_work/onchain-bot 2>&1 | head -5
          echo "=== Disk after ==="
          df -h | head -10
          PCT=$(df / | tail -1 | awk '{print $5}' | tr -d '%'); if [ "$PCT" -gt 80 ]; then echo "::warning::disk ${PCT}% full — schedule next prune"; fi
