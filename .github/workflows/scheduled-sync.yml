name: Scheduled Dev Sync

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check if dev is behind master
        id: check
        run: |
          git fetch origin master
          BEHIND=$(git rev-list --count HEAD..origin/master)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT

          if [ "$BEHIND" -gt 0 ]; then
            echo "⚠️ dev is $BEHIND commits behind master"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          else
            echo "✅ dev is up to date with master"
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          fi

      - name: Attempt automatic rebase
        if: steps.check.outputs.needs_sync == 'true'
        id: rebase
        run: |
          if git rebase origin/master; then
            echo "✅ Rebase successful"
            git push --force-with-lease origin dev
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Rebase failed - will create PR instead"
            git rebase --abort
            echo "success=false" >> $GITHUB_OUTPUT
          fi

      - name: Create PR if rebase failed
        if: steps.check.outputs.needs_sync == 'true' && steps.rebase.outputs.success == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            // Check if PR already exists
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:master`,
              base: 'dev'
            });

            if (pulls.length === 0) {
              // Create new PR
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'chore(sync): master → dev (scheduled)',
                head: 'master',
                base: 'dev',
                body: `## 🔄 Scheduled Sync: master → dev

                This PR was automatically created by the scheduled sync workflow because \`dev\` is ${{ steps.check.outputs.behind }} commits behind \`master\` and automatic rebase failed due to conflicts.

                **Action required:** Review and merge this PR to sync \`dev\` with \`master\`.

                **Conflicts detected:** Manual resolution required.

                ---
                *Triggered by: Scheduled workflow (every 6 hours)*`
              });

              console.log(`Created PR #${pr.number}`);
              
              // Add label
              await github.rest.issues.addLabels({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['sync', 'automated']
              });
            } else {
              console.log(`PR already exists: #${pulls[0].number}`);
            }

      - name: Summary
        if: steps.check.outputs.needs_sync == 'true'
        run: |
          if [ "${{ steps.rebase.outputs.success }}" == "true" ]; then
            echo "✅ dev automatically synced with master via rebase"
          else
            echo "⚠️ Conflicts detected - PR created for manual review"
          fi
