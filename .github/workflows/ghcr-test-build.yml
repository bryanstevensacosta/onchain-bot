name: GHCR Test — Build on GitHub (no droplet disk)
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'apps/backend/Dockerfile'
      - '.github/workflows/ghcr-test-build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Disk before (runner)
        run: df -h | head -10; docker system df || true

      - name: Build backend (test tag, no push to prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:test-${{ github.event.pull_request.number || 'manual' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Disk after + image size
        run: |
          df -h | head -10
          docker images ghcr.io/${{ github.repository }}-backend --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}" | head -10
          echo "=== Evidence: build on GitHub, not droplet ==="
