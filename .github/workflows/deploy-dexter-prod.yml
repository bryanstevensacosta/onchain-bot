name: Deploy Dexter to production

# Dexter prod deploy (dexter-deploy-and-frontend, Wave 2).
#
# DORMANT (2026-10-18): this workflow has never run against Oracle and
# stays dormant until the master merge gate opens. Wave 4 keeps a HARD
# owner gate: nothing here executes against prod without the owner's
# explicit confirmation at that moment (the push trigger exists so the
# automation is ready, not so it fires unattended).
# As of the provisioning fix (2026-10-18) the deploy job self-syncs the
# full repo tree (mirroring deploy.yml), so the destination
# /opt/onchain-bot/apps/dexter-onchain-bot/ is CREATED by the workflow —
# it does not exist on Oracle yet. `.env.production` is operator-owned
# (values never in git, never touched by rsync — the sync excludes
# `.env*`) and NOT provisioned yet; the precondition step aborts before
# any mutation until the operator places it.
# OPERATOR-CONFIRM at first rollout: .env.production values and host
# ports :4062/:5448/:6395 with lsof (Wave 4 gate).
# STAGING RUN 39126203303 (2026-10-18) surfaced two defects mirrored
# here: Docker DNS alias `postgres` is ambiguous on shared deploy
# networks (use the UNIQUE container-name host) and one-off DB creds
# must be explicit (the operator file proved unreliable). Wave 4 owner
# gate revisits credential policy — if real prod creds get pinned via
# compose interpolation, update the `-e DATABASE_URL` below in the SAME
# change.
# MULTI-ARCH (same-day fix, 2026-10-18): the Oracle host is aarch64 —
# the amd64-only build died pulling on staging (run 39127374679, `no
# matching manifest for linux/arm64/v8`). Both workflows now build
# `linux/amd64,linux/arm64` via setup-qemu (mirror deploy.yml).
# Staging validation 2026-10-18: first GOOD deploy (run 39127827233) +
# rollback lane sim green. This prod lane stays dormant (never
# deployed; Wave 4 gate).
#
# ANTI-DOUBLE-FIRE: this workflow owns dexter paths ONLY
# (apps/dexter-onchain-bot/** + itself). Disjoint from deploy.yml
# (backend/frontend/scripts/config/package* on master) and
# deploy-ingestion.yml (apps/ingestion-telegram/**) — verified by grep
# of their `paths:` blocks, documented in the Wave 2 evidence log.
# Mixed pushes (dexter + backend) fire one lane per app = correct,
# never a duplicate deploy of the same service.

on:
  push:
    branches: [master]
    paths:
      - 'apps/dexter-onchain-bot/**'
      - '.github/workflows/deploy-dexter-prod.yml'
      # NOT backend/frontend/ingestion paths (owned by other workflows)
  workflow_dispatch:
    inputs:
      lane:
        description: 'Lane: full deploy (default) or dispatch-only manual rollback lane (escape hatch, never auto)'
        required: false
        default: 'full'
        type: choice
        # Rollback lanes mirror deploy.yml (item 9c): re-raise the last
        # GOOD :prev-dexter pin. Dispatch-only, never on push.
        options: [full, rollback-dexter-prod]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push dexter to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Rollback lane owns no build (it re-raises the pinned image).
    if: github.event_name == 'push' || inputs.lane == 'full'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dexter (multi-arch amd64+arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dexter-onchain-bot/Dockerfile
          push: true
          # Tags: immutable :sha + floating :latest (prod lane owns it;
          # staging uses :staging-latest, never this tag).
          tags: ghcr.io/${{ github.repository }}-dexter:${{ github.sha }},ghcr.io/${{ github.repository }}-dexter:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-dexter:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}-dexter:cache,mode=max
          # multi-arch: Oracle hosts are aarch64 (verified 2026-10-18;
          # run 39127374679 died pulling an amd64-only build there).
          # Mirrors deploy.yml (backend prod, same host). Supersedes the
          # plan's amd64-only note (its premise was wrong).
          platforms: linux/amd64,linux/arm64

  deploy:
    name: Deploy dexter to Oracle production
    runs-on: [self-hosted, oracle]
    # Single-flight on the dexter prod target. Own group (never the
    # backend/ingestion groups) — dexter services are disjoint.
    # cancel-in-progress:false — lanes run migrations; killing one
    # mid-migration corrupts schema state.
    concurrency:
      group: dexter-production-target
      cancel-in-progress: false
    needs: [build-and-push]
    # Push legs and lane=full deploy; the rollback lane is owned by the
    # rollback jobs below, not this one.
    if: github.event_name == 'push' || inputs.lane == 'full'
    timeout-minutes: 30
    environment: production
    # Auto-rollback contract (mirrors deploy.yml): smoke_entered is true
    # once the post-deploy smoke phase starts. The auto-rollback job
    # gates on this output so a red deploy BEFORE smoke (backup,
    # migrations, health) never triggers a rollback — only post-smoke
    # red does.
    outputs:
      smoke_entered: ${{ steps.smoke-marker.outputs.smoke_entered }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PROVISIONING (fix 2026-10-18): the three steps below mirror
      # deploy.yml's sync/ownership pattern so this job provisions its own
      # tree. /opt/onchain-bot/apps/dexter-onchain-bot/ does not exist yet —
      # the rsync below CREATES it on the first (Wave 4) run. Workflow
      # stays DORMANT until the master merge gate; nothing was dispatched.

      - name: Fix ownership before sync (chown -R runner:runner)
        # Mirror of deploy.yml's tolerant pattern (sudo + non-fatal warn).
        run: |
          echo "=== Fixing ownership: /opt/onchain-bot → runner:runner ==="
          sudo chown -R runner:runner /opt/onchain-bot 2>&1 || echo "chown warning (non-fatal)"
          echo "=== Ownership fixed ==="

      - name: Sync live source tree with master
        # Mirror of deploy.yml's sync (sudo rsync + post-sync chown). This
        # is what creates docker-compose.prod.yml + the Dockerfile under
        # /opt/onchain-bot/apps/dexter-onchain-bot/ on the first run.
        run: |
          set -euo pipefail
          echo "=== Starting rsync with sudo ==="
          # `.env*` exclusion is LOAD-BEARING: it protects the
          # operator-owned, never-in-git
          # /opt/onchain-bot/apps/dexter-onchain-bot/.env.production
          # (rsync neither syncs nor deletes it); the precondition step
          # below asserts it is present before any mutation.
          sudo rsync -a --delete \
            --exclude='.git' \
            --exclude='uploads' \
            --exclude='.git/**' \
            --exclude='node_modules' \
            --exclude='node_modules/**' \
            --exclude='dist' \
            --exclude='dist/**' \
            --exclude='backups' \
            --exclude='backups/**' \
            --exclude='logs' \
            --exclude='logs/**' \
            --exclude='.env*' \
            /opt/actions-runner/_work/onchain-bot/onchain-bot/ \
            /opt/onchain-bot/
          echo "=== Fixing ownership after rsync ==="
          sudo chown -R runner:runner /opt/onchain-bot 2>&1 || echo "post-sync chown warning (non-fatal)"
          echo "=== Post-sync HEAD ==="
          git -C /opt/onchain-bot rev-parse HEAD 2>/dev/null || echo "no git repo (rsync-synced tree, expected on fresh hosts)"

      - name: 'Precondition: dexter prod env present'
        # Operator-owned env file (values never in git). Fail loudly BEFORE
        # the backup/migration/recreate mutations if it is missing on the
        # host. Not provisioned yet (workflow dormant) — the operator
        # places .env.production at the Wave 4 rollout.
        run: |
          test -s /opt/onchain-bot/apps/dexter-onchain-bot/.env.production || { echo "::error::.env.production missing at /opt/onchain-bot/apps/dexter-onchain-bot/ (operator step; values never in git) — aborting before any mutation"; exit 1; }

      - name: Backup dexter production database
        run: |
          # PRE-FIRST-RUN NOTE (2026-10-18): prod is not provisioned yet
          # (workflow dormant; /opt/onchain-bot/apps/dexter-onchain-bot/
          # absent until the sync above runs). Container
          # onchain-bot-dexter-postgres-prod + backup dir
          # /data/backups/dexter-prod remain OPERATOR-CONFIRM at the
          # Wave 4 rollout (HARD owner gate).
          set -euo pipefail
          DEXTER_PG="$(docker ps --format '{{.Names}}' | grep -qx 'onchain-bot-dexter-postgres-prod' && echo 'onchain-bot-dexter-postgres-prod' || true)"
          if [ -n "$DEXTER_PG" ]; then
            mkdir -p /data/backups/dexter-prod
            docker exec "$DEXTER_PG" pg_dump -U onchain_bot \
              onchain_bot_dexter > /data/backups/dexter-prod/dexter-prod-backup-$(date +%Y%m%d-%H%M%S).sql
            ls -la /data/backups/dexter-prod/ | tail -5
            # Cleanup backups older than 7 days
            find /data/backups/dexter-prod -maxdepth 1 -name 'dexter-prod-backup-*.sql' -mtime +7 -delete 2>/dev/null || true
            echo "backup OK (size>0 asserted below)"
            LATEST="$(ls -t /data/backups/dexter-prod/dexter-prod-backup-*.sql | head -1)"
            test -s "$LATEST" || { echo "::error::backup artifact is empty ($LATEST). Aborting before migrations."; exit 1; }
          else
            echo "::warning::dexter prod postgres container absent (first deploy?) — no backup to take, proceeding to migrations."
          fi

      - name: Ensure dexter production databases running
        run: |
          set -euo pipefail
          cd /opt/onchain-bot/apps/dexter-onchain-bot
          docker compose -f docker-compose.prod.yml up -d postgres redis
          echo "=== Waiting for postgres+redis healthy (max 60s) ==="
          for i in $(seq 1 12); do
            PG=$(docker inspect --format '{{.State.Health.Status}}' onchain-bot-dexter-postgres-prod 2>/dev/null || echo "missing")
            RD=$(docker inspect --format '{{.State.Health.Status}}' onchain-bot-dexter-redis-prod 2>/dev/null || echo "missing")
            echo "  attempt $i/12: postgres=$PG redis=$RD"
            if [ "$PG" = "healthy" ] && [ "$RD" = "healthy" ]; then
              echo "dexter prod databases healthy"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "::error::dexter prod databases not healthy after 60s (postgres=$PG redis=$RD)"
              exit 1
            fi
            sleep 5
          done

      - name: Build migration one-off image (--target builder)
        run: |
          # The dexter Dockerfile keeps its builder stage intact (verified:
          # `AS builder` at Dockerfile:5 — plan requirement, no redesign).
          # Migrations run in a throwaway builder container so the minimal
          # prod image is never touched.
          # INVOCATION (fix 2026-10-18, same as the staging twin): cwd ==
          # build context root and the `-f` path is relative to BOTH, so it
          # resolves identically under either interpretation
          # (relative-to-cwd vs relative-to-context) — unambiguous.
          set -euo pipefail
          cd /opt/onchain-bot
          docker build --target builder \
            -f apps/dexter-onchain-bot/Dockerfile \
            -t ghcr.io/${{ github.repository }}-dexter-migrate:${{ github.sha }} \
            .

      - name: Dry-run migrations (read-only, fail loudly)
        run: |
          set -euo pipefail
          echo "=== Dry-run: pending migrations (migration:show, read-only, no writes) ==="
          # Explicit DATABASE_URL, NOT --env-file (staging run
          # 39126203303 fix): host = UNIQUE container name (the bare
          # `postgres` alias is ambiguous on shared deploy networks);
          # creds = compose-interpolation defaults. Wave 4 gate revisits
          # real prod creds (see header).
          if docker run --rm --network onchain-bot-net \
            -e "DATABASE_URL=postgres://onchain_bot:onchain_bot@onchain-bot-dexter-postgres-prod:5432/onchain_bot_dexter" \
            ghcr.io/${{ github.repository }}-dexter-migrate:${{ github.sha }} \
            npm run migration:show --workspace=@onchain-bot/dexter-onchain-bot; then
            echo "migration:show OK"
          else
            echo "::error::Dexter prod migration dry-run FAILED (migration:show). Aborting deploy before any write."
            exit 1
          fi

          echo "=== Dry-run: precondition probe (read-only SELECT, no writes) ==="
          if docker run --rm --network onchain-bot-net \
            -e "DATABASE_URL=postgres://onchain_bot:onchain_bot@onchain-bot-dexter-postgres-prod:5432/onchain_bot_dexter" \
            ghcr.io/${{ github.repository }}-dexter-migrate:${{ github.sha }} \
            npm run typeorm --workspace=@onchain-bot/dexter-onchain-bot -- query "SELECT 1 AS dry_run_ok"; then
            echo "precondition probe OK"
          else
            echo "::error::Dexter prod precondition probe FAILED (read-only SELECT). Aborting deploy before any write."
            exit 1
          fi

          echo "=== Dry-run OK: zero writes performed ==="

      - name: Run migrations (production, builder one-off)
        run: |
          set -euo pipefail
          echo "=== Running dexter TypeORM migrations in production ==="
          # Same explicit DATABASE_URL as the dry-run step (unique host —
          # see the comment there).
          docker run --rm --network onchain-bot-net \
            -e "DATABASE_URL=postgres://onchain_bot:onchain_bot@onchain-bot-dexter-postgres-prod:5432/onchain_bot_dexter" \
            ghcr.io/${{ github.repository }}-dexter-migrate:${{ github.sha }} \
            npm run migration:run --workspace=@onchain-bot/dexter-onchain-bot
          echo "=== Migrations applied successfully ==="

      - name: Pull dexter image and recreate service
        run: |
          set -euo pipefail
          docker pull ghcr.io/${{ github.repository }}-dexter:${{ github.sha }} || docker pull ghcr.io/${{ github.repository }}-dexter:latest
          docker tag ghcr.io/${{ github.repository }}-dexter:${{ github.sha }} ghcr.io/${{ github.repository }}-dexter:latest 2>/dev/null || true
          cd /opt/onchain-bot/apps/dexter-onchain-bot
          docker compose -f docker-compose.prod.yml up -d --force-recreate dexter
          echo "=== dexter service recreated ==="

      - name: Wait for dexter healthcheck (:4062)
        run: |
          echo "=== Waiting for dexter prod to become healthy (max 5 min) ==="
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4062/api/health > /tmp/health-dexter-prod.log 2>&1; then
              echo "dexter prod is healthy (attempt $i)"
              cat /tmp/health-dexter-prod.log
              break
            fi
            echo "  Waiting... attempt $i/30"
            sleep 10
            if [ "$i" -eq 30 ]; then
              echo "::error::Dexter prod healthcheck failed after 30 attempts (5 minutes total)"
              echo "=== dexter container logs (last 50 lines) ==="
              docker logs --tail 50 onchain-bot-dexter-prod 2>&1 || true
              echo "=== dexter container status ==="
              docker ps -a -f name=onchain-bot-dexter-prod || true
              exit 1
            fi
          done

      - name: Pin :prev-dexter on GOOD deploy (rollback contract)
        # Contract (mirrors deploy.yml): namespaced pin, NEVER bare :prev.
        # Runs only after health passed = GOOD deploy by definition.
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          docker tag ghcr.io/${{ github.repository }}-dexter:"$SHA" ghcr.io/${{ github.repository }}-dexter:prev-dexter \
            || docker tag ghcr.io/${{ github.repository }}-dexter:latest ghcr.io/${{ github.repository }}-dexter:prev-dexter
          docker push ghcr.io/${{ github.repository }}-dexter:prev-dexter
          echo "pinned dexter:prev-dexter @ $SHA"

      - name: Mark smoke entered (auto-rollback gate signal)
        id: smoke-marker
        run: echo "smoke_entered=true" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke checks (read-only)
        run: |
          set -euo pipefail
          echo "=== Post-deploy smoke (dexter prod :4062, read-only probes) ==="
          curl -sf --max-time 10 http://localhost:4062/api/health | jq '.'
          curl -sf --max-time 10 "http://localhost:4062/api/dexter/templates?command=ca" | jq '. | length'
          echo "=== Smoke complete ==="

  # AUTO-ROLLBACK (mirrors deploy.yml auto-rollback pattern) — fires ONLY
  # on post-smoke red: deploy FAILED + smoke phase was entered
  # (smoke_entered output). A red deploy BEFORE smoke never rolls back.
  # Dispatching a NEW run would deadlock on the shared
  # dexter-production-target concurrency group, so the rollback reuses
  # the lane mechanics inline (same pin/compose/health gates).
  # DATA DOCTRINE: rollback = code-only; migrations NEVER revert
  # (roll-forward); data = restore from the pg_dump pre-deploy artifact
  # by explicit HUMAN decision only (never automatic, never in a loop).
  auto-rollback-dexter-prod:
    name: Auto-rollback dexter prod on smoke failure (:prev-dexter)
    runs-on: [self-hosted, oracle]
    concurrency:
      group: dexter-production-target
      cancel-in-progress: false
    needs: [deploy]
    if: failure() && needs.deploy.outputs.smoke_entered == 'true'
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record auto-rollback decision
        run: |
          {
            echo "### Auto-rollback dexter prod (smoke rojo → :prev-dexter → :4062)"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| trigger | post-deploy smoke FAILED (deploy job red, smoke entered) |"
            echo "| target | dexter:prev-dexter → :4062 |"
            echo "| manual escape | dispatch lane=rollback-dexter-prod intacto |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pull rollback target :prev-dexter (read-only, no retag yet)
        run: |
          set -euo pipefail
          echo "ROLLBACK_T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/auto-dexter-prod-rollback-t0
          docker pull ghcr.io/${{ github.repository }}-dexter:prev-dexter || { echo "::error::no dexter:prev-dexter pinned (pins on GOOD deploys only) — auto-rollback inexecutable → ESCALATE (second level, see failure step)"; exit 1; }

      - name: Stop dexter prod (bounded grace, --timeout 30)
        run: |
          set -euo pipefail
          cd /opt/onchain-bot/apps/dexter-onchain-bot
          docker compose -f docker-compose.prod.yml stop --timeout 30 dexter
          if docker ps --format '{{.Names}}' | grep -qx 'onchain-bot-dexter-prod'; then
            echo "::error::REFUSE: dexter container still running — investigate instead of starting a second one"
            exit 1
          fi
          echo "OK: dexter stopped — safe to start exactly one"

      - name: Recreate dexter from :prev-dexter (no pull — local retag wins)
        run: |
          set -euo pipefail
          docker tag ghcr.io/${{ github.repository }}-dexter:prev-dexter ghcr.io/${{ github.repository }}-dexter:latest
          cd /opt/onchain-bot/apps/dexter-onchain-bot
          docker compose -f docker-compose.prod.yml up -d --force-recreate dexter

      - name: Healthcheck gate (:4062) + downtime measured
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf --max-time 8 http://localhost:4062/api/health >/dev/null 2>&1; then
              echo "dexter healthy after ~$((i * 10))s"
              break
            fi
            [ "$i" -eq 30 ] && { echo "::error::dexter healthcheck failed after auto-rollback — ESCALATE (second level, see failure step)"; exit 1; }
            sleep 10
          done
          echo "ROLLBACK_T1=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/auto-dexter-prod-rollback-t1
          echo "downtime window: $(cat /tmp/auto-dexter-prod-rollback-t0) → $(cat /tmp/auto-dexter-prod-rollback-t1)"

      - name: Second-level escalation (auto-rollback FAILED)
        if: failure()
        run: |
          {
            echo "### ESCALATION segundo nivel — auto-rollback dexter prod FALLIDO"
            echo ""
            echo "1. CONGELAR lanes: no re-disparar rollback (sin re-loops — el pin :prev-dexter ya está vivo o ausente; un segundo ciclo solo suma downtime). Lock manual: avisar al operador ANTES de cualquier dispatch/retry."
            echo "2. AVISAR operador con ventana de downtime: $(cat /tmp/auto-dexter-prod-rollback-t0 2>/dev/null || echo T0-desconocido) → $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo "3. DUMP pre-deploy: artifact pg_dump citado en el summary del job deploy (backups/dexter-prod-*.sql) — adjuntar filename al incident record."
            echo "4. INVALIDAR pin envenenado: si :prev-dexter también está rojo, no reintentarlo — forward-fix (nuevo sha) o restore."
            echo "5. DB restore = decisión HUMANA explícita (jamás automática, jamás segundo rollback en loop): stop → pg_restore/psql del artifact → start → migration:show + counts asserts."
            echo "6. Presupuesto: rollback <60s; sin verde en 2 ventanas de healthcheck → forward-fix-or-restore."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::ESCALATION segundo nivel: auto-rollback dexter prod fallido — lanes congelados, operador requerido (ver summary)"

  # ROLLBACK LANE — manual dispatch only, never auto (escape hatch when
  # auto-rollback is inexecutable or the pin needs a human decision).
  # Discipline: stop → verify-stopped (gate) → start exactly one service
  # from the pinned tag; `docker compose pull` is FORBIDDEN inside
  # rollback (it would re-fetch the broken :latest).
  rollback-dexter-prod:
    name: Rollback dexter prod to :prev-dexter (:4062)
    runs-on: [self-hosted, oracle]
    concurrency:
      group: dexter-production-target
      cancel-in-progress: false
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'rollback-dexter-prod'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull rollback target :prev-dexter (read-only, no retag yet)
        run: |
          set -euo pipefail
          echo "ROLLBACK_T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/dexter-prod-rollback-t0
          docker pull ghcr.io/${{ github.repository }}-dexter:prev-dexter || { echo "::error::no dexter:prev-dexter pinned (pins on GOOD deploys only) — rollback inexecutable, deploy instead"; exit 1; }

      - name: Stop dexter prod (bounded grace, --timeout 30)
        run: |
          set -euo pipefail
          cd /opt/onchain-bot/apps/dexter-onchain-bot
          docker compose -f docker-compose.prod.yml stop --timeout 30 dexter
          if docker ps --format '{{.Names}}' | grep -qx 'onchain-bot-dexter-prod'; then
            echo "::error::REFUSE: dexter container still running — investigate instead of starting a second one"
            exit 1
          fi
          echo "OK: dexter stopped — safe to start exactly one"

      - name: Recreate dexter from :prev-dexter (no pull — local retag wins)
        run: |
          set -euo pipefail
          docker tag ghcr.io/${{ github.repository }}-dexter:prev-dexter ghcr.io/${{ github.repository }}-dexter:latest
          cd /opt/onchain-bot/apps/dexter-onchain-bot
          docker compose -f docker-compose.prod.yml up -d --force-recreate dexter

      - name: Healthcheck gate (:4062) + post-rollback asserts + downtime measured
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -sf --max-time 8 http://localhost:4062/api/health >/dev/null 2>&1; then
              echo "dexter healthy after ~$((i * 10))s"
              break
            fi
            [ "$i" -eq 30 ] && { echo "::error::dexter healthcheck failed after rollback — retry + escalate, never blind re-run"; exit 1; }
            sleep 10
          done
          echo "=== migration:show (schema state assert, read-only) ==="
          docker compose -f /opt/onchain-bot/apps/dexter-onchain-bot/docker-compose.prod.yml run --rm dexter \
            npm run migration:show --workspace=@onchain-bot/dexter-onchain-bot || true
          echo "ROLLBACK_T1=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/dexter-prod-rollback-t1
          echo "downtime window: $(cat /tmp/dexter-prod-rollback-t0) → $(cat /tmp/dexter-prod-rollback-t1)"
