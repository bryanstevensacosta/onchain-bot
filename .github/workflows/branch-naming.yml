name: Branch Naming

on:
  push:
    branches: [dev]

jobs:
  check-branch-name:
    name: Check branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          branch="${GITHUB_REF##refs/heads/}"
          if [[ ! "$branch" =~ ^(feat|fix|chore|ci|docs|refactor|perf|test|revert|build|style|hotfix|release)/.+ ]]; then
            echo "❌ Branch name must match ^(feat|fix|chore|ci|docs|refactor|perf|test|revert|build|style|hotfix|release)/.+"
            echo "Current branch: $branch"
            exit 1
          fi
        shell: bash
