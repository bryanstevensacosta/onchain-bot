name: Sync master to dev

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync master to dev via rebase
        run: |
          git fetch origin dev
          git checkout dev
          git rebase origin/master
          git push --force-with-lease origin dev
        continue-on-error: true

      - name: Create sync PR if rebase fails
        if: failure()
        run: |
          git rebase --abort || true
          git checkout -b sync/master-to-dev-$(date +%Y%m%d-%H%M%S)
          git push origin HEAD
          gh pr create \
            --base dev \
            --head $(git branch --show-current) \
            --title "chore: sync master → dev (auto, conflicts detected)" \
            --body "Automated sync from master to dev detected conflicts. Please resolve manually."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
