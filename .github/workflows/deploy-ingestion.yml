name: Deploy Ingestion Service

on:
  push:
    branches: [master, dev]
    paths:
      - 'apps/ingestion-telegram/**'
      - '.github/workflows/deploy-ingestion.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Which ingestion lane to deploy (staging twin needs item-1 compose + staging env on Oracle server)'
        required: false
        default: 'production'
        type: choice
        # Rollback targets (item 6): re-raise the last GOOD pinned tag
        # (:prev prod / :staging-prev staging). Dispatch-only, never on push.
        options: [production, staging, rollback-production, rollback-staging]

# CONCURRENCY (item 9d): ONE shared group per physical target across all 3
# deploy workflows. Prod target = /opt/onchain-bot (this workflow's prod lane
# + prod rollback + the backend/frontend prod lanes of deploy.yml share it).
# The twin lane + staging rollback override with ingestion-staging-target
# below (staging target = /opt/onchain-bot-staging — shared with
# deploy-staging.yml; this closes the twin-vs-deploy-staging race).
# cancel-in-progress:false — lanes run migrations; killing one mid-migration
# corrupts schema state. Tradeoff accepted and documented: a broken commit
# blocks the queue behind it (operator cancels queued-not-running runs by
# hand). Policy: supersede-queued-not-running ONLY, never kill a running lane.
# C5: enforced at JOB level on self-hosted deploy/rollback jobs only
# (preflight/build jobs unguarded) — same groups below.

jobs:
  # Dispatch-target guard: fails the run LOUDLY on empty/unknown target.
  # Rationale: run 35825487913 dispatched with empty target silently skipped
  # all 4 lanes (only build ran) — green-looking run, nothing deployed.
  # Dispatch-only (`if` below): push events skip this job entirely.
  # No `needs:` wiring on purpose: the 4 lanes already carry exact
  # `inputs.target == '<lane>'` job-level `if`s, so an unknown target keeps
  # them skipped while THIS job fails red. Adding `needs: validate-target`
  # would couple push paths (where this job is skipped) to dispatch logic
  # for zero extra safety — minimal correct shape is fail-loud here.
  validate-target:
    name: Validate dispatch target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Validate target input
        run: |
          TARGET="${{ inputs.target }}"
          case "$TARGET" in
            production|staging|rollback-production|rollback-staging)
              echo "dispatch target OK: $TARGET"
              ;;
            *)
              echo "::error::unknown target, expected production|staging|rollback-production|rollback-staging (got '$TARGET')"
              exit 1
              ;;
          esac

  build-and-push:
    name: Build and push ingestion service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ingestion-telegram/Dockerfile
          push: true
          # TAG HYGIENE (C1): :sha always; :latest ONLY from master legs;
          # dev/dispatch-from-dev legs push :dev-latest + :dev-<sha> instead —
          # dev builds NEVER push bare :latest (prod/twin pull strictly :sha).
          tags: |
            ghcr.io/${{ github.repository }}-ingestion-telegram:${{ github.sha }}
            ghcr.io/${{ github.repository }}-ingestion:${{ github.sha }}
            ghcr.io/${{ github.repository }}-ingestion-telegram:${{ github.ref == 'refs/heads/master' && 'latest' || 'dev-latest' }}
            ghcr.io/${{ github.repository }}-ingestion:${{ github.ref == 'refs/heads/master' && 'latest' || 'dev-latest' }}
            ${{ github.ref != 'refs/heads/master' && format('ghcr.io/{0}-ingestion-telegram:dev-{1}', github.repository, github.sha) || format('ghcr.io/{0}-ingestion-telegram:{1}', github.repository, github.sha) }}
            ${{ github.ref != 'refs/heads/master' && format('ghcr.io/{0}-ingestion:dev-{1}', github.repository, github.sha) || format('ghcr.io/{0}-ingestion:{1}', github.repository, github.sha) }}
          # TEMPORARY cache disable lifted — re-enabled 2026-09-10
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository }}-ingestion-telegram:cache
            type=registry,ref=ghcr.io/${{ github.repository }}-ingestion:cache
          cache-to: |
            type=registry,ref=ghcr.io/${{ github.repository }}-ingestion-telegram:cache,mode=max
            type=registry,ref=ghcr.io/${{ github.repository }}-ingestion:cache,mode=max
          # T2 version-match (prod-safety-gates item 2): bake the built commit
          # SHA into the image (Dockerfile ARG->ENV IMAGE_REVISION) so
          # /api/health exposes it as imageRevision. SHA var: github.sha —
          # this job has no preflight; tags above already use github.sha on
          # every leg (push master/dev + dispatch production/staging), so the
          # arg matches the tag on all of them by construction.
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64

  deploy:
    name: Deploy to Oracle
    runs-on: [self-hosted, oracle]
    timeout-minutes: 30
    needs: build-and-push
    # C5: job-level single-flight on the prod target (serializes against
    # prod rollback lanes sharing this group; build/preflight jobs unguarded).
    concurrency:
      group: ingestion-production-target
      cancel-in-progress: false
    # T4 auto-rollback contract: smoke_entered is true once the post-deploy
    # health/smoke phase starts (Wait for health) — only post-smoke-rojo
    # triggers auto-rollback, never a red deploy before smoke.
    outputs:
      smoke_entered: ${{ steps.smoke-marker.outputs.smoke_entered }}
    permissions:
      contents: read
      packages: write
    # Guard only: prod fires on master push or production dispatch ONLY.
    # Master-only ref guard is REQUIRED now that push.branches includes dev:
    # without it the bare `push` leg would deploy prod on dev pushes.
    # Staging dispatch runs skip prod (item 2). Prod steps otherwise untouched.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    environment: production # Solo un entorno
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix ownership before operations (chown -R runner:runner)
        run: |
          echo "=== chown -R runner:runner /opt/onchain-bot ==="
          sudo chown -R runner:runner /opt/onchain-bot || chown -R runner:runner /opt/onchain-bot || echo 'chown warning (non-fatal)'
          echo "=== ownership fixed ==="

      - name: Pull deploy image (strict :sha, fail loudly on miss)
        # C1: lanes pull strictly :<sha> — no :latest fallback (a missing sha
        # fails the lane instead of silently deploying stale :latest).
        run: |
          docker pull ghcr.io/${{ github.repository }}-ingestion-telegram:${{ github.sha }}
          docker pull ghcr.io/${{ github.repository }}-ingestion:${{ github.sha }}

      - name: Backup ingestion database
        run: |
          ENVF=/opt/onchain-bot/apps/ingestion-telegram/.env.production; [ -f "$ENVF" ] || ENVF=/opt/onchain-bot/apps/ingestion-service/.env.production; set -a; source "$ENVF"; set +a
          # Same postgres container/user as the backend DB; password comes from
          # INGESTION_DATABASE_PASSWORD (falls back to POSTGRES_PASSWORD if set).
          mkdir -p /data/backups/ingestion
          POSTGRES_CONTAINER=onchain-bot-postgres-production \
          POSTGRES_USER="${INGESTION_DATABASE_USER:-alpha_meta_token_scanner}" \
          POSTGRES_DB="${INGESTION_DATABASE_NAME:-alpha_meta_token_scanner_ingestion}" \
          POSTGRES_PASSWORD="${INGESTION_DATABASE_PASSWORD:-${POSTGRES_PASSWORD:-}}" \
          bash /opt/onchain-bot/scripts/backup-db.sh || {
            PG_FB="$(docker ps --format '{{.Names}}' | grep -E '^(onchain-bot-postgres-production|onchain-bot-postgres)$' | head -n 1)"
            docker exec -e PGPASSWORD="${INGESTION_DATABASE_PASSWORD:-${POSTGRES_PASSWORD:-}}" \
              "$PG_FB" pg_dump -U "${INGESTION_DATABASE_USER:-alpha_meta_token_scanner}" \
              -d "${INGESTION_DATABASE_NAME:-alpha_meta_token_scanner_ingestion}" \
              --format=custom --no-owner --no-acl \
              > /data/backups/ingestion/ingestion-backup-$(date +%Y%m%d-%H%M%S).dump
          }
          # Cleanup backups older than 7 days
          find /data/backups/ingestion -maxdepth 1 -name 'ingestion-backup-*.dump' -mtime +7 -delete 2>/dev/null || true

      - name: Run ingestion migrations (abort deploy on failure)
        run: |
          set -euo pipefail
          ENVF=/opt/onchain-bot/apps/ingestion-telegram/.env.production; [ -f "$ENVF" ] || ENVF=/opt/onchain-bot/apps/ingestion-service/.env.production; set -a; source "$ENVF"; set +a

          echo "=== Running ingestion TypeORM migrations ==="
          docker run --rm --network onchain-bot-net \
            --env-file "$ENVF" \
            ghcr.io/${{ github.repository }}-ingestion-telegram:${{ github.sha }} \
            npx typeorm --dataSource apps/ingestion-telegram/dist/src/shared/common/persistence/data-source.js migration:run \
            || docker compose -f /opt/onchain-bot/apps/backend/docker-compose.ingestion.yml run --rm ingestion-telegram \
                npx typeorm --dataSource apps/ingestion-telegram/dist/src/shared/common/persistence/data-source.js migration:run

          echo "=== Ingestion migrations applied successfully ==="

      - name: Restart ingestion service
        # C1: no `compose pull` (compose pins :latest) — retag verified :sha
        # to :latest locally, then recreate without pulling.
        run: |
          ENVF=/opt/onchain-bot/apps/ingestion-telegram/.env.production; [ -f "$ENVF" ] || ENVF=/opt/onchain-bot/apps/ingestion-service/.env.production; set -a; source "$ENVF"; set +a
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a
          IMG_BASE=ghcr.io/${{ github.repository }}-ingestion-telegram
          docker tag "$IMG_BASE:${{ github.sha }}" "$IMG_BASE:latest"
          cd /opt/onchain-bot/apps/backend
          docker compose -f docker-compose.ingestion.yml up -d --force-recreate

      - name: Mark smoke entered (T4 auto-rollback gate signal)
        id: smoke-marker
        run: echo "smoke_entered=true" >> "$GITHUB_OUTPUT"

      - name: Wait for health
        run: |
          sleep 10
          curl -s http://localhost:3032/api/health | jq '.'

      - name: Verify clients connected (warn-only)
        run: |
          # M5: backends reconnect on 1s→30s backoff — a 0 right after restart
          # is normal, and a key-mismatch 0 needs diagnosis, not a failed
          # deploy. Poll briefly, then warn (never fail) so this gate can
          # neither red a good deploy nor mask a real outage silently.
          CLIENTS=0
          for i in $(seq 1 12); do
            CLIENTS=$(curl -s --max-time 8 http://localhost:3032/api/health | jq -r '.clients.connected // 0')
            [ "$CLIENTS" -ge 1 ] && break
            sleep 10
          done
          if [ "$CLIENTS" -lt 1 ]; then
            echo "::warning::clients.connected=$CLIENTS after ~2min — investigate backend SSE (key? URL? backoff?)"
          else
            echo "✓ $CLIENTS client(s) connected"
          fi

      - name: Pin :prev on GOOD deploy (rollback contract for item 6)
        # C2: pins ONLY after Verify green — never pin an unverified image.
        # Contract (item 6 consumes it): :prev == last GOOD prod image,
        # :prev-1 == 2nd-previous. Retention = 2 releases. Best-effort pulls
        # so a first-run without prior tags cannot fail the deploy.
        # C1: strict :sha source — no :latest fallback.
        run: |
          set -euo pipefail
          for IMG in \
            ghcr.io/${{ github.repository }}-ingestion-telegram \
            ghcr.io/${{ github.repository }}-ingestion; do
            docker pull "$IMG:prev" 2>/dev/null && {
              docker tag "$IMG:prev" "$IMG:prev-1"
              docker push "$IMG:prev-1"
            } || echo "no prior :prev for $IMG (first run) — skipping :prev-1 rotation"
            docker tag "$IMG:${{ github.sha }}" "$IMG:prev"
            docker push "$IMG:prev"
            echo "pinned $IMG:prev"
          done

  # BAKE-WATCH (prod-safety-gates item 5) — 15-min post-deploy observation,
  # ingestion prod lane (:3032). Runs ONLY when smoke went green (deploy
  # success + smoke_entered); red smoke already fires auto-rollback (item 4).
  # A RED watch fires the SAME auto-rollback-production job (linkage: that job
  # lists this one in `needs:` and keys its `if:` on
  # `needs.watch-bake-ingestion-prod.result` — grep watch-bake-ingestion-prod).
  # Probes reuse smoke endpoints (read-only GET, no new infra, no app changes;
  # queue-stall reads the backend matching health cross-lane, read-only):
  #   THRESHOLD 5xx-rate: >5% of samples with HTTP>=500 (or unreachable=000) (%) → FAIL
  #   THRESHOLD queue-stall: queuePending>0 AND lastEnqueuedAt unchanged for >10 (min) → FAIL
  #   THRESHOLD SSE-disc: >2 non-200 SSE header probes over the window (count) → FAIL
  # Window: 15 iters x 60s sleep ~= 15 min probes (+probe time ~= 17 min worst
  # case < timeout below). Alerts: no dedicated channel exists (grep: no
  # slack/pagerduty/notify in workflows) → log + $GITHUB_STEP_SUMMARY reuse;
  # dedicated alert channel = follow-up (see task-5 evidence).
  watch-bake-ingestion-prod:
    name: Bake watch ingestion prod 15min (5xx/queue/SSE)
    runs-on: [self-hosted, oracle]
    needs: [deploy]
    if: success() && needs.deploy.outputs.smoke_entered == 'true'
    timeout-minutes: 20
    environment: production
    steps:
      - name: Bake probes (~15 min window, read-only)
        run: |
          set -uo pipefail # NOT -e: probe misses accumulate, verdict at the end
          BACKEND=http://localhost:3030
          INGESTION=http://localhost:3032
          ITERS=15 # iterations (count)
          SLEEP_S=60 # inter-iteration sleep (s) → window ~= 15 min
          # INLINE THRESHOLDS (units in names — item 5 acceptance):
          THR_5XX_PCT=5 # max 5xx-rate (%, bad samples / total samples x 100)
          THR_STALL_MIN=10 # max queue-stall (min): pending>0 + lastEnqueuedAt frozen
          THR_SSE_DISC=2 # max SSE disconnects (count of non-200 header probes)
          TOTAL=0; BAD5XX=0; DISC=0; STALL_ITERS=0; PREV_ENQ=""
          for i in $(seq 1 $ITERS); do
            for URL in "$INGESTION/api/health" "$INGESTION/api/feed/sources" "$BACKEND/crypto-news/matching/health"; do
              CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || echo 000)"
              TOTAL=$((TOTAL + 1))
              case "$CODE" in 000|5*) BAD5XX=$((BAD5XX + 1));; esac
            done
            # SSE header probe: the stream stays open indefinitely, so curl ALWAYS
            # exits 28 on --max-time AFTER printing the -w code. `|| true`
            # preserves curl's own code (200 healthy / 000 unreachable);
            # `|| echo 000` would concatenate into "200000" and count every
            # healthy probe as a disconnect (false-positive proven run 35963218317).
            SSE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 -H 'Accept: text/event-stream' "$INGESTION/api/ingestion/stream" 2>/dev/null || true)"
            [ "$SSE" = "200" ] || DISC=$((DISC + 1))
            MH="$(curl -s --max-time 10 "$BACKEND/crypto-news/matching/health" || true)"
            PEND="$(echo "$MH" | jq -r '.queuePending // 0' 2>/dev/null || echo 0)"
            ENQ="$(echo "$MH" | jq -r '.lastEnqueuedAt // empty' 2>/dev/null || true)"
            if [ "${PEND:-0}" != "0" ] && [ -n "${ENQ:-}" ] && [ "$ENQ" = "$PREV_ENQ" ]; then
              STALL_ITERS=$((STALL_ITERS + 1))
            else
              STALL_ITERS=0
            fi
            PREV_ENQ="$ENQ"
            echo "iter $i/$ITERS: bad5xx=$BAD5XX/$TOTAL sse_disc=$DISC stall_iters=$STALL_ITERS"
            [ "$i" -lt "$ITERS" ] && sleep "$SLEEP_S"
          done
          RATE=$((BAD5XX * 100 / TOTAL))
          STALL_MIN=$((STALL_ITERS * SLEEP_S / 60))
          FAILS=0
          [ "$RATE" -gt "$THR_5XX_PCT" ] && { echo "FAIL: 5xx-rate ${RATE}% > ${THR_5XX_PCT}%"; FAILS=$((FAILS + 1)); }
          [ "$STALL_MIN" -gt "$THR_STALL_MIN" ] && { echo "FAIL: queue-stall ${STALL_MIN}min > ${THR_STALL_MIN}min"; FAILS=$((FAILS + 1)); }
          [ "$DISC" -gt "$THR_SSE_DISC" ] && { echo "FAIL: SSE-disc ${DISC} > ${THR_SSE_DISC}"; FAILS=$((FAILS + 1)); }
          {
            echo "### Bake watch ingestion prod (15 min, :3032 lane)"
            echo ""
            echo "| probe | observado | umbral | resultado |"
            echo "|---|---|---|---|"
            echo "| 5xx-rate | ${RATE}% ($BAD5XX/$TOTAL) | <= ${THR_5XX_PCT}% | $([ "$RATE" -gt "$THR_5XX_PCT" ] && echo FAIL || echo PASS) |"
            echo "| queue-stall | ${STALL_MIN}min | <= ${THR_STALL_MIN}min | $([ "$STALL_MIN" -gt "$THR_STALL_MIN" ] && echo FAIL || echo PASS) |"
            echo "| SSE-disc | ${DISC} | <= ${THR_SSE_DISC} | $([ "$DISC" -gt "$THR_SSE_DISC" ] && echo FAIL || echo PASS) |"
            echo "| linkage | watch rojo → auto-rollback-production (item 4) | | |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$FAILS" -eq 0 ] || { echo "::error::bake watch ROJO ($FAILS probe(s)) — dispara auto-rollback (item 4)"; exit 1; }
          echo "bake watch VERDE"

  # Item 2 — staging twin lane (per-env-ingestion). Mirror of prod above with:
  # env staging, staging net, host :3033, staging DB, :staging-prev pinning.
  # Runs on manual dispatch with target=staging OR auto-follows master push
  # after prod lane succeeds (twin tracks prod code; skips when prod skipped/failed)
  # OR auto-follows dev push touching ingestion paths (twin tracks dev code like
  # staging backend does; no prod gate — prod lane never runs on dev).
  # Requires (operator, item 1): docker-compose.staging-ingestion.yml +
  # /opt/onchain-bot-staging ENVF + GitHub environment 'staging'.
  deploy-staging:
    name: Deploy staging twin to Oracle (:3033)
    runs-on: [self-hosted, oracle]
    needs: [build-and-push, deploy]
    # SKIP-TOLERANT GATE (item 9b drill finding, run 35827181430): a skipped
    # need auto-skips dependents UNLESS the if forces evaluation with a status
    # check fn. On staging-dispatch AND on dev push the prod `deploy` need is
    # SKIPPED by design — without always() this lane silently skipped (green
    # run, twin untouched). always() forces evaluation; the build-success
    # conjunct keeps the broken-build-does-not-deploy invariant (a failed
    # build never reaches pull/migrate), and the master leg keeps its
    # prod-green gate via needs.deploy.result.
    if: always() && needs.build-and-push.result == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.target == 'staging') || (github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.deploy.result == 'success') || (github.event_name == 'push' && github.ref == 'refs/heads/dev'))
    environment: staging # staging lane — pinned below, NEVER resolves prod env
    timeout-minutes: 30
    # T4 auto-rollback contract (twin mirror): smoke_entered gates the twin
    # auto-rollback job — only post-smoke-rojo, never pre-smoke red.
    outputs:
      smoke_entered: ${{ steps.smoke-marker.outputs.smoke_entered }}
    concurrency:
      group: ingestion-staging-target
      cancel-in-progress: false # single-flight: same triple never runs twice (AUTH_KEY_DUPLICATED)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Copy staging compose from checkout (staging path is rsync-managed, no .git)
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/apps/backend/docker-compose.staging-ingestion.yml"
          DST=/opt/onchain-bot-staging/apps/backend/docker-compose.staging-ingestion.yml
          [ -f "$SRC" ] || { echo "::error::compose source missing: $SRC (checkout at ${{ github.sha }})"; exit 1; }
          sudo install -o runner -g runner -m 644 "$SRC" "$DST"
          sudo chown runner:runner "$DST"
          test -f "$DST" || { echo "::error::compose copy failed: $DST absent after install"; exit 1; }
          grep -c 3033 "$DST"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix ownership before operations (chown -R runner:runner)
        run: |
          echo "=== chown -R runner:runner /opt/onchain-bot-staging ==="
          sudo chown -R runner:runner /opt/onchain-bot-staging || chown -R runner:runner /opt/onchain-bot-staging || echo 'chown warning (non-fatal)'
          echo "=== ownership fixed ==="

      - name: Ensure staging firewall + socat :3033 (BEFORE first healthcheck)
        # Order inside the lane: firewall/socat → deploy → smoke. This step
        # MUST stay before any :3033 healthcheck (item 2 checklist).
        run: |
          set -euo pipefail
          FW_PORT=3033
          FW_NET=onchain-bot-staging-net
          if docker network inspect "$FW_NET" >/dev/null 2>&1; then
            FW_SUBNETS="$(docker network inspect "$FW_NET" --format '{{range .IPAM.Config}}{{.Subnet}} {{end}}')"
            for FW_SUBNET in $FW_SUBNETS; do
              if iptables -C DOCKER-USER -s "$FW_SUBNET" -p tcp --dport "$FW_PORT" -j ACCEPT 2>/dev/null; then
                echo "DOCKER-USER ACCEPT $FW_SUBNET:$FW_PORT already exists"
              else
                REJECT_LINE="$(iptables -nL DOCKER-USER --line-numbers 2>/dev/null | awk '/REJECT/ {print $1; exit}' || true)"
                if [ -n "${REJECT_LINE:-}" ]; then
                  sudo iptables -I DOCKER-USER "$REJECT_LINE" -s "$FW_SUBNET" -p tcp --dport "$FW_PORT" -j ACCEPT
                else
                  sudo iptables -A DOCKER-USER -s "$FW_SUBNET" -p tcp --dport "$FW_PORT" -j ACCEPT
                fi
                echo "DOCKER-USER ACCEPT $FW_SUBNET:$FW_PORT added"
              fi
            done
          else
            echo "::warning::staging net $FW_NET absent (item 1 creates it) — firewall step skipped, healthcheck will fail fast"
          fi
          if (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep -q ':3033 '; then
            echo "listener :3033 present (socat unit or twin container)"
          else
            echo "::warning::nothing listening on :3033 yet — expected pre-first-deploy; socat unit from install-socat-services.sh staging covers Tailscale ingress"
          fi

      - name: Pull deploy image (strict :sha, fail loudly on miss)
        # C1: twin pulls strictly :<sha> — no :latest fallback.
        run: |
          docker pull ghcr.io/${{ github.repository }}-ingestion-telegram:${{ github.sha }}
          docker pull ghcr.io/${{ github.repository }}-ingestion:${{ github.sha }}

      - name: Backup staging ingestion database (BEFORE migrate)
        # Checklist order: backup BEFORE migrate. DB is created by the first
        # migrate (documented); pg_dump against a missing DB fails the job fast.
        run: |
          set -euo pipefail
          # ENVF pinned per job — no legacy fallback: this lane must NEVER
          # resolve prod env (item 2 acceptance).
          ENVF=/opt/onchain-bot-staging/apps/ingestion-telegram/.env.staging
          [ -f "$ENVF" ] || { echo "::error::staging ENVF missing: $ENVF (operator: create from .env.staging.template, item 1)"; exit 1; }
          set -a; source "$ENVF"; set +a
          mkdir -p /data/backups/ingestion-staging
          POSTGRES_CONTAINER=onchain-bot-postgres-staging \
          POSTGRES_USER="${INGESTION_DATABASE_USER:-alpha_meta_token_scanner}" \
          POSTGRES_DB="${INGESTION_DATABASE_NAME:-alpha_meta_token_scanner_staging_ingestion}" \
          POSTGRES_PASSWORD="${INGESTION_DATABASE_PASSWORD:-${POSTGRES_PASSWORD:-}}" \
          bash /opt/onchain-bot/scripts/backup-db.sh || {
            PG_FB="$(docker ps --format '{{.Names}}' | grep -E '^(onchain-bot-postgres-staging|onchain-bot-staging-postgres)$' | head -n 1)"
            docker exec -e PGPASSWORD="${INGESTION_DATABASE_PASSWORD:-${POSTGRES_PASSWORD:-}}" \
              "$PG_FB" pg_dump -U "${INGESTION_DATABASE_USER:-alpha_meta_token_scanner}" \
              -d "${INGESTION_DATABASE_NAME:-alpha_meta_token_scanner_staging_ingestion}" \
              --format=custom --no-owner --no-acl \
              > /data/backups/ingestion-staging/ingestion-staging-backup-$(date +%Y%m%d-%H%M%S).dump
          }
          find /data/backups/ingestion-staging -maxdepth 1 -name 'ingestion-staging-backup-*.dump' -mtime +7 -delete 2>/dev/null || true

      - name: Run staging ingestion migrations (abort deploy on failure)
        run: |
          set -euo pipefail
          ENVF=/opt/onchain-bot-staging/apps/ingestion-telegram/.env.staging
          [ -f "$ENVF" ] || { echo "::error::staging ENVF missing: $ENVF"; exit 1; }
          set -a; source "$ENVF"; set +a
          echo "=== Running staging ingestion TypeORM migrations ==="
          docker run --rm --network onchain-bot-staging-net \
            --env-file "$ENVF" \
            ghcr.io/${{ github.repository }}-ingestion-telegram:${{ github.sha }} \
            npx typeorm --dataSource apps/ingestion-telegram/dist/src/shared/common/persistence/data-source.js migration:run \
            || docker compose -f /opt/onchain-bot-staging/apps/backend/docker-compose.staging-ingestion.yml run --rm ingestion-telegram-staging \
                npx typeorm --dataSource apps/ingestion-telegram/dist/src/shared/common/persistence/data-source.js migration:run
          echo "=== Staging ingestion migrations applied successfully ==="

      - name: Restart staging ingestion twin
        # C1: no `compose pull` (compose pins :latest) — retag verified :sha
        # to :latest locally, then recreate without pulling.
        run: |
          set -euo pipefail
          ENVF=/opt/onchain-bot-staging/apps/ingestion-telegram/.env.staging
          [ -f "$ENVF" ] || { echo "::error::staging ENVF missing: $ENVF"; exit 1; }
          set -a; source "$ENVF"; set +a
          IMG_BASE=ghcr.io/${{ github.repository }}-ingestion-telegram
          docker tag "$IMG_BASE:${{ github.sha }}" "$IMG_BASE:latest"
          cd /opt/onchain-bot-staging/apps/backend
          docker compose -f docker-compose.staging-ingestion.yml up -d --force-recreate

      - name: Mark smoke entered (T4 auto-rollback gate signal)
        id: smoke-marker
        run: echo "smoke_entered=true" >> "$GITHUB_OUTPUT"

      - name: Wait for health (:3033)
        run: |
          sleep 10
          curl -s http://localhost:3033/api/health | jq '.'

      - name: Smoke staging twin (sources-count explicit-empty-OK + versioned SSE probe)
        run: |
          set -euo pipefail
          # Sources-count: twin starts EMPTY by design — [] is explicit-empty-OK,
          # N>0 is populated-OK. A non-array/5xx is FAIL (no false-green).
          SOURCES_BODY="$(curl -sf --max-time 10 http://localhost:3033/api/feed/sources)"
          if echo "$SOURCES_BODY" | jq -e 'type == "array"' >/dev/null; then
            COUNT="$(echo "$SOURCES_BODY" | jq 'length')"
            if [ "$COUNT" -eq 0 ]; then
              echo "PASS: sources explicit-empty-OK (twin starts EMPTY by design, no seed)"
            else
              echo "PASS: sources N=$COUNT"
            fi
          else
            echo "::error::sources endpoint did not return an array"
            exit 1
          fi
          # SSE probe, versioned per gate (item 4 deletes gate+backendId):
          # pre-T4 world → 400/401 without backendId means the gate is alive;
          # post-T4 world → 200 headers means open stream. Both PASS, each only
          # under its gate condition; anything else FAILs.
          SSE_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 \
            -H 'Accept: text/event-stream' http://localhost:3033/api/ingestion/stream || true)"
          if [ "$SSE_CODE" = "200" ]; then
            echo "PASS: SSE stream headers 200 (post-T4 open stream)"
          elif [ "$SSE_CODE" = "400" ] || [ "$SSE_CODE" = "401" ]; then
            echo "PASS: SSE gate present ($SSE_CODE without backendId — pre-T4 world, remove after item 4)"
          else
            echo "::error::SSE probe unexpected http=$SSE_CODE (want 200 post-T4 or 400/401 pre-T4)"
            exit 1
          fi

      - name: Verify staging twin serving (clients informational)
        run: |
          CLIENTS=$(curl -s http://localhost:3033/api/health | jq -r '.clients.connected // 0')
          echo "staging twin clients.connected=$CLIENTS (informational — twin may idle at 0, no traffic required)"

      - name: Pin :staging-prev on GOOD deploy (staging rollback pin)
        # Staging pins lane-scoped tags (:staging-prev/:staging-prev-1), NOT
        # shared :prev — same image repo serves prod, and a staging-only-tested
        # sha must never become prod's rollback target. Item 6 drills against
        # the twin with :staging-prev; prod rollback consumes :prev.
        run: |
          set -euo pipefail
          for IMG in \
            ghcr.io/${{ github.repository }}-ingestion-telegram \
            ghcr.io/${{ github.repository }}-ingestion; do
            docker pull "$IMG:staging-prev" 2>/dev/null && {
              docker tag "$IMG:staging-prev" "$IMG:staging-prev-1"
              docker push "$IMG:staging-prev-1"
            } || echo "no prior :staging-prev for $IMG (first run) — skipping rotation"
            docker tag "$IMG:${{ github.sha }}" "$IMG:staging-prev"
            docker push "$IMG:staging-prev"
            echo "pinned $IMG:staging-prev"
          done

  # AUTO-ROLLBACK (prod-safety-gates item 4, ingestion lanes) — fires ONLY on
  # post-smoke-rojo (deploy job FAILED + smoke entered). Inline reuse of the
  # rollback-lane mechanics (same :prev/:staging-prev pins, stop → verify →
  # start, no pull in rollback, health + SSE + AUTH asserts): dispatching a NEW
  # run would deadlock on the shared concurrency groups (new run queues behind
  # this one, which waits for it). Dispatch lanes below stay manual-only.
  # Budget: <60s per lane. Timeout caps each job, never holds runner.
  auto-rollback-production:
    name: Auto-rollback prod ingestion on smoke failure (:prev)
    runs-on: [self-hosted, oracle]
    # T5 bake linkage: fires on smoke-rojo (deploy failed, watch skipped) OR
    # bake-rojo (deploy green, watch failed). needs.watch result is 'skipped'
    # on the smoke-red leg, 'failure' on the bake-red leg.
    needs: [deploy, watch-bake-ingestion-prod]
    if: failure() && needs.deploy.outputs.smoke_entered == 'true' && (needs.deploy.result == 'failure' || needs.watch-bake-ingestion-prod.result == 'failure')
    environment: production
    timeout-minutes: 10
    # C5: job-level single-flight on the prod target (same group as deploy +
    # manual prod rollback; build/preflight jobs unguarded).
    concurrency:
      group: ingestion-production-target
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record auto-rollback decision
        run: |
          {
            echo "### Auto-rollback prod ingestion (smoke rojo → :prev → :3032)"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| trigger | post-deploy smoke FAILED (deploy red) OR bake-watch FAILED (watch red, deploy green) — smoke entered |"
            echo "| target | ingestion-telegram:prev → :3032 |"
            echo "| manual escape | dispatch target=rollback-production intacto |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pull rollback target :prev (read-only, no retag yet)
        run: |
          set -euo pipefail
          echo "ROLLBACK_T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/auto-ingestion-rollback-t0
          for IMG in \
            ghcr.io/${{ github.repository }}-ingestion-telegram \
            ghcr.io/${{ github.repository }}-ingestion; do
            docker pull "$IMG:prev" || { echo "::error::no $IMG:prev pinned — auto-rollback inexecutable → ESCALATE (second level, see failure step)"; exit 1; }
          done

      - name: Stop prod ingestion (single-flight, --timeout 30)
        run: |
          set -euo pipefail
          # ENVF sourcing (mirrors the deploy restart step): compose
          # interpolates ${REDIS_PASSWORD:?required} from host env — without
          # this the stop dies pre-action (proven run 35963218317) and the
          # watch-to-rollback linkage is dead on arrival.
          ENVF=/opt/onchain-bot/apps/ingestion-telegram/.env.production; [ -f "$ENVF" ] || ENVF=/opt/onchain-bot/apps/ingestion-service/.env.production; set -a; source "$ENVF"; set +a
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a
          cd /opt/onchain-bot/apps/backend
          docker compose -f docker-compose.ingestion.yml stop --timeout 30 ingestion-telegram
          if docker ps --format '{{.Names}}' | grep -i ingestion; then
            echo "::error::REFUSE: ingestion container still running — starting a second one would AUTH_KEY_DUPLICATED the session"
            exit 1
          fi
          echo "OK: world empty — safe to start exactly one container"

      - name: Recreate from :prev (no pull — local retag wins)
        run: |
          set -euo pipefail
          # Same ENVF sourcing as the stop step above: `up` interpolates the
          # compose file too, so it needs the host env as well.
          ENVF=/opt/onchain-bot/apps/ingestion-telegram/.env.production; [ -f "$ENVF" ] || ENVF=/opt/onchain-bot/apps/ingestion-service/.env.production; set -a; source "$ENVF"; set +a
          set -a; source /opt/onchain-bot/apps/backend/.env.production; set +a
          IMG_BASE=ghcr.io/${{ github.repository }}-ingestion-telegram
          docker tag "$IMG_BASE:prev" "$IMG_BASE:latest"
          cd /opt/onchain-bot/apps/backend
          docker compose -f docker-compose.ingestion.yml up -d --force-recreate

      - name: Healthcheck gate (:3032) + SSE + AUTH asserts + downtime measured
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -sf --max-time 8 http://localhost:3032/api/health >/dev/null 2>&1; then
              echo "healthy after ~$((i * 5))s"
              break
            fi
            [ "$i" -eq 12 ] && { echo "::error::healthcheck failed after auto-rollback — ESCALATE (second level, see failure step)"; exit 1; }
            sleep 5
          done
          curl -s http://localhost:3032/api/health | jq '.'
          SSE_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 \
            -H 'Accept: text/event-stream' http://localhost:3032/api/ingestion/stream || true)"
          [ "$SSE_CODE" = "200" ] || { echo "::error::SSE probe http=$SSE_CODE (want 200 post-T4 open stream)"; exit 1; }
          echo "PASS: SSE stream headers 200"
          if docker logs onchain-bot-ingestion-telegram --since 10m 2>/dev/null | grep -qi 'AUTH_KEY_DUPLICATED'; then
            echo "::error::AUTH_KEY_DUPLICATED in logs — recovery is interactive-only (runbook §AUTH_KEY_DUPLICATED)"
            exit 1
          fi
          echo "ROLLBACK_T1=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/auto-ingestion-rollback-t1
          echo "downtime window: $(cat /tmp/auto-ingestion-rollback-t0) → $(cat /tmp/auto-ingestion-rollback-t1) (SSE clients reconnect 1s→30s backoff, expected seconds)"
          {
            echo "### Auto-rollback prod ingestion OK"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| target | ingestion-telegram:prev → :3032 |"
            echo "| ventana | $(cat /tmp/auto-ingestion-rollback-t0) → $(cat /tmp/auto-ingestion-rollback-t1) |"
            echo "| asserts | health + SSE 200 + no AUTH_KEY_DUPLICATED |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Second-level escalation (auto-rollback FAILED)
        if: failure()
        run: |
          {
            echo "### ESCALATION segundo nivel — auto-rollback prod ingestion FALLIDO"
            echo ""
            echo "1. CONGELAR lanes: no re-disparar rollback (sin re-loops — :prev ya está vivo o ausente). Lock manual: avisar al operador ANTES de cualquier dispatch/retry."
            echo "2. AVISAR operador con ventana de downtime: $(cat /tmp/auto-ingestion-rollback-t0 2>/dev/null || echo T0-desconocido) → $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo "3. DUMP pre-deploy: artifact /data/backups/ingestion/ingestion-backup-*.dump de los logs del job deploy — adjuntar filename al incident record."
            echo "4. INVALIDAR pin envenenado: si :prev también está rojo, no reintentarlo — forward-fix (nuevo sha)."
            echo "5. Si hay AUTH_KEY_DUPLICATED: recovery INTERACTIVA-only (runbook §AUTH_KEY_DUPLICATED) — parar TODO, una sola sesión, re-gen interactivo si Telegram deslogueó."
            echo "6. DB restore = decisión HUMANA explícita (jamás automática, jamás segundo rollback en loop): restore del dump → start → health + SSE + AUTH asserts."
            echo "7. Presupuesto: rollback <60s por lane; sin verde en 2 ventanas de healthcheck → forward-fix-or-restore."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::ESCALATION segundo nivel: auto-rollback prod ingestion fallido — lanes congelados, operador requerido (ver summary)"

  auto-rollback-staging:
    name: Auto-rollback staging twin on smoke failure (:staging-prev)
    runs-on: [self-hosted, oracle]
    needs: [deploy-staging]
    if: failure() && needs.deploy-staging.outputs.smoke_entered == 'true'
    environment: staging
    timeout-minutes: 10
    concurrency:
      group: ingestion-staging-target
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record auto-rollback decision
        run: |
          {
            echo "### Auto-rollback staging twin (smoke rojo → :staging-prev → :3033)"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| trigger | post-deploy smoke FAILED (deploy-staging red, smoke entered) |"
            echo "| target | ingestion-telegram:staging-prev → :3033 |"
            echo "| manual escape | dispatch target=rollback-staging intacto |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pull rollback target :staging-prev (read-only, no retag yet)
        run: |
          set -euo pipefail
          echo "ROLLBACK_T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/auto-ingestion-rollback-staging-t0
          ENVF=/opt/onchain-bot-staging/apps/ingestion-telegram/.env.staging
          [ -f "$ENVF" ] || { echo "::error::staging ENVF missing: $ENVF"; exit 1; }
          for IMG in \
            ghcr.io/${{ github.repository }}-ingestion-telegram \
            ghcr.io/${{ github.repository }}-ingestion; do
            docker pull "$IMG:staging-prev" || { echo "::error::no $IMG:staging-prev pinned — auto-rollback inexecutable → ESCALATE (second level, see failure step)"; exit 1; }
          done

      - name: Stop staging twin (single-flight, --timeout 30)
        run: |
          set -euo pipefail
          cd /opt/onchain-bot-staging/apps/backend
          docker compose -f docker-compose.staging-ingestion.yml stop --timeout 30 ingestion-telegram-staging
          if docker ps --format '{{.Names}}' | grep -i ingestion-telegram-staging; then
            echo "::error::REFUSE: twin still running — starting a second one would AUTH_KEY_DUPLICATED the staging triple"
            exit 1
          fi
          echo "OK: twin stopped — safe to start exactly one container"

      - name: Recreate twin from :staging-prev (no pull — local retag wins)
        run: |
          set -euo pipefail
          IMG_BASE=ghcr.io/${{ github.repository }}-ingestion-telegram
          docker tag "$IMG_BASE:staging-prev" "$IMG_BASE:latest"
          cd /opt/onchain-bot-staging/apps/backend
          docker compose -f docker-compose.staging-ingestion.yml up -d --force-recreate

      - name: Healthcheck gate (:3033) + SSE + AUTH asserts + downtime measured
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -sf --max-time 8 http://localhost:3033/api/health >/dev/null 2>&1; then
              echo "twin healthy after ~$((i * 5))s"
              break
            fi
            [ "$i" -eq 12 ] && { echo "::error::twin healthcheck failed after auto-rollback — ESCALATE (second level, see failure step)"; exit 1; }
            sleep 5
          done
          curl -s http://localhost:3033/api/health | jq '.'
          SSE_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 \
            -H 'Accept: text/event-stream' http://localhost:3033/api/ingestion/stream || true)"
          [ "$SSE_CODE" = "200" ] || { echo "::error::twin SSE probe http=$SSE_CODE (want 200 post-T4 open stream)"; exit 1; }
          echo "PASS: twin SSE stream headers 200"
          if docker logs onchain-bot-ingestion-telegram-staging --since 10m 2>/dev/null | grep -qi 'AUTH_KEY_DUPLICATED'; then
            echo "::error::AUTH_KEY_DUPLICATED in twin logs — recovery is interactive-only (runbook §AUTH_KEY_DUPLICATED)"
            exit 1
          fi
          echo "ROLLBACK_T1=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/auto-ingestion-rollback-staging-t1
          echo "downtime window: $(cat /tmp/auto-ingestion-rollback-staging-t0) → $(cat /tmp/auto-ingestion-rollback-staging-t1) (SSE clients reconnect 1s→30s backoff, expected seconds)"
          {
            echo "### Auto-rollback staging twin OK"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| target | ingestion-telegram:staging-prev → :3033 |"
            echo "| ventana | $(cat /tmp/auto-ingestion-rollback-staging-t0) → $(cat /tmp/auto-ingestion-rollback-staging-t1) |"
            echo "| asserts | health + SSE 200 + no AUTH_KEY_DUPLICATED |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Second-level escalation (auto-rollback FAILED)
        if: failure()
        run: |
          {
            echo "### ESCALATION segundo nivel — auto-rollback staging twin FALLIDO"
            echo ""
            echo "1. CONGELAR lanes: no re-disparar rollback (sin re-loops). Lock manual: avisar al operador ANTES de cualquier dispatch/retry."
            echo "2. AVISAR operador con ventana de downtime: $(cat /tmp/auto-ingestion-rollback-staging-t0 2>/dev/null || echo T0-desconocido) → $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo "3. DUMP pre-deploy: artifact /data/backups/ingestion-staging/ingestion-staging-backup-*.dump — adjuntar filename al incident record."
            echo "4. INVALIDAR pin envenenado: si :staging-prev también está rojo, no reintentarlo — forward-fix (nuevo sha)."
            echo "5. Si hay AUTH_KEY_DUPLICATED: recovery INTERACTIVA-only (runbook §AUTH_KEY_DUPLICATED)."
            echo "6. DB restore = decisión HUMANA explícita (jamás automática, jamás segundo rollback en loop)."
            echo "7. Presupuesto: rollback <60s por lane; sin verde en 2 ventanas de healthcheck → forward-fix-or-restore."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::ESCALATION segundo nivel: auto-rollback staging twin fallido — lanes congelados, operador requerido (ver summary)"

  # Item 6 — rollback lanes (per-env-ingestion). Manual dispatch ONLY, never on
  # push. Single-flight: prod rollback shares the top-level
  # `ingestion-production-target` group (serializes against prod deploys);
  # staging rollback shares `ingestion-staging-target` (serializes against
  # twin deploys). Same MTProto
  # triple NEVER runs twice at once — two live containers with one session
  # cause AUTH_KEY_DUPLICATED and log the session out. Discipline in every
  # step: stop → verify stopped (gate) → start. `docker compose pull` is
  # FORBIDDEN inside rollback (it would re-fetch the broken :latest).
  rollback-production:
    name: Rollback prod ingestion to :prev (:3032)
    runs-on: [self-hosted, oracle]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'rollback-production'
    environment: production
    timeout-minutes: 15
    concurrency:
      group: ingestion-production-target
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix ownership before operations (chown -R runner:runner)
        run: |
          echo "=== chown -R runner:runner /opt/onchain-bot ==="
          sudo chown -R runner:runner /opt/onchain-bot || chown -R runner:runner /opt/onchain-bot || echo 'chown warning (non-fatal)'
          echo "=== ownership fixed ==="

      - name: Pull rollback target :prev (read-only, no retag yet)
        run: |
          set -euo pipefail
          echo "ROLLBACK_T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/ingestion-rollback-t0
          for IMG in \
            ghcr.io/${{ github.repository }}-ingestion-telegram \
            ghcr.io/${{ github.repository }}-ingestion; do
            docker pull "$IMG:prev" || { echo "::error::no $IMG:prev pinned (item 2 pins on GOOD deploys only) — rollback inexecutable, deploy instead"; exit 1; }
          done

      - name: Stop prod ingestion (single-flight, --timeout 30)
        run: |
          set -euo pipefail
          cd /opt/onchain-bot/apps/backend
          docker compose -f docker-compose.ingestion.yml stop --timeout 30 ingestion-telegram
          if docker ps --format '{{.Names}}' | grep -i ingestion; then
            echo "::error::REFUSE: ingestion container still running — starting a second one would AUTH_KEY_DUPLICATED the session"
            exit 1
          fi
          echo "OK: world empty — safe to start exactly one container"

      - name: Recreate from :prev (no pull — local retag wins)
        run: |
          set -euo pipefail
          IMG_BASE=ghcr.io/${{ github.repository }}-ingestion-telegram
          docker tag "$IMG_BASE:prev" "$IMG_BASE:latest"
          cd /opt/onchain-bot/apps/backend
          docker compose -f docker-compose.ingestion.yml up -d --force-recreate

      - name: Healthcheck gate (:3032) + downtime measured
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -sf --max-time 8 http://localhost:3032/api/health >/dev/null 2>&1; then
              echo "healthy after ~$((i * 5))s"
              break
            fi
            [ "$i" -eq 12 ] && { echo "::error::healthcheck failed after rollback — see runbook docs/deployment/ingestion-rollback.md (retry + escalate, never blind re-run)"; exit 1; }
            sleep 5
          done
          curl -s http://localhost:3032/api/health | jq '.'
          SSE_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 \
            -H 'Accept: text/event-stream' http://localhost:3032/api/ingestion/stream || true)"
          [ "$SSE_CODE" = "200" ] || { echo "::error::SSE probe http=$SSE_CODE (want 200 post-T4 open stream)"; exit 1; }
          echo "PASS: SSE stream headers 200"
          if docker logs onchain-bot-ingestion-telegram --since 10m 2>/dev/null | grep -qi 'AUTH_KEY_DUPLICATED'; then
            echo "::error::AUTH_KEY_DUPLICATED in logs — a second session is/was alive; recovery is interactive-only (runbook §AUTH_KEY_DUPLICATED)"
            exit 1
          fi
          echo "ROLLBACK_T1=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/ingestion-rollback-t1
          echo "downtime window: $(cat /tmp/ingestion-rollback-t0) → $(cat /tmp/ingestion-rollback-t1) (SSE clients reconnect 1s→30s backoff, expected seconds)"

  rollback-staging:
    name: Rollback staging twin to :staging-prev (:3033)
    runs-on: [self-hosted, oracle]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'rollback-staging'
    environment: staging
    timeout-minutes: 15
    concurrency:
      group: ingestion-staging-target
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix ownership before operations (chown -R runner:runner)
        run: |
          echo "=== chown -R runner:runner /opt/onchain-bot-staging ==="
          sudo chown -R runner:runner /opt/onchain-bot-staging || chown -R runner:runner /opt/onchain-bot-staging || echo 'chown warning (non-fatal)'
          echo "=== ownership fixed ==="

      - name: Pull rollback target :staging-prev (read-only, no retag yet)
        run: |
          set -euo pipefail
          echo "ROLLBACK_T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/ingestion-rollback-staging-t0
          ENVF=/opt/onchain-bot-staging/apps/ingestion-telegram/.env.staging
          [ -f "$ENVF" ] || { echo "::error::staging ENVF missing: $ENVF"; exit 1; }
          for IMG in \
            ghcr.io/${{ github.repository }}-ingestion-telegram \
            ghcr.io/${{ github.repository }}-ingestion; do
            docker pull "$IMG:staging-prev" || { echo "::error::no $IMG:staging-prev pinned — rollback inexecutable, deploy staging instead"; exit 1; }
          done

      - name: Stop staging twin (single-flight, --timeout 30)
        run: |
          set -euo pipefail
          cd /opt/onchain-bot-staging/apps/backend
          docker compose -f docker-compose.staging-ingestion.yml stop --timeout 30 ingestion-telegram-staging
          if docker ps --format '{{.Names}}' | grep -i ingestion-telegram-staging; then
            echo "::error::REFUSE: twin still running — starting a second one would AUTH_KEY_DUPLICATED the staging triple"
            exit 1
          fi
          echo "OK: twin stopped — safe to start exactly one container"

      - name: Recreate twin from :staging-prev (no pull — local retag wins)
        run: |
          set -euo pipefail
          IMG_BASE=ghcr.io/${{ github.repository }}-ingestion-telegram
          docker tag "$IMG_BASE:staging-prev" "$IMG_BASE:latest"
          cd /opt/onchain-bot-staging/apps/backend
          docker compose -f docker-compose.staging-ingestion.yml up -d --force-recreate

      - name: Healthcheck gate (:3033) + downtime measured
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl -sf --max-time 8 http://localhost:3033/api/health >/dev/null 2>&1; then
              echo "twin healthy after ~$((i * 5))s"
              break
            fi
            [ "$i" -eq 12 ] && { echo "::error::twin healthcheck failed after rollback — see runbook docs/deployment/ingestion-rollback.md (retry + escalate, never blind re-run)"; exit 1; }
            sleep 5
          done
          curl -s http://localhost:3033/api/health | jq '.'
          SSE_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 \
            -H 'Accept: text/event-stream' http://localhost:3033/api/ingestion/stream || true)"
          [ "$SSE_CODE" = "200" ] || { echo "::error::twin SSE probe http=$SSE_CODE (want 200 post-T4 open stream)"; exit 1; }
          echo "PASS: twin SSE stream headers 200"
          if docker logs onchain-bot-ingestion-telegram-staging --since 10m 2>/dev/null | grep -qi 'AUTH_KEY_DUPLICATED'; then
            echo "::error::AUTH_KEY_DUPLICATED in twin logs — recovery is interactive-only (runbook §AUTH_KEY_DUPLICATED)"
            exit 1
          fi
          echo "ROLLBACK_T1=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee /tmp/ingestion-rollback-staging-t1
          echo "downtime window: $(cat /tmp/ingestion-rollback-staging-t0) → $(cat /tmp/ingestion-rollback-staging-t1) (SSE clients reconnect 1s→30s backoff, expected seconds)"
