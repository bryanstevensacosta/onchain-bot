name: Sync dev with master

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-dev:
    runs-on: ubuntu-latest
    if: github.repository == 'bryanstevensacosta/onchain-bot'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge master into dev
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master dev
          git checkout dev
          # Ensure dev is up to date before merging
          git pull --ff-only origin dev || true
          if git merge-base --is-ancestor origin/master HEAD; then
            echo "✅ dev already contains master, nothing to do"
            exit 0
          fi
          echo "Merging origin/master into dev..."
          git merge origin/master --no-edit
          git push origin dev
          echo "✅ dev synced with master"
