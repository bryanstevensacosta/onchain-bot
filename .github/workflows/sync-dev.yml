# NOTE: this file intentionally does NOT auto-sync master -> dev.
# History: two bot sync mechanisms existed (PR auto-merge + rebase force-push).
# The force-push variant was dead code (branch protection denies it); the PR
# variant never completed unattended (bot-PR checks never go green on their
# own, so it either left red noise or stalled open). Verified 2026-09-14:
# 15/15 bot syncs landed only via blind merge or manual merge.
# Policy: sync master -> dev MANUALLY after each merge to master
# (`git checkout dev && git merge origin/master`), ~1 min, zero noise.
name: Update PRs on master push

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: update-prs
  cancel-in-progress: false

permissions:
  contents: write # required: gh pr update-branch pushes base into open PR branches
  pull-requests: write

jobs:
  update-open-prs:
    runs-on: ubuntu-latest
    if: github.repository == 'bryanstevensacosta/onchain-bot'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update open PRs (dev -> master)
        run: |
          echo "Updating open PRs that target master..."
          gh pr list --base master --state open --json number --jq '.[].number' | xargs -I{} sh -c 'echo "Updating PR #{}..."; gh pr update-branch {} || echo "PR #{} already up-to-date"'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
