name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_ENABLED: true
      DATABASE_SYNCHRONIZE: true
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onchain_bot
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache onnxruntime
        uses: actions/cache@v4
        with:
          path: ~/.cache/onnxruntime
          key: ${{ runner.os }}-onnxruntime-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-onnxruntime-

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci --no-audit --no-fund --prefer-offline

      - name: Run backend tests
        run: npm run test:backend
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_NAME: onchain_bot

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Create ingestion-service test databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE onchain_bot_test;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE onchain_bot_test_entity;"

      - name: Run ingestion-service tests
        run: npm run test:ingestion
        env:
          INGESTION_DATABASE_HOST: localhost
          INGESTION_DATABASE_PORT: 5432
          INGESTION_DATABASE_USER: postgres
          INGESTION_DATABASE_PASSWORD: postgres
          INGESTION_DATABASE_NAME: onchain_bot_test
          INGESTION_REDIS_HOST: localhost
          INGESTION_REDIS_PORT: 6379
          DATABASE_ENABLED: true

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache onnxruntime
        uses: actions/cache@v4
        with:
          path: ~/.cache/onnxruntime
          key: ${{ runner.os }}-onnxruntime-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-onnxruntime-

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci --no-audit --no-fund --prefer-offline

      - name: Run lint
        run: npm run lint

  typescript-check:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache onnxruntime
        uses: actions/cache@v4
        with:
          path: ~/.cache/onnxruntime
          key: ${{ runner.os }}-onnxruntime-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-onnxruntime-

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci --no-audit --no-fund --prefer-offline

      - name: Build (type-checks all apps)
        run: npm run build

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [tests, lint, typescript-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache onnxruntime
        uses: actions/cache@v4
        with:
          path: ~/.cache/onnxruntime
          key: ${{ runner.os }}-onnxruntime-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-onnxruntime-

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npm ci --no-audit --no-fund --prefer-offline

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build:frontend

      - name: Build ingestion-service
        run: npm run build -w @alpha-meta-token-scanner/ingestion-service

      - name: Upload backend dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist
          retention-days: 7

      - name: Upload frontend dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist
          retention-days: 7

      - name: Upload ingestion-service dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ingestion-service-dist
          path: apps/ingestion-service/dist
          retention-days: 7
