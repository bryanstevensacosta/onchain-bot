name: Full Prune
on: workflow_dispatch
jobs:
  prune:
    runs-on: self-hosted
    steps:
      - run: |
          echo "=== Before ==="
          df -h | head -5
          docker system df
          echo "=== Full prune (no filter) ==="
          docker system prune -af 2>&1 | tail -20
          docker builder prune -af 2>&1 | tail -10
          docker image prune -af 2>&1 | tail -10
          echo "=== After ==="
          df -h | head -5
          docker system df
