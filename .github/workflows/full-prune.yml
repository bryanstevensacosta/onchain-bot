name: Full Prune
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm destructive prune (must be true)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: oracle-maintenance
  cancel-in-progress: false
jobs:
  prune:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 15
    steps:
      - name: Assert Oracle host
        run: |
          hostname
          df -P /opt/onchain-bot
      - name: Confirm gate
        run: |
          if [ "${{ inputs.confirm }}" != "true" ]; then
            echo "Prune not confirmed (confirm=false) — exiting."
            exit 1
          fi
      - run: |
          echo "=== Before ==="
          df -h | head -5
          docker system df
          echo "=== Scoped image prune (until=168h, volumes untouched) ==="
          docker image prune -af --filter "until=168h" 2>&1 | tail -20
          docker builder prune -af --filter "until=168h" 2>&1 | tail -10
          echo "=== After ==="
          df -h | head -5
          docker system df
