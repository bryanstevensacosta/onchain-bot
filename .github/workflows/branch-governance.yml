name: Branch Governance

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-check:
    name: Branch Governance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para git history, merge-base, reflog

      - name: Setup git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git remote set-url origin https://github.com/${{ github.repository }}.git

      - name: Fetch all branches and tags
        run: git fetch --all --prune --tags

      # Asegurar refs explícitas para evitar "fatal: ambiguous argument 'master..dev'"
      # en eventos pull_request donde GITHUB_REF apunta al merge commit.
      - name: Ensure master/dev remote refs are present
        run: |
          set +e
          git fetch origin master:refs/remotes/origin/master 2>/dev/null
          git fetch origin dev:refs/remotes/origin/dev 2>/dev/null
          git branch --track master origin/master 2>/dev/null
          git branch --track dev origin/dev 2>/dev/null
          # Fallback: si el ref remoto no existe (p.ej. repo recién creado),
          # crear refs locales apuntando al SHA recibido para que los diffs no fallen.
          git rev-parse --verify origin/master >/dev/null 2>&1 || \
            git update-ref refs/remotes/origin/master $(git rev-parse HEAD) || true
          git rev-parse --verify origin/dev >/dev/null 2>&1 || \
            git update-ref refs/remotes/origin/dev $(git rev-parse HEAD) || true
          echo "--- branches present ---"
          git branch -a | head -50
          exit 0

      # ──────────────────────────────────────────────────────────────
      # Regla 1: Solo deben existir master y dev como ramas remotas
      # ──────────────────────────────────────────────────────────────
      - name: Check remote branches (only master and dev allowed)
        id: check-remote-branches
        run: |
          EXTRA_BRANCHES=$(git ls-remote --heads origin | grep -vE "refs/heads/(master|dev)$" | wc -l)
          echo "extra_branches=$EXTRA_BRANCHES" >> $GITHUB_OUTPUT
          if [ "$EXTRA_BRANCHES" -gt 0 ]; then
            echo "::error::Ramas remotas adicionales detectadas (solo master y dev permitidas):"
            git ls-remote --heads origin | grep -vE "refs/heads/(master|dev)$" | sed 's/.*refs\/heads\//  - /'
            exit 1
          fi
          echo "✅ Solo master y dev existen en remoto"

      # ──────────────────────────────────────────────────────────────
      # Regla 2: Contenido de master ⊆ contenido de dev (diff master..dev vacío)
      # ──────────────────────────────────────────────────────────────
      - name: Check master content is subset of dev (content equality)
        id: check-content-equality
        run: |
          set +e
          MASTER_REF="origin/master"
          DEV_REF="origin/dev"
          git rev-parse --verify "$MASTER_REF" >/dev/null 2>&1 || MASTER_REF="HEAD"
          git rev-parse --verify "$DEV_REF" >/dev/null 2>&1 || DEV_REF="HEAD"
          if git merge-base --is-ancestor "$MASTER_REF" "$DEV_REF" 2>/dev/null; then
            echo "content_equality=YES" >> $GITHUB_OUTPUT
            echo "✅ Contenido de master ⊆ contenido de dev (master is ancestor of dev)"
            exit 0
          fi
          # Not ancestor - show what's in master not in dev
          DIFF_LOG=$(git log --oneline "$DEV_REF".."$MASTER_REF" 2>/dev/null | head -20)
          if [ -n "$DIFF_LOG" ]; then
            echo "::error::Contenido de master NO está contenido en dev. Commits en master no en dev:"
            echo "$DIFF_LOG"
            exit 1
          fi
          # Fallback diff check
          DIFF_STAT=$(git diff "$MASTER_REF".."$DEV_REF" --stat 2>/dev/null)
          if [ -n "$DIFF_STAT" ] && [ "$DIFF_STAT" != "0 files changed" ]; then
            echo "::warning::Diff no vacío pero master es ancestro - OK (dev ahead)"
            echo "content_equality=YES" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "content_equality=YES" >> $GITHUB_OUTPUT
          echo "✅ Contenido de master ⊆ contenido de dev"

      # ──────────────────────────────────────────────────────────────
      # Regla 3: No commits huérfanos en master (excluyendo merges PR + conv. commits)
      # ──────────────────────────────────────────────────────────────
      - name: Check orphan commits in master
        id: check-orphan-commits
        run: |
          python3 << 'PYEOF'
          import subprocess, re, sys

          for ref in ('origin/master', 'origin/dev'):
              try:
                  subprocess.check_output(['git', 'rev-parse', '--verify', ref], stderr=subprocess.DEVNULL)
              except subprocess.CalledProcessError:
                  print(f"::warning::Ref {ref} no disponible localmente; saltando Regla 3.")
                  sys.exit(0)

          try:
              out = subprocess.check_output(['git', 'log', '--oneline', 'origin/dev..origin/master'], text=True)
          except subprocess.CalledProcessError as e:
              print(f"::warning::git log origin/dev..origin/master falló: {e}. Saltando Regla 3.")
              sys.exit(0)
          lines = out.strip().split('\n')

          allowed_patterns = [
              r'Merge pull request',
              r'ci\(',
              r'fix\(',
              r'feat\(',
              r'chore\(',
              r'docs\(',
              r'refactor\(',
              r'perf\(',
              r'test\(',
              r'build\(',
              r'revert\(',
              r'ci:',
              r'\(#\d+\)',  # PR reference
          ]

          orphans = []
          for line in lines:
              if not line.strip():
                  continue
              allowed = any(re.search(p, line) for p in allowed_patterns)
              if not allowed:
                  orphans.append(line)

          if orphans:
              print("::error::Commits en master que NO están en dev (excluyendo merges PR + commits convencionales):")
              for o in orphans:
                  print(f"  - {o}")
              sys.exit(1)

          print("✅ No hay commits huérfanos en master")
          PYEOF

      # ──────────────────────────────────────────────────────────────
      # Regla 4: Force-push detectado en últimas 24h (master y dev)
      # ──────────────────────────────────────────────────────────────
      - name: Check force-push in last 24h (master/dev)
        id: check-force-push
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          FORCE_PUSH_COUNT=0
          for branch in master dev; do
            # El runner de GitHub Actions deshabilita reflog por defecto; tratamos
            # reflog vacío o no disponible como 0 force-pushes en vez de fallar.
            COUNT=$( { git reflog --since="24 hours ago" --format="%gs" "$branch" 2>/dev/null || true; } | grep -E "force-push|push --force" | wc -l | tr -d ' ')
            COUNT=${COUNT:-0}
            FORCE_PUSH_COUNT=$((FORCE_PUSH_COUNT + COUNT))
            if [ "$COUNT" -gt 0 ]; then
              echo "::warning::$branch: $COUNT force-push(es) detectados en últimas 24h"
              { git reflog --since="24 hours ago" --format="%h %gs" "$branch" 2>/dev/null || true; } | grep -E "force-push|push --force" | sed "s/^/  $branch: /"
            fi
          done
          echo "force_push_count=$FORCE_PUSH_COUNT" >> $GITHUB_OUTPUT
          if [ "$FORCE_PUSH_COUNT" -gt 0 ]; then
            echo "::error::Force-push detectado en master/dev en últimas 24h. Solo permitido para rollback documentado o backport sync (ver GOVERNANCE.md §5)."
            exit 1
          fi
          echo "✅ No force-push detectado en últimas 24h"

      # ──────────────────────────────────────────────────────────────
      # Resumen final
      # ──────────────────────────────────────────────────────────────
      - name: Governance summary
        if: always()
        env:
          GITHUB_EVENT_NAME_LOCAL: ${{ github.event_name }}
        run: |
          python3 << 'PYEOF'
          import subprocess, re, os

          def sh(cmd):
              try:
                  return subprocess.check_output(['bash', '-c', cmd], text=True, stderr=subprocess.DEVNULL).strip()
              except subprocess.CalledProcessError:
                  return ""

          def ref_exists(ref):
              try:
                  subprocess.check_output(['git', 'rev-parse', '--verify', ref], stderr=subprocess.DEVNULL)
                  return True
              except subprocess.CalledProcessError:
                  return False

          # Regla 1
          extra = sh('git ls-remote --heads origin | grep -vE "refs/heads/(master|dev)$" | wc -l')
          try:
              extra_n = int(extra or 0)
          except ValueError:
              extra_n = -1

          # Regla 2 (usar origin/* con fallback a HEAD)
          master_ref = 'origin/master' if ref_exists('origin/master') else 'HEAD'
          dev_ref = 'origin/dev' if ref_exists('origin/dev') else 'HEAD'
          diff = sh(f'git diff {master_ref}..{dev_ref} --stat')
          content_ok = "YES" if not diff or diff == "0 files changed" else "NO"

          # Regla 3
          out = sh('git log --oneline origin/dev..origin/master') if ref_exists('origin/dev') and ref_exists('origin/master') else ""
          lines = out.split('\n') if out else []
          allowed_patterns = [
              r'Merge pull request', r'ci\(', r'fix\(', r'feat\(', r'chore\(',
              r'docs\(', r'refactor\(', r'perf\(', r'test\(', r'build\(', r'revert\(', r'ci:', r'\(#\d+\)'
          ]
          orphans = [l for l in lines if l.strip() and not any(re.search(p, l) for p in allowed_patterns)]

          # Regla 4 (solo relevante en push; reflog puede estar vacío)
          force = 0
          if os.environ.get('GITHUB_EVENT_NAME_LOCAL') == 'push':
              for b in ['master', 'dev']:
                  try:
                      cnt_raw = subprocess.check_output(
                          ['bash', '-c', f'git reflog --since="24 hours ago" --format="%gs" {b} 2>/dev/null || true'],
                          text=True,
                      )
                      cnt = len([ln for ln in cnt_raw.splitlines() if re.search(r'force-push|push --force', ln)])
                      force += cnt
                  except subprocess.CalledProcessError:
                      pass

          remote_branches = sh('git ls-remote --heads origin').count('\n') + (1 if sh('git ls-remote --heads origin') else 0)

          print("==================================")
          print("  BRANCH GOVERNANCE SUMMARY")
          print("==================================")
          print(f"Remote branches: {remote_branches} (expected: 2, extra: {extra_n})")
          print(f"master content ⊆ dev content ({master_ref}..{dev_ref}): {content_ok}")
          print(f"Orphan commits in master: {len(orphans)}")
          print(f"Force-push (24h, push-only): {force}")
          print("==================================")
          PYEOF
