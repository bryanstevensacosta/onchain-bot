services:
  postgres:
    image: postgres:16-alpine
    container_name: onchain-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onchain}
      POSTGRES_DB: ${POSTGRES_DB:-onchain_bot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - onchain-bot-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onchain} -d ${POSTGRES_DB:-onchain_bot}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  onchain-bot-pg-data:
    name: onchain-bot-pg-data
