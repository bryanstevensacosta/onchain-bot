# Centralized local dev — ONE compose for the whole monorepo.
#
# Usage: docker compose -f docker-compose.dev.yml up --build
# Docs: ./DEV-LOCAL.md (URLs, logs, stop/clean, troubleshooting).
#
# Design (read before changing):
# - Apps build from source (builder stage of each prod Dockerfile) and run
#   their documented watch command (`start:dev` = nest --watch, except
#   backend = tsc-watch + nodemon, frontend = vite). Only ./apps/<app>/src
#   is bind-mounted so the image's linux node_modules stay intact
#   (host darwin binaries would break inside the container).
# - DBs are PER APP (C-DB-01 pattern, same DB names as each app's own
#   docker-compose.yml). kol-calls-publisher shares kol-calls' DB (P51).
#   Ingestion shares the backend postgres (pre-existing dev layout).
# - ALL secrets are dummies. Explicit `environment:` wins over `env_file`
#   (Nest ConfigModule: real env > env files). NEVER point env_file at a
#   file holding real credentials (ingestion .env has the real MTProto
#   triple — it is NOT referenced here).
# - Port clash fixed vs per-app composes: telegram-bots-gateway postgres
#   used host :5436 in its own compose, colliding with feed-publisher pg
#   :5436. Here the gateway pg is on host :5437 (container port unchanged).
# - Dev ports are the container/dev defaults (dexter :4060, threads :4100).
#   :4061/:4101 are the STAGING host ports (C-PORTS-01 triplets), not dev.

name: onchain-bot-dev-central

services:
  # ---------------------------------------------------------------- infra
  pg-backend:
    image: postgres:16-alpine
    container_name: onchain-dev-pg-backend
    restart: unless-stopped
    environment:
      POSTGRES_USER: onchain_bot
      POSTGRES_PASSWORD: onchain_bot
      POSTGRES_DB: onchain_bot
    ports:
      - '5432:5432'
    volumes:
      - dev-central-pg-backend:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onchain_bot -d onchain_bot']
      interval: 5s
      timeout: 3s
      retries: 10

  redis-backend:
    image: redis:7-alpine
    container_name: onchain-dev-redis-backend
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - dev-central-redis-backend:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  pg-kol:
    image: postgres:16
    container_name: onchain-dev-pg-kol
    restart: unless-stopped
    environment:
      POSTGRES_USER: onchain_bot
      POSTGRES_PASSWORD: onchain_bot
      POSTGRES_DB: onchain_bot_kol_system
    ports:
      - '5435:5432'
    volumes:
      - dev-central-pg-kol:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onchain_bot -d onchain_bot_kol_system']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-kol:
    image: redis:7
    container_name: onchain-dev-redis-kol
    restart: unless-stopped
    ports:
      - '6382:6379'
    volumes:
      - dev-central-redis-kol:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  pg-feed:
    image: postgres:16
    container_name: onchain-dev-pg-feed
    restart: unless-stopped
    environment:
      POSTGRES_USER: onchain_bot
      POSTGRES_PASSWORD: onchain_bot
      POSTGRES_DB: onchain_bot_feed_publisher
    ports:
      - '5436:5432'
    volumes:
      - dev-central-pg-feed:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U onchain_bot -d onchain_bot_feed_publisher']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-feed:
    image: redis:7
    container_name: onchain-dev-redis-feed
    restart: unless-stopped
    ports:
      - '6383:6379'
    volumes:
      - dev-central-redis-feed:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # NOTE: own per-app compose used host :5436 here — same as pg-feed above.
  # Centralized file remaps the gateway pg to host :5437 (container :5432).
  pg-gateway:
    image: postgres:16
    container_name: onchain-dev-pg-gateway
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onchain_bot_bots
    ports:
      - '5437:5432'
    volumes:
      - dev-central-pg-gateway:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d onchain_bot_bots']
      interval: 10s
      timeout: 5s
      retries: 5

  pg-market:
    image: postgres:16
    container_name: onchain-dev-pg-market
    restart: unless-stopped
    environment:
      POSTGRES_USER: onchain_bot
      POSTGRES_PASSWORD: onchain_bot
      POSTGRES_DB: onchain_bot_market_data
    ports:
      - '5438:5432'
    volumes:
      - dev-central-pg-market:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U onchain_bot -d onchain_bot_market_data']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-market:
    image: redis:7
    container_name: onchain-dev-redis-market
    restart: unless-stopped
    ports:
      - '6385:6379'
    volumes:
      - dev-central-redis-market:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  pg-dexter:
    image: postgres:16
    container_name: onchain-dev-pg-dexter
    restart: unless-stopped
    environment:
      POSTGRES_USER: onchain_bot
      POSTGRES_PASSWORD: onchain_bot
      POSTGRES_DB: onchain_bot_dexter
    ports:
      - '5440:5432'
    volumes:
      - dev-central-pg-dexter:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onchain_bot -d onchain_bot_dexter']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-dexter:
    image: redis:7
    container_name: onchain-dev-redis-dexter
    restart: unless-stopped
    ports:
      - '6387:6379'
    volumes:
      - dev-central-redis-dexter:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  pg-scheduling:
    image: postgres:16
    container_name: onchain-dev-pg-scheduling
    restart: unless-stopped
    environment:
      POSTGRES_USER: onchain_bot
      POSTGRES_PASSWORD: onchain_bot
      POSTGRES_DB: onchain_bot_scheduling
    ports:
      - '5442:5432'
    volumes:
      - dev-central-pg-scheduling:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onchain_bot -d onchain_bot_scheduling']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-scheduling:
    image: redis:7
    container_name: onchain-dev-redis-scheduling
    restart: unless-stopped
    ports:
      - '6389:6379'
    volumes:
      - dev-central-redis-scheduling:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  pg-aiml:
    image: postgres:16
    container_name: onchain-dev-pg-aiml
    restart: unless-stopped
    environment:
      POSTGRES_USER: onchain_bot
      POSTGRES_PASSWORD: onchain_bot
      POSTGRES_DB: onchain_bot_ai_ml
    ports:
      - '5444:5432'
    volumes:
      - dev-central-pg-aiml:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onchain_bot -d onchain_bot_ai_ml']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-aiml:
    image: redis:7
    container_name: onchain-dev-redis-aiml
    restart: unless-stopped
    ports:
      - '6391:6379'
    volumes:
      - dev-central-redis-aiml:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  pg-threads:
    image: postgres:16
    container_name: onchain-dev-pg-threads
    restart: unless-stopped
    environment:
      POSTGRES_USER: onchain_bot
      POSTGRES_PASSWORD: onchain_bot
      POSTGRES_DB: onchain_bot_threads
    ports:
      - '5446:5432'
    volumes:
      - dev-central-pg-threads:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onchain_bot -d onchain_bot_threads']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-threads:
    image: redis:7
    container_name: onchain-dev-redis-threads
    restart: unless-stopped
    ports:
      - '6393:6379'
    volumes:
      - dev-central-redis-threads:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------ apps
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: build
    container_name: onchain-dev-backend
    restart: unless-stopped
    env_file:
      - path: apps/backend/.env.development
        required: false
    environment:
      NODE_ENV: development
      PORT: 3030
      DATABASE_ENABLED: 'true'
      POSTGRES_HOST: pg-backend
      POSTGRES_PORT: 5432
      POSTGRES_USER: onchain_bot
      POSTGRES_PASSWORD: onchain_bot
      POSTGRES_DB: onchain_bot
      DATABASE_SYNCHRONIZE: 'true'
      DATABASE_LOGGING: 'false'
      REDIS_HOST: redis-backend
      REDIS_PORT: 6379
      INGESTION_TELEGRAM_URL: http://ingestion:3031
    ports:
      - '3030:3030'
    volumes:
      - ./apps/backend/src:/repo/apps/backend/src
    depends_on:
      pg-backend:
        condition: service_healthy
      redis-backend:
        condition: service_healthy
      ingestion:
        condition: service_started
    command: npm run start:dev -w @onchain-bot/backend
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3030/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  ingestion:
    build:
      context: .
      dockerfile: apps/ingestion-telegram/Dockerfile
      target: builder
    container_name: onchain-dev-ingestion
    restart: unless-stopped
    # NO env_file: apps/ingestion-telegram/.env holds the REAL MTProto
    # triple and must never be loaded here. All values below are dummies.
    environment:
      NODE_ENV: development
      INGESTION_PORT: 3031
      # Dummy MTProto creds (pass format validation only). Real Telegram
      # stays OFF in centralized dev: listener connect fails/retries, the
      # HTTP API + SSE still serve. See DEV-LOCAL.md.
      INGESTION_TELEGRAM_MTPROTO_API_ID: 1
      INGESTION_TELEGRAM_MTPROTO_API_HASH: dev-dummy-hash-0000000000000000000000
      INGESTION_TELEGRAM_MTPROTO_SESSION: dev-dummy-session
      INGESTION_TELEGRAM_MTPROTO_LOG_LEVEL: error
      DATABASE_ENABLED: 'true'
      INGESTION_DATABASE_HOST: pg-backend
      INGESTION_DATABASE_PORT: 5432
      INGESTION_DATABASE_NAME: onchain_bot_ingestion
      INGESTION_DATABASE_USER: onchain_bot
      INGESTION_DATABASE_PASSWORD: onchain_bot
      INGESTION_REDIS_HOST: redis-backend
      INGESTION_REDIS_PORT: 6379
    ports:
      - '3031:3031'
    volumes:
      - ./apps/ingestion-telegram/src:/app/apps/ingestion-telegram/src
      - dev-central-ingestion-uploads:/app/uploads
    depends_on:
      pg-backend:
        condition: service_healthy
      redis-backend:
        condition: service_healthy
    command: npm run start:dev -w @onchain-bot/ingestion-telegram
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3031/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  feed-publisher:
    build:
      context: .
      dockerfile: apps/feed-publisher/Dockerfile
      target: builder
    container_name: onchain-dev-feed-publisher
    restart: unless-stopped
    env_file:
      - path: apps/feed-publisher/.env.development
        required: false
    environment:
      NODE_ENV: development
      FEED_PUBLISHER_PORT: 3040
      DATABASE_URL: postgres://onchain_bot:onchain_bot@pg-feed:5432/onchain_bot_feed_publisher
      REDIS_URL: redis://redis-feed:6379/0
      DATABASE_SYNCHRONIZE: 'true'
      ENCRYPTION_KEY: dev-dummy-encryption-key-00000000000000000000000000000000
      MATCHING_ENABLED: 'false'
      LLM_ENABLED: 'false'
      PUBLISHING_ENABLED: 'false'
    ports:
      - '3040:3040'
    volumes:
      - ./apps/feed-publisher/src:/app/apps/feed-publisher/src
    depends_on:
      pg-feed:
        condition: service_healthy
      redis-feed:
        condition: service_healthy
    command: npm run start:dev -w @onchain-bot/feed-publisher
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3040/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  kol-calls:
    build:
      context: .
      dockerfile: apps/kol-calls/Dockerfile
      target: builder
    container_name: onchain-dev-kol-calls
    restart: unless-stopped
    env_file:
      - path: apps/kol-calls/.env.development
        required: false
    environment:
      NODE_ENV: development
      KOL_CALLS_ENABLED: 'true'
      KOL_CALLS_PORT: 3050
      DATABASE_URL: postgres://onchain_bot:onchain_bot@pg-kol:5432/onchain_bot_kol_system
      REDIS_URL: redis://redis-kol:6379/0
      DATABASE_SYNCHRONIZE: 'true'
      ENCRYPTION_KEY: dev-dummy-encryption-key-00000000000000000000000000000000
      INGESTION_TELEGRAM_URL: http://ingestion:3031
      USE_DATA_SERVICE_API: 'true'
      MARKET_DATA_URL: http://market-data:4000
      BOTS_GATEWAY_URL: http://gateway:4070
      KOL_PUBLISH_MODE: dual
    ports:
      - '3050:3050'
    volumes:
      - ./apps/kol-calls/src:/app/apps/kol-calls/src
    depends_on:
      pg-kol:
        condition: service_healthy
      redis-kol:
        condition: service_healthy
    command: npm run start:dev -w @onchain-bot/kol-calls
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3050/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  kol-calls-publisher:
    build:
      context: .
      dockerfile: apps/kol-calls-publisher/Dockerfile
      target: builder
    container_name: onchain-dev-kol-calls-publisher
    restart: unless-stopped
    env_file:
      - path: apps/kol-calls-publisher/.env.development
        required: false
    environment:
      NODE_ENV: development
      KOL_CALLS_PUBLISHER_ENABLED: 'true'
      KOL_CALLS_PUBLISHER_PORT: 3060
      # SAME logical DB as kol-calls initially (P51) — no own postgres.
      DATABASE_URL: postgres://onchain_bot:onchain_bot@pg-kol:5432/onchain_bot_kol_system
      REDIS_URL: redis://redis-kol:6379/0
      DATABASE_SYNCHRONIZE: 'true'
      ENCRYPTION_KEY: dev-dummy-encryption-key-00000000000000000000000000000000
      KOL_CALLS_URL: http://kol-calls:3050
      MARKET_DATA_URL: http://market-data:4000
      BOTS_GATEWAY_URL: http://gateway:4070
      KOL_PUBLISH_MODE: dual
    ports:
      - '3060:3060'
    volumes:
      - ./apps/kol-calls-publisher/src:/app/apps/kol-calls-publisher/src
    depends_on:
      pg-kol:
        condition: service_healthy
      redis-kol:
        condition: service_healthy
      kol-calls:
        condition: service_started
    command: npm run start:dev -w @onchain-bot/kol-calls-publisher
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3060/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  market-data:
    build:
      context: .
      dockerfile: apps/market-data/Dockerfile
      target: builder
    container_name: onchain-dev-market-data
    restart: unless-stopped
    env_file:
      - path: apps/market-data/.env.development
        required: false
    environment:
      NODE_ENV: development
      MARKET_DATA_PORT: 4000
      DATABASE_URL: postgres://onchain_bot:onchain_bot@pg-market:5432/onchain_bot_market_data
      REDIS_URL: redis://redis-market:6379/0
      DATABASE_SYNCHRONIZE: 'true'
      ENCRYPTION_KEY: dev-dummy-encryption-key-00000000000000000000000000000000
    ports:
      - '4000:4000'
    volumes:
      - ./apps/market-data/src:/app/apps/market-data/src
    depends_on:
      pg-market:
        condition: service_healthy
      redis-market:
        condition: service_healthy
    command: npm run start:dev -w @onchain-bot/market-data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  dexter:
    build:
      context: .
      dockerfile: apps/dexter-onchain-bot/Dockerfile
      target: builder
    container_name: onchain-dev-dexter
    restart: unless-stopped
    env_file:
      - path: apps/dexter-onchain-bot/.env.development
        required: false
    environment:
      NODE_ENV: development
      DEXTER_PORT: 4060
      DATABASE_URL: postgres://onchain_bot:onchain_bot@pg-dexter:5432/onchain_bot_dexter
      REDIS_URL: redis://redis-dexter:6379/0
      DATABASE_SYNCHRONIZE: 'true'
      ENCRYPTION_KEY: dev-dummy-encryption-key-00000000000000000000000000000000
    ports:
      - '4060:4060'
    volumes:
      - ./apps/dexter-onchain-bot/src:/app/apps/dexter-onchain-bot/src
    depends_on:
      pg-dexter:
        condition: service_healthy
      redis-dexter:
        condition: service_healthy
    command: npm run start:dev -w @onchain-bot/dexter-onchain-bot
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4060/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  gateway:
    build:
      context: .
      dockerfile: apps/telegram-bots-gateway/Dockerfile
      target: build
    container_name: onchain-dev-gateway
    restart: unless-stopped
    env_file:
      - path: apps/telegram-bots-gateway/.env.development
        required: false
    environment:
      NODE_ENV: development
      BOTS_GATEWAY_PORT: 4070
      DATABASE_URL: postgres://postgres:postgres@pg-gateway:5432/onchain_bot_bots
      DATABASE_SYNCHRONIZE: 'true'
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    ports:
      - '4070:4070'
    volumes:
      - ./apps/telegram-bots-gateway/src:/app/apps/telegram-bots-gateway/src
      - dev-central-gateway-avatars:/app/uploads/avatars
    depends_on:
      pg-gateway:
        condition: service_healthy
    command: npm run start:dev -w @onchain-bot/telegram-bots-gateway
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4070/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  scheduling:
    build:
      context: .
      dockerfile: apps/scheduling-posts/Dockerfile
      target: builder
    container_name: onchain-dev-scheduling
    restart: unless-stopped
    env_file:
      - path: apps/scheduling-posts/.env.development
        required: false
    environment:
      NODE_ENV: development
      SCHEDULING_POSTS_ENABLED: 'true'
      SCHEDULING_POSTS_PORT: 4080
      DATABASE_URL: postgres://onchain_bot:onchain_bot@pg-scheduling:5432/onchain_bot_scheduling
      REDIS_URL: redis://redis-scheduling:6379/0
      DATABASE_SYNCHRONIZE: 'true'
      ENCRYPTION_KEY: dev-dummy-encryption-key-00000000000000000000000000000000
      BOTS_GATEWAY_URL: http://gateway:4070
    ports:
      - '4080:4080'
    volumes:
      - ./apps/scheduling-posts/src:/app/apps/scheduling-posts/src
    depends_on:
      pg-scheduling:
        condition: service_healthy
      redis-scheduling:
        condition: service_healthy
    command: npm run start:dev -w @onchain-bot/scheduling-posts
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4080/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  ai-ml:
    build:
      context: .
      dockerfile: apps/ai-ml/Dockerfile
      target: builder
    container_name: onchain-dev-ai-ml
    restart: unless-stopped
    env_file:
      - path: apps/ai-ml/.env.development
        required: false
    environment:
      NODE_ENV: development
      AI_ML_PORT: 4090
      DATABASE_URL: postgres://onchain_bot:onchain_bot@pg-aiml:5432/onchain_bot_ai_ml
      REDIS_URL: redis://redis-aiml:6379/0
      DATABASE_SYNCHRONIZE: 'true'
      ENCRYPTION_KEY: dev-dummy-encryption-key-00000000000000000000000000000000
    ports:
      - '4090:4090'
    volumes:
      - ./apps/ai-ml/src:/app/apps/ai-ml/src
    depends_on:
      pg-aiml:
        condition: service_healthy
      redis-aiml:
        condition: service_healthy
    command: npm run start:dev -w @onchain-bot/ai-ml
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4090/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  threads:
    build:
      context: .
      dockerfile: apps/threads-publisher/Dockerfile
      target: builder
    container_name: onchain-dev-threads
    restart: unless-stopped
    env_file:
      - path: apps/threads-publisher/.env.development
        required: false
    environment:
      NODE_ENV: development
      THREADS_PUBLISHER_PORT: 4100
      DATABASE_URL: postgres://onchain_bot:onchain_bot@pg-threads:5432/onchain_bot_threads
      REDIS_URL: redis://redis-threads:6379/0
      DATABASE_SYNCHRONIZE: 'true'
      ENCRYPTION_KEY: dev-dummy-encryption-key-00000000000000000000000000000000
      BOTS_GATEWAY_URL: http://gateway:4070
    ports:
      - '4100:4100'
    volumes:
      - ./apps/threads-publisher/src:/app/apps/threads-publisher/src
    depends_on:
      pg-threads:
        condition: service_healthy
      redis-threads:
        condition: service_healthy
    command: npm run start:dev -w @onchain-bot/threads-publisher
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4100/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    image: node:22-alpine
    container_name: onchain-dev-frontend
    restart: unless-stopped
    working_dir: /app
    # NOTE: vite proxy targets come from ROOT .env.development (see
    # DEV-LOCAL.md step 1) — vite loadEnv reads env files, not
    # process.env, so `environment:` cannot override the proxy.
    ports:
      - '5173:5173'
    volumes:
      - .:/app:cached
      - dev-central-frontend-node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
    command: sh -c "test -f node_modules/.package-lock.json || npm ci --no-audit --no-fund --ignore-scripts; npm run dev -w @onchain-bot/frontend -- --host 0.0.0.0 --port 5173"
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:5173/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # ------------------------------------------------------- unified log UI
  dozzle:
    image: amir20/dozzle:latest
    container_name: onchain-dev-dozzle
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # No healthcheck: distroless image ships no shell/wget/node.

volumes:
  dev-central-pg-backend:
  dev-central-redis-backend:
  dev-central-pg-kol:
  dev-central-redis-kol:
  dev-central-pg-feed:
  dev-central-redis-feed:
  dev-central-pg-gateway:
  dev-central-redis-market:
  dev-central-pg-market:
  dev-central-redis-dexter:
  dev-central-pg-dexter:
  dev-central-redis-scheduling:
  dev-central-pg-scheduling:
  dev-central-redis-aiml:
  dev-central-pg-aiml:
  dev-central-redis-threads:
  dev-central-pg-threads:
  dev-central-ingestion-uploads:
  dev-central-gateway-avatars:
  dev-central-frontend-node_modules:
