name: onchain-bot-threads-publisher

services:
  postgres:
    image: postgres:16
    container_name: onchain-bot-threads-publisher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: onchain_bot
      POSTGRES_PASSWORD: onchain_bot
      POSTGRES_DB: onchain_bot_threads
    ports:
      - '5446:5432'
    volumes:
      - threads-publisher-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onchain_bot -d onchain_bot_threads']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: onchain-bot-threads-publisher-redis
    restart: unless-stopped
    ports:
      - '6393:6379'
    volumes:
      - threads-publisher-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  threads-publisher-postgres-data:
  threads-publisher-redis-data:
