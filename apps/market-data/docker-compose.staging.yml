name: onchain-bot-market-data-staging

# Staging environment - market-data (Tramo 3, per-env model)
#
# MIRROR of apps/feed-publisher/docker-compose.staging.yml (Tramo 2 staging
# prep). DRY-RUN ONLY — no market-data deploy workflow exists yet; nothing
# here has ever been applied to Oracle.
#
# Project name EXPLÍCITO: sin `name:`, compose usa el basename del
# directorio (`market-data`), que COLISIONA con el proyecto del dev compose
# (mismo basename, mismos services postgres/redis) y cada `up` de un lado
# recrea/destruye los contenedores del otro. Misma doctrina que
# backend-staging (`name: onchain-bot-staging`) y feed-publisher staging.
#
# PORTS (verified free repo-wide 2026-09-25 — grep 5439:/6386:/4001: zero
# source/config hits; OPERATOR-CONFIRM both host ports on Oracle with lsof):
# - market-data HTTP host :4001 → container :4000. Triplet market-data
#   4000/4001/4002 (dev/staging/prod) per .env.example.
#   Container port is MARKET_DATA_PORT (default 4000, src/main.ts).
# - postgres host :5439 → container :5432. Dev market-data uses :5438
#   (docker-compose.yml), feed-publisher staging uses :5437, kol-system
#   staging uses :5436 — :5439 is free repo-wide.
# - redis host :6386 → container :6379. Dev market-data uses :6385,
#   feed-publisher staging uses :6384, kol-system staging uses :6383 —
#   :6386 is free repo-wide.
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: onchain-bot-market-data-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onchain_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onchain_bot}
      POSTGRES_DB: ${POSTGRES_DB:-onchain_bot_market_data_staging}
    ports:
      - '5439:5432'
    volumes:
      - onchain-bot-market-data-staging-pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-onchain_bot} -d ${POSTGRES_DB:-onchain_bot_market_data_staging}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: onchain-bot-market-data-redis-staging
    restart: unless-stopped
    ports:
      - '6386:6379'
    volumes:
      - onchain-bot-market-data-staging-redis-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'if [ -n "$REDIS_PASSWORD" ]; then redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}

  market-data:
    build:
      context: ../..
      dockerfile: apps/market-data/Dockerfile
    image: ghcr.io/bryanstevensacosta/onchain-bot-market-data:staging-latest
    container_name: onchain-bot-market-data-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_ENV: staging
      # Container port (src/main.ts reads MARKET_DATA_PORT ?? 4000).
      # Host mapping 4001:4000 below.
      MARKET_DATA_PORT: 4000
      # DB name onchain_bot_market_data_staging per central plan C-DB-01
      # (staging `<base>_<app>_staging`); because market-data reads
      # DATABASE_URL (src/shared/config/database.config.ts).
      DATABASE_URL: postgres://${POSTGRES_USER:-onchain_bot}:${POSTGRES_PASSWORD:-onchain_bot}@postgres:5432/${POSTGRES_DB:-onchain_bot_market_data_staging}
      # Migrations off on staging (never synchronize; persistence wiring
      # lands with later todos).
      DATABASE_SYNCHRONIZE: false
      # Single-string form because market-data reads REDIS_URL
      # (.env.example). Override with MARKET_DATA_REDIS_URL when the
      # staging redis carries a password.
      REDIS_URL: ${MARKET_DATA_REDIS_URL:-redis://redis:6379/1}
    ports:
      - '4001:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # NOTE: market-data image has NO wget/curl (Dockerfile installs only
      # dumb-init) — probe via node like the Dockerfile HEALTHCHECK does.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: onchain-bot-staging-net

volumes:
  onchain-bot-market-data-staging-pg-data:
    name: onchain-bot-market-data-staging-pg-data
  onchain-bot-market-data-staging-redis-data:
    name: onchain-bot-market-data-staging-redis-data
