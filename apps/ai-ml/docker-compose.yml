name: onchain-bot-ai-ml

services:
  postgres:
    image: postgres:16
    container_name: onchain-bot-ai-ml-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: onchain_bot
      POSTGRES_PASSWORD: onchain_bot
      POSTGRES_DB: ai_ml_db
    ports:
      - '5444:5432'
    volumes:
      - ai-ml-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onchain_bot -d ai_ml_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: onchain-bot-ai-ml-redis
    restart: unless-stopped
    ports:
      - '6391:6379'
    volumes:
      - ai-ml-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ai-ml-postgres-data:
  ai-ml-redis-data:
