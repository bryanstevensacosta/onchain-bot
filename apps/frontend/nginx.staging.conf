    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # STAGING TWIN (per-env-ingestion T3): frontend staging queries the staging
  # twin, NOT the prod singleton. Sole functional diff vs nginx.conf is the
  # $ingestion_api upstream below (twin DNS + internal :3031). Lazy-DNS
  # pattern (resolver + variable + rewrite+break) preserved verbatim — with a
  # variable, proxy_pass with a URI part drops the path per nginx docs.
  # Prod nginx.conf keeps the singleton upstream untouched.
  # Precondition: twin container/service `onchain-bot-ingestion-telegram-staging`
  # (docker-compose.staging-ingestion.yml, T1) MUST join onchain-bot-staging-net,
  # the same net this frontend container uses — else this name never resolves.
  # Drift guard: `diff nginx.conf nginx.staging.conf` must show ONLY this hunk.
  # Owner of dual-apply: whoever edits the /ingestion-api/ block in nginx.conf
  # MUST mirror it here (and vice versa).
  location /ingestion-api/ {
    resolver 127.0.0.11 valid=30s;
    set $ingestion_api onchain-bot-ingestion-telegram-staging:3031;
    rewrite ^/ingestion-api/(.*)$ /api/$1 break;
    proxy_pass http://$ingestion_api;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Market-data (Tramo 3, todo 7): same-origin /market-data-api/ prefix,
  # prefix stripped (gateway serves /api/* + /api/v1/*). DEPLOY
  # FOLLOW-UP (todo 8): upstream service not deployed yet — verify
  # `onchain-bot-market-data-staging:4000` resolves at deploy (staging
  # container MUST join onchain-bot-staging-net), else this 502s.
  # Drift guard: `diff nginx.conf nginx.staging.conf` must show ONLY the
  # ingestion + market-data upstream hunks.
  location /market-data-api/ {
    resolver 127.0.0.11 valid=30s;
    set $market_data_api onchain-bot-market-data-staging:4000;
    rewrite ^/market-data-api/(.*)$ /$1 break;
    proxy_pass http://$market_data_api;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  error_page 502 =502 @maintenance;
  location @maintenance {
    default_type application/json;
    return 502 '{"status":"maintenance","message":"Backend is restarting — connection will be retried"}';
  }

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}