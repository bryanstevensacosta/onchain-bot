server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 12m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Strip /api prefix and proxy to backend
  # Frontend always prefixes API calls with /api, but backend has no global prefix
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /dashboard/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /telegram-kol/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /vip-calls/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /token/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /ingestion/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /call-tracking/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /telegram/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /settings/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Ops backups status (GET /ops/backups/status on the backend).
  # Specific prefix only — never bare /ops (frontend route intact).
  location /ops/backups/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /kols {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /crypto-news/messages {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /crypto-news/sources {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /crypto-news/media/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Matching activation (SOLE source: crypto_news_matching_config id=1)
  # GET/PATCH /crypto-news/matching/config on the backend
  location /crypto-news/matching/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /crypto-news-publisher/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /crypto-news-ads/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Threads publisher (mirror of /crypto-news-publisher/ above).
  # Specific prefix only — never bare /threads (frontend route intact).
  location /threads-publisher/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Threads matching activation (SOLE source: threads_matching_configs id=1)
  # GET/PATCH /threads/matching/config + GET /threads/matching/health
  location /threads/matching/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Frontend queries the droplet ingestion singleton directly via the /ingestion-api
  # prefix (same-origin; VITE_API_BASE_URL is empty in Docker builds). Cutover flip
  # DONE 2026-09-18: upstream is now `onchain-bot-ingestion-telegram` (internal port
  # 3031); the OLD name `onchain-bot-ingestion` was retired with the singleton.
  # See `docs/deployment/ingestion-service-runbook.md` — Cutover section.
  # Lazy DNS (variable + Docker embedded resolver) so nginx never fails boot on an
  # unresolvable upstream again ([emerg] host not found → crash-loop, 2026-09-18).
  # NOTE: with a variable, proxy_pass with a URI part drops the path per nginx docs — hence rewrite+break below.
  location /ingestion-api/ {
    resolver 127.0.0.11 valid=30s;
    set $ingestion_api onchain-bot-ingestion-telegram:3031;
    rewrite ^/ingestion-api/(.*)$ /api/$1 break;
    proxy_pass http://$ingestion_api;
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://backend:3030;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  error_page 502 =502 @maintenance;
  location @maintenance {
    default_type application/json;
    return 502 '{"status":"maintenance","message":"Backend is restarting — connection will be retried"}';
  }

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}