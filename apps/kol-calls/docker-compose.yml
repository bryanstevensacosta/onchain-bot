name: onchain-bot-kol-calls

services:
  postgres:
    image: postgres:16
    container_name: onchain-bot-kol-calls-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: onchain_bot
      POSTGRES_PASSWORD: onchain_bot
      POSTGRES_DB: onchain_bot_kol_system
    ports:
      - '5435:5432'
    volumes:
      - kol-calls-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onchain_bot -d onchain_bot_kol_system']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: onchain-bot-kol-calls-redis
    restart: unless-stopped
    ports:
      - '6382:6379'
    volumes:
      - kol-calls-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kol-calls-postgres-data:
  kol-calls-redis-data:
