name: onchain-bot-dexter

services:
  postgres:
    image: postgres:16
    container_name: onchain-bot-dexter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: onchain_bot
      POSTGRES_PASSWORD: onchain_bot
      POSTGRES_DB: onchain_bot_dexter
    ports:
      - '5440:5432'
    volumes:
      - dexter-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U onchain_bot -d onchain_bot_dexter']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: onchain-bot-dexter-redis
    restart: unless-stopped
    ports:
      - '6387:6379'
    volumes:
      - dexter-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dexter-postgres-data:
  dexter-redis-data:
