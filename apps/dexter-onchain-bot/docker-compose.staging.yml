name: onchain-bot-dexter-staging

# Staging environment - dexter-onchain-bot (Tramo 3, todo 9, P13, per-env model)
#
# MIRROR of apps/market-data/docker-compose.staging.yml (Tramo 3 staging
# prep). DRY-RUN ONLY — no dexter deploy workflow exists yet; nothing
# here has ever been applied to Oracle.
#
# Project name EXPLÍCITO: sin `name:`, compose usa el basename del
# directorio (`dexter-onchain-bot`), que COLISIONA con el proyecto del dev
# compose (mismo basename, mismos services postgres/redis) y cada `up` de
# un lado recrea/destruye los contenedores del otro. Misma doctrina que
# backend-staging (`name: onchain-bot-staging`) y market-data staging.
#
# PORTS (verified free repo-wide 2026-09-25 — grep 5441:/6388:/4061: zero
# source/config hits; OPERATOR-CONFIRM both host ports on Oracle with lsof):
# - dexter HTTP host :4061 → container :4060. Triplet dexter
#   4060/4061/4062 (dev/staging/prod) per .env.example (C-PORTS-01).
#   Container port is DEXTER_PORT (default 4060, src/main.ts).
# - postgres host :5441 → container :5432. Dev dexter uses :5440,
#   market-data staging uses :5439, market-data dev :5438,
#   feed-publisher staging :5437 — :5441 is free repo-wide.
# - redis host :6388 → container :6379. Dev dexter uses :6387,
#   market-data staging uses :6386, market-data dev :6385,
#   feed-publisher staging uses :6384 — :6388 is free repo-wide.
#

services:
  postgres:
    image: postgres:16-alpine
    container_name: onchain-bot-dexter-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onchain_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onchain_bot}
      POSTGRES_DB: ${POSTGRES_DB:-onchain_bot_dexter_staging}
    ports:
      - '5441:5432'
    volumes:
      - onchain-bot-dexter-staging-pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-onchain_bot} -d ${POSTGRES_DB:-onchain_bot_dexter_staging}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: onchain-bot-dexter-redis-staging
    restart: unless-stopped
    ports:
      - '6388:6379'
    volumes:
      - onchain-bot-dexter-staging-redis-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'if [ -n "$REDIS_PASSWORD" ]; then redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}

  dexter:
    build:
      context: ../..
      dockerfile: apps/dexter-onchain-bot/Dockerfile
    image: ghcr.io/bryanstevensacosta/onchain-bot-dexter:staging-latest
    container_name: onchain-bot-dexter-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_ENV: staging
      # Container port (src/main.ts reads DEXTER_PORT ?? 4060).
      # Host mapping 4061:4060 below.
      DEXTER_PORT: 4060
      # DB name onchain_bot_dexter_staging per central plan C-DB-01
      # (staging `<base>_<app>_staging`); reserved for future
      # persistence (v1 runs on in-memory chat settings).
      DATABASE_URL: postgres://${POSTGRES_USER:-onchain_bot}:${POSTGRES_PASSWORD:-onchain_bot}@postgres:5432/${POSTGRES_DB:-onchain_bot_dexter_staging}
      DATABASE_SYNCHRONIZE: false
      REDIS_URL: ${DEXTER_REDIS_URL:-redis://redis:6379/2}
    ports:
      - '4061:4060'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # NOTE: dexter image has NO wget/curl (Dockerfile installs only
      # dumb-init) — probe via node like the Dockerfile HEALTHCHECK does.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:4060/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: onchain-bot-staging-net

volumes:
  onchain-bot-dexter-staging-pg-data:
    name: onchain-bot-dexter-staging-pg-data
  onchain-bot-dexter-staging-redis-data:
    name: onchain-bot-dexter-staging-redis-data
