services:
  postgres:
    image: postgres:16-alpine
    container_name: alpha-meta-token-scanner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alpha_meta_token_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpha_meta_token_scanner}
      POSTGRES_DB: ${POSTGRES_DB:-alpha_meta_token_scanner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - alpha-meta-token-scanner-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alpha_meta_token_scanner} -d ${POSTGRES_DB:-alpha_meta_token_scanner}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: alpha-meta-token-scanner-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_DISABLE_POSTFIX: "True"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - alpha-meta-token-scanner-pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/preferences.json:/pgadmin4/preferences.json:ro
      - ./pgadmin/queries:/var/lib/pgadmin/storage/admin_admin.com/queries:ro

volumes:
  alpha-meta-token-scanner-pg-data:
    name: alpha-meta-token-scanner-pg-data
  alpha-meta-token-scanner-pgadmin-data:
    name: alpha-meta-token-scanner-pgadmin-data
