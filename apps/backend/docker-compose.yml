# Dev infra (localamento). Project name EXPLÍCITO: sin `name:`, compose usa
# el basename del directorio (`backend`), que COLISIONA con el proyecto del
# staging compose (mismo basename, mismos services postgres/redis) y cada
# `up` de un lado recrea/destruye los contenedores del otro. Ver AGENTS.md.
name: onchain-bot-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: onchain-bot-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onchain_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onchain_bot}
      POSTGRES_DB: ${POSTGRES_DB:-onchain_bot}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - onchain-bot-pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-onchain_bot} -d ${POSTGRES_DB:-onchain_bot}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: onchain-bot-redis-dev
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - onchain-bot-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    # Note: Password optional for local dev (empty REDIS_PASSWORD = no auth)
    # For production, set REDIS_PASSWORD in .env
    command: >
      sh -c "
      if [ -n \"${REDIS_PASSWORD:-}\" ]; then
        redis-server --appendonly yes --requirepass \"${REDIS_PASSWORD}\"
      else
        redis-server --appendonly yes
      fi
      "

  pgadmin:
    image: dpage/pgadmin4
    container_name: onchain-bot-pgadmin-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: 'True'
      PGADMIN_DISABLE_POSTFIX: 'True'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - onchain-bot-pgadmin-data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/preferences.json:/pgadmin4/preferences.json:ro
      - ./pgadmin/queries:/var/lib/pgadmin/storage/admin_admin.com/queries:ro

volumes:
  onchain-bot-pg-data:
    name: onchain-bot-pg-data
  onchain-bot-pgadmin-data:
    name: onchain-bot-pgadmin-data
  onchain-bot-redis-data:
    name: onchain-bot-redis-data
