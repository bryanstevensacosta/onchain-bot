# Staging environment - uses centralized ingestion-telegram
#
# Project name EXPLÍCITO: sin `name:`, compose usa el basename del
# directorio (`backend`), que COLISIONA con el proyecto del dev compose
# (mismo basename, mismos services postgres/redis) y cada `up` de un lado
# recrea/destruye los contenedores del otro. Ver AGENTS.md.
name: onchain-bot-staging
#
# ARCHITECTURE DECISION:
# - ingestion-telegram is STANDALONE and runs on port 3032 (onchain-bot-ingestion-telegram container)
# - Both staging AND production backends consume from the SAME ingestion-telegram service
# - No separate staging ingestion service to avoid:
#   1. MTProto session conflict (AUTH_KEY_DUPLICATED)
#   2. Duplicate crypto-news sources across environments
#   3. Resource waste running multiple identical ingestion instances
#
# Backend connects via: INGESTION_TELEGRAM_URL=http://onchain-bot-ingestion-telegram:3031
# (new var, todo 5; INGESTION_SERVICE_URL stays this release — the code fallback
#  resolves new > old > default, and both point at the NEW container name.
#  Pinned in backend `environment:` below; compose `environment:` wins over
#  .env.staging; dev/localhost is untouched).
# BOOT ORDER: start docker-compose.ingestion.yml FIRST — the ingestion compose
# owns both external nets (onchain-bot-net + onchain-bot-staging-net).
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: onchain-bot-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alpha_meta_token_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpha_meta_token_scanner}
      POSTGRES_DB: ${POSTGRES_DB:-alpha_meta_token_scanner_staging}
    ports:
      - '5433:5432'
    volumes:
      - onchain-bot-staging-pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-alpha_meta_token_scanner} -d ${POSTGRES_DB:-alpha_meta_token_scanner_staging}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: onchain-bot-redis-staging
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - onchain-bot-staging-redis-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'if [ -n "$REDIS_PASSWORD" ]; then redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    image: ghcr.io/bryanstevensacosta/onchain-bot-backend:staging-latest
    container_name: onchain-bot-backend-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_ENV: staging
      # Database connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-alpha_meta_token_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpha_meta_token_scanner}
      POSTGRES_DB: ${POSTGRES_DB:-alpha_meta_token_scanner_staging}
      DATABASE_ENABLED: true
      # Redis connection
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: true
      # Ingestion mode - compose `environment:` wins over .env.staging
      # (dev/localhost untouched). Boot ingestion compose first: it owns both
      # external nets. DNS follows the rename: onchain-bot-ingestion-telegram.
      # INGESTION_TELEGRAM_URL is the new var (todo 5); INGESTION_SERVICE_URL
      # stays this release — the code fallback resolves new > old > default.
      # Both point at the NEW container: the old container_name no longer exists.
      USE_SSE_INGESTION: true
      USE_MOCK_INGESTION: false
      INGESTION_TELEGRAM_URL: http://onchain-bot-ingestion-telegram:3031
      INGESTION_SERVICE_URL: http://onchain-bot-ingestion-telegram:3031
    ports:
      - '3031:3030'
    volumes:
      - onchain-bot-staging-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3030/api/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_APP_ENV: staging
    image: ghcr.io/bryanstevensacosta/onchain-bot-frontend:staging-latest
    container_name: onchain-bot-frontend-staging
    restart: unless-stopped
    ports:
      - '4173:80'
    depends_on:
      - backend
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1/',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  default:
    name: onchain-bot-staging-net

volumes:
  onchain-bot-staging-pg-data:
    name: onchain-bot-staging-pg-data
  onchain-bot-staging-redis-data:
    name: onchain-bot-staging-redis-data
  onchain-bot-staging-uploads:
    name: onchain-bot-staging-uploads
