# Staging environment - per-env ingestion twin (plan per-env-ingestion, T3)
#
# Project name EXPLÍCITO: sin `name:`, compose usa el basename del
# directorio (`backend`), que COLISIONA con el proyecto del dev compose
# (mismo basename, mismos services postgres/redis) y cada `up` de un lado
# recrea/destruye los contenedores del otro. Ver AGENTS.md.
name: onchain-bot-staging
#
# ARCHITECTURE (per-env-ingestion T1+T3 — T7 owns the full invariant rewrite):
# - staging backend consumes the STAGING TWIN
#   (docker-compose.staging-ingestion.yml, project onchain-bot-staging-ingestion,
#   host 127.0.0.1:3033 → container :3031, DNS onchain-bot-ingestion-telegram-staging)
# - production backend keeps the SINGLETON (docker-compose.ingestion.yml holds its DNS)
# - Twin MUST join onchain-bot-staging-net (this file's default net) or the
#   backend/frontend containers cannot resolve the twin DNS name.
#
# Backend connects via: INGESTION_TELEGRAM_URL=http://onchain-bot-ingestion-telegram-staging:3031
# (canonical var, T10: legacy INGESTION_SERVICE_URL fallback removed.
#  Pinned in backend `environment:` below; compose `environment:` wins over
#  .env.staging; dev/localhost is untouched).
# BOOT ORDER: start docker-compose.staging-ingestion.yml FIRST — the twin compose
# owns the staging twin on onchain-bot-staging-net.
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: onchain-bot-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alpha_meta_token_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpha_meta_token_scanner}
      POSTGRES_DB: ${POSTGRES_DB:-alpha_meta_token_scanner_staging}
    ports:
      - '5433:5432'
    volumes:
      - onchain-bot-staging-pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-alpha_meta_token_scanner} -d ${POSTGRES_DB:-alpha_meta_token_scanner_staging}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: onchain-bot-redis-staging
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - onchain-bot-staging-redis-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'if [ -n "$REDIS_PASSWORD" ]; then redis-cli -a "$REDIS_PASSWORD" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    image: ghcr.io/bryanstevensacosta/onchain-bot-backend:staging-latest
    container_name: onchain-bot-backend-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_ENV: staging
      # Database connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-alpha_meta_token_scanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alpha_meta_token_scanner}
      POSTGRES_DB: ${POSTGRES_DB:-alpha_meta_token_scanner_staging}
      DATABASE_ENABLED: true
      # Redis connection
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_ENABLED: true
      # Ingestion mode - compose `environment:` wins over .env.staging
      # (dev/localhost untouched). Boot staging-ingestion compose first: the twin
      # must join onchain-bot-staging-net for this DNS to resolve.
      # INGESTION_TELEGRAM_URL is the canonical var (T10: legacy fallback removed).
      # STAGING TWIN (T3 per-env-ingestion): staging reads the twin, NOT the singleton.
      # Prod keeps the singleton URL (see docker-compose.ingestion.yml).
      USE_SSE_INGESTION: true
      USE_MOCK_INGESTION: false
      INGESTION_TELEGRAM_URL: http://onchain-bot-ingestion-telegram-staging:3031
    ports:
      - '3031:3030'
    volumes:
      - onchain-bot-staging-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1:3030/api/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_APP_ENV: staging
    image: ghcr.io/bryanstevensacosta/onchain-bot-frontend:staging-latest
    container_name: onchain-bot-frontend-staging
    restart: unless-stopped
    ports:
      - '4173:80'
    depends_on:
      - backend
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://127.0.0.1/',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  default:
    name: onchain-bot-staging-net

volumes:
  onchain-bot-staging-pg-data:
    name: onchain-bot-staging-pg-data
  onchain-bot-staging-redis-data:
    name: onchain-bot-staging-redis-data
  onchain-bot-staging-uploads:
    name: onchain-bot-staging-uploads
